<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>面談の申請 | OPS日調アプリ</title>
<!-- 支部ごとの合言葉が入ったURLなので、検索結果に出さない -->
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --navy:#132a4d; --blue:#2f6fd0; --ink:#1f2937;
    --muted:#6b7280; --line:#dfe4ec; --bg:#f5f7fb; --ok:#1a7f4b; --ng:#b42318;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    line-height:1.7}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 60px}
  header{background:var(--navy);color:#fff;padding:18px 16px}
  header .inner{max-width:620px;margin:0 auto}
  header h1{margin:0;font-size:17px;font-weight:700}
  header p{margin:4px 0 0;font-size:13px;opacity:.85}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
  h2{font-size:15px;margin:0 0 4px}
  .hint{font-size:13px;color:var(--muted);margin:0 0 12px}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  input[type=text],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:84px;resize:vertical}
  .staff-list{display:grid;gap:8px}
  .staff-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;
    font-size:15px;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;width:100%}
  .staff-btn[aria-pressed=true]{border-color:var(--blue);background:#eef4fd;font-weight:700}
  .day{margin-top:14px}
  .day h3{font-size:14px;margin:0 0 8px;color:var(--navy)}
  .slots{display:flex;flex-wrap:wrap;gap:8px}
  .slot{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
    font-size:14px;font-family:inherit;color:var(--ink);cursor:pointer;min-width:74px}
  .slot[aria-pressed=true]{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:700}
  .slot:disabled{background:#f1f3f7;color:#aeb4bf;cursor:not-allowed;text-decoration:line-through}
  .rank{display:inline-block;margin-left:6px;font-size:12px}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--blue);
    color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:18px}
  .btn:disabled{background:#a9bcd9;cursor:not-allowed}
  .msg{padding:12px 14px;border-radius:8px;font-size:14px;margin-top:14px}
  .msg.err{background:#fdecea;color:var(--ng);border:1px solid #f5c6c2}
  .msg.info{background:#eef4fd;color:var(--navy);border:1px solid #cfe0f7}
  .done{text-align:center;padding:34px 18px}
  .done .mark{font-size:44px;line-height:1}
  .done h2{font-size:19px;margin:10px 0 6px}
  .chosen{font-size:13px;color:var(--muted);margin-top:8px}
  footer{text-align:center;font-size:12px;color:var(--muted);margin-top:26px}
</style>
</head>
<body>
<header><div class="inner">
  <h1>面談の申請</h1>
  <p id="branchName">読み込んでいます…</p>
</div></header>

<div class="wrap" id="main">
  <div class="card"><p class="hint">読み込んでいます…</p></div>
</div>

<footer>ドットジェイピー OPS</footer>

<script>
/* アカウントを作らずに面談を申請するためのページ。
   URLに入っている合言葉だけが入場条件で、ログインは一切通らない。
   本体（index.html）と混ぜていないのは、ログイン前提の処理を
   誤って通してしまう事故を避けるため。 */

// URLは /i/<合言葉> の形。末尾スラッシュが付いていても拾えるようにする
var TOKEN = (location.pathname.split('/').filter(Boolean)[1] || '');

var state = {
  staff: [],          // 選べるスタッフ
  staffId: null,      // 選んだスタッフ
  days: [],           // 選んだスタッフの空き枠
  picked: [],         // 選んだ枠（並び順がそのまま第1希望・第2希望…）
  sending: false,
};

var MAX_PICK = 3;
var WD = ['日', '月', '火', '水', '木', '金', '土'];

function el(id) { return document.getElementById(id); }

/* 画面に出す文字は必ずここを通す。
   名前やエラー文をそのまま差し込むと、細工されたときに実行されてしまう */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtDate(ymd) {
  var p = ymd.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return p[1].replace(/^0/, '') + '月' + p[2].replace(/^0/, '') + '日（' + WD[d.getDay()] + '）';
}

function api(path, opts) {
  return fetch(path, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (body) {
      if (!r.ok) throw new Error(body.error || '通信に失敗しました');
      return body;
    });
  });
}

function showError(message) {
  el('main').innerHTML = '<div class="card"><div class="msg err">' + esc(message) + '</div></div>';
}

/* ---------- 読み込み ---------- */
function load() {
  api('/api/apply/' + encodeURIComponent(TOKEN)).then(function (data) {
    el('branchName').textContent = data.branch.name;
    state.staff = data.staff || [];
    render();
  }).catch(function (e) { showError(e.message); });
}

/* ---------- 画面 ---------- */
function render() {
  if (!state.staff.length) {
    showError('この支部にはまだ担当できるスタッフがいません。支部の担当者にご連絡ください。');
    return;
  }
  var html = ''
    + '<div class="card">'
    + '  <h2>1. お名前</h2>'
    + '  <p class="hint">担当者が本人を確認するために使います。本名でご記入ください。</p>'
    + '  <label for="name">お名前</label>'
    + '  <input type="text" id="name" autocomplete="name" placeholder="例：山田 太郎" maxlength="50">'
    + '</div>'
    + '<div class="card">'
    + '  <h2>2. 面談したいスタッフ</h2>'
    + '  <p class="hint">選ぶと、その方の空いている時間が下に出ます。</p>'
    + '  <div class="staff-list">' + state.staff.map(function (s) {
      return '<button type="button" class="staff-btn" data-staff="' + esc(s.id) + '"'
        + ' aria-pressed="' + (state.staffId === s.id) + '">'
        + '<span>' + esc(s.nickname) + 'さん</span></button>';
    }).join('') + '</div>'
    + '</div>'
    + '<div id="slotArea"></div>';
  el('main').innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll('.staff-btn'), function (b) {
    b.addEventListener('click', function () { selectStaff(b.getAttribute('data-staff')); });
  });
  renderSlots();
}

function selectStaff(id) {
  if (state.staffId === id) return;
  state.staffId = id;
  state.days = [];
  state.picked = [];
  // 選び直しが分かるよう、先に印だけ移してから枠を取りに行く
  Array.prototype.forEach.call(document.querySelectorAll('.staff-btn'), function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-staff') === id));
  });
  el('slotArea').innerHTML = '<div class="card"><p class="hint">空いている時間を調べています…</p></div>';
  api('/api/apply/' + encodeURIComponent(TOKEN) + '/slots?staff_id=' + encodeURIComponent(id))
    .then(function (data) {
      // 待っている間に別の人を選んでいたら、古い結果は捨てる
      if (state.staffId !== id) return;
      state.days = data.days || [];
      renderSlots();
    })
    .catch(function (e) {
      if (state.staffId !== id) return;
      el('slotArea').innerHTML = '<div class="card"><div class="msg err">' + esc(e.message) + '</div></div>';
    });
}

function renderSlots() {
  var area = el('slotArea');
  if (!area) return;
  if (!state.staffId) { area.innerHTML = ''; return; }

  var open = state.days.filter(function (d) { return d.slots.some(function (s) { return s.ok; }); });
  if (!open.length) {
    area.innerHTML = '<div class="card"><div class="msg info">'
      + 'この方はいま空いている時間がありません。別のスタッフを選ぶか、支部の担当者にご相談ください。'
      + '</div></div>';
    return;
  }

  var html = '<div class="card">'
    + '<h2>3. 希望する時間</h2>'
    + '<p class="hint">最大' + MAX_PICK + 'つまで選べます。選んだ順が第1希望・第2希望…になります。</p>'
    + open.map(function (d) {
      return '<div class="day"><h3>' + esc(fmtDate(d.date)) + '</h3><div class="slots">'
        + d.slots.map(function (s) {
          var rank = state.picked.indexOf(s.iso);
          return '<button type="button" class="slot" data-iso="' + esc(s.iso) + '"'
            + (s.ok ? '' : ' disabled')
            + ' aria-pressed="' + (rank >= 0) + '">' + esc(s.time)
            + (rank >= 0 ? '<span class="rank">第' + (rank + 1) + '</span>' : '')
            + '</button>';
        }).join('')
        + '</div></div>';
    }).join('')
    + '<div class="chosen">' + (state.picked.length ? '選択中：' + state.picked.length + '件' : 'まだ選ばれていません')
    + '</div>'
    + '</div>'
    + '<div class="card">'
    + '  <h2>4. 伝えたいこと（任意）</h2>'
    + '  <p class="hint">オンライン希望、時間の都合など。空欄でも構いません。</p>'
    + '  <textarea id="note" maxlength="500"></textarea>'
    + '</div>'
    + '<div id="sendMsg"></div>'
    + '<button type="button" class="btn" id="send"'
    + (state.picked.length && !state.sending ? '' : ' disabled') + '>'
    + (state.sending ? '送信しています…' : 'この内容で申請する') + '</button>';

  // 入力中の値は作り直しで消えるので、先に控えて後から戻す
  var keepNote = el('note') ? el('note').value : '';
  area.innerHTML = html;
  if (el('note')) el('note').value = keepNote;

  Array.prototype.forEach.call(area.querySelectorAll('.slot'), function (b) {
    if (b.disabled) return;
    b.addEventListener('click', function () { togglePick(b.getAttribute('data-iso')); });
  });
  el('send').addEventListener('click', send);
}

function togglePick(iso) {
  var i = state.picked.indexOf(iso);
  if (i >= 0) {
    state.picked.splice(i, 1);
  } else {
    if (state.picked.length >= MAX_PICK) {
      // 上限に達したら、いちばん古い選択を押し出す（選び直しで詰まらないように）
      state.picked.shift();
    }
    state.picked.push(iso);
  }
  renderSlots();
}

function send() {
  var name = el('name') ? el('name').value.trim() : '';
  var msgBox = el('sendMsg');
  if (!name) {
    msgBox.innerHTML = '<div class="msg err">お名前を入力してください。</div>';
    if (el('name')) el('name').focus();
    return;
  }
  state.sending = true;
  renderSlots();

  api('/api/apply/' + encodeURIComponent(TOKEN), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: name,
      staff_id: state.staffId,
      choices: state.picked,
      note: el('note') ? el('note').value : '',
    }),
  }).then(function (data) {
    el('main').innerHTML = '<div class="card done">'
      + '<div class="mark">✓</div>'
      + '<h2>申請しました</h2>'
      + '<p>' + esc(data.staff_nickname) + 'さんに届きました。<br>'
      + '日程が決まりましたら、担当者からご連絡します。</p>'
      + '<p class="chosen">この画面は閉じていただいて構いません。</p>'
      + '</div>';
    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;
  }).catch(function (e) {
    state.sending = false;
    /* 枠が埋まった場合は、古い枠を出したままにすると同じ失敗を繰り返す。
       取り直してから、何が起きたかを伝える */
    var staffId = state.staffId;
    api('/api/apply/' + encodeURIComponent(TOKEN) + '/slots?staff_id=' + encodeURIComponent(staffId))
      .then(function (data) {
        if (state.staffId !== staffId) return;
        state.days = data.days || [];
        state.picked = [];
        renderSlots();
        el('sendMsg').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
      })
      .catch(function () {
        renderSlots();
        el('sendMsg').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
      });
  });
}

load();
</script>
</body>
</html>
