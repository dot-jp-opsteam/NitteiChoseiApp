<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予約 | OPS日調アプリ</title>
<!-- 合言葉が入ったURLなので、検索結果に出さない -->
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&display=swap">
<!-- 予約スケジュールの予約ページ（/b/<合言葉>）と、予約の変更・キャンセル（/b/manage/<合言葉>）。
     Googleカレンダーの予約ページに見た目と動きを合わせるため、アプリ本体の style.css は読まない
     （外部サイトに埋め込まれることもあるので、アプリの装飾が混ざらないほうがよい）。
     クラス名はすべて bk- で始める（短い名前の衝突を避けるため） -->
<style>
  :root{
    --bk-blue:#1565d8; --bk-blue-d:#0f52b3; --bk-blue-soft:#e8f0fe;
    --bk-ink:#172033; --bk-sub:#4b5565; --bk-line:#d5dae3; --bk-bg:#f4f6fa;
    --bk-panel:#ffffff; --bk-bad:#c5221f; --bk-bad-soft:#fce8e6; --bk-ok:#188038; --bk-ok-soft:#e6f4ea;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bk-bg);color:var(--bk-ink);
    font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;font-weight:500}
  button,input,textarea{font-family:inherit}
  a{color:var(--bk-blue)}
  /* 画面全体で縦にスクロールする。中身が小さな枠の中だけで動くことはない */
  .bk-app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bk-panel);display:flex;flex-direction:column}
  @media (min-width:600px){.bk-app{margin:24px auto;min-height:0;border:1px solid var(--bk-line);border-radius:14px;overflow:hidden}}
  .bk-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bk-line)}
  .bk-brand{color:var(--bk-blue);font-size:20px;font-weight:800}
  .bk-bar-r{display:flex;align-items:center;gap:8px;color:var(--bk-sub);font-size:14px;font-weight:700;min-width:0}
  .bk-bar-r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bk-bar-r svg{width:18px;height:18px;flex:none}
  .bk-body{padding:20px 18px 28px;flex:1}
  .bk-h1{font-size:28px;font-weight:800;margin:0 0 6px;line-height:1.3;word-break:break-word}
  .bk-h2{font-size:18px;font-weight:800;margin:22px 0 10px}
  .bk-sub{color:var(--bk-sub);font-size:15px;font-weight:600;margin:0 0 14px}
  .bk-desc{white-space:pre-wrap;margin:0 0 16px;word-break:break-word;font-size:15px}
  .bk-center{text-align:center}
  .bk-tz{color:var(--bk-sub);font-size:13px;font-weight:600;margin:14px 0 0}
  .bk-fine{color:var(--bk-sub);font-size:13px;font-weight:600;margin:4px 0}
  .bk-note{color:var(--bk-sub);font-size:15px;font-weight:600;padding:18px 0}
  .bk-meta{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-weight:600}
  .bk-meta svg{flex:none;width:20px;height:20px;color:var(--bk-sub);margin-top:2px}

  /* 1週間ぶんの日付を横に収める（横スクロールなし） */
  .bk-weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 10px}
  .bk-weeknav b{font-size:17px;font-weight:800}
  .bk-wbtn{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--bk-blue);font-size:14px;font-weight:700;cursor:pointer;padding:10px 4px;min-height:44px}
  .bk-wbtn svg{width:20px;height:20px}
  .bk-wbtn:disabled{color:#a3abb8;cursor:default}
  .bk-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .bk-dbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--bk-line);border-radius:10px;background:#fff;color:var(--bk-ink);padding:8px 0;cursor:pointer;min-height:64px}
  .bk-dbtn span{font-size:13px;font-weight:700;color:var(--bk-sub)}
  .bk-dbtn b{font-size:20px;font-weight:800}
  .bk-dbtn.bk-sat span{color:#2b62b8}.bk-dbtn.bk-sun span{color:#c5221f}
  .bk-dbtn.bk-nodate{background:#f1f3f7}
  .bk-dbtn.bk-nodate b,.bk-dbtn.bk-nodate span{color:#8a93a3}
  .bk-dbtn.bk-sel{background:var(--bk-blue);border-color:var(--bk-blue)}
  .bk-dbtn.bk-sel span,.bk-dbtn.bk-sel b{color:#fff}
  .bk-dbtn:disabled{opacity:.4;cursor:default}
  .bk-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .bk-slot{border:1.5px solid var(--bk-blue);background:#fff;color:var(--bk-blue);border-radius:8px;padding:14px 4px;font-size:18px;font-weight:700;cursor:pointer;min-height:52px}
  .bk-slot.bk-sel{background:var(--bk-blue);color:#fff}
  .bk-slot:focus-visible,.bk-dbtn:focus-visible,.bk-btn:focus-visible{outline:3px solid #8ab4f8;outline-offset:2px}
  .bk-empty{border:1px dashed var(--bk-line);border-radius:10px;padding:24px 16px;text-align:center;color:var(--bk-sub);font-weight:600}
  .bk-link-btn{border:0;background:none;color:var(--bk-blue);font-size:15px;font-weight:700;cursor:pointer;padding:10px 6px;text-decoration:underline}
  .bk-right{display:block;margin:4px 0 0 auto}
  .bk-back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--bk-blue);font-size:15px;font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:12px;min-height:44px}
  .bk-back svg{width:20px;height:20px}
  .bk-loading{color:var(--bk-sub);padding:40px 0;text-align:center}

  /* 下に張り付くボタン。画面全体のスクロールのまま、いつでも押せる */
  .bk-sticky{position:sticky;bottom:0;background:linear-gradient(to top,#fff 78%,rgba(255,255,255,0));padding:18px 0 8px;margin-top:10px}
  .bk-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:14px 20px;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;min-height:52px}
  .bk-block{display:flex;width:100%}
  .bk-btn.bk-pri{background:var(--bk-blue);color:#fff}
  .bk-btn.bk-pri:hover:not(:disabled){background:var(--bk-blue-d)}
  .bk-btn.bk-ghost{background:transparent;color:var(--bk-blue)}
  .bk-btn.bk-outline{background:#fff;color:var(--bk-blue);border:1.5px solid var(--bk-blue);margin-top:10px}
  .bk-btn.bk-soft{background:var(--bk-bg);color:var(--bk-ink);border:1px solid var(--bk-line);margin-top:10px}
  .bk-btn.bk-line{background:#fff;color:var(--bk-blue);border:1px solid var(--bk-line);font-size:14px;padding:10px 12px;min-height:44px;white-space:nowrap}
  .bk-btn svg{width:20px;height:20px}
  .bk-btn:disabled{opacity:.45;cursor:default}
  .bk-cancel-link{display:block;margin:18px auto 0;border:0;background:none;color:var(--bk-bad);font-size:15px;font-weight:700;text-decoration:underline;cursor:pointer;padding:10px}

  /* 入力 */
  .bk-card2{background:var(--bk-bg);border:1px solid var(--bk-line);border-radius:12px;padding:12px 14px;margin:6px 0 18px}
  .bk-summary .bk-sumtitle{font-size:18px;font-weight:800;margin-bottom:4px}
  .bk-field{margin-bottom:16px}
  .bk-field label{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin-bottom:6px}
  .bk-badge{font-size:12px;font-weight:800;border-radius:4px;padding:1px 6px;background:#eceff4;color:var(--bk-sub)}
  .bk-badge.bk-req{background:var(--bk-bad-soft);color:var(--bk-bad)}
  .bk-field input,.bk-field textarea{width:100%;border:1px solid var(--bk-line);border-radius:10px;padding:13px 14px;font-size:17px;color:var(--bk-ink);background:#fff;font-weight:500}
  .bk-field textarea{min-height:88px;resize:vertical}
  .bk-field input:focus,.bk-field textarea:focus{outline:2px solid var(--bk-blue);outline-offset:-1px;border-color:var(--bk-blue)}
  .bk-inline{display:flex;gap:8px}.bk-inline input{flex:1;min-width:0}
  .bk-banner{border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px;font-weight:700}
  .bk-banner.bk-bad{background:var(--bk-bad-soft);color:var(--bk-bad)}

  /* 完了・予約の確認 */
  .bk-done{padding:12px 0 4px}
  .bk-done-mark{width:64px;height:64px;border-radius:50%;background:var(--bk-blue);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .bk-done-mark.bk-x{background:var(--bk-bad-soft);color:var(--bk-bad)}
  .bk-done-mark svg{width:34px;height:34px}
  .bk-closed{max-width:520px;margin:60px auto;text-align:center;color:var(--bk-sub);background:#fff;border:1px solid var(--bk-line);border-radius:12px;padding:40px 24px}
  .bk-closed h2{color:var(--bk-ink);font-weight:800}

  /* ダイアログ（日時変更・キャンセルの確認） */
  .bk-scrim{position:fixed;inset:0;background:rgba(23,32,51,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .bk-scrim.bk-open{display:flex}
  .bk-dialog{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow:auto}
  .bk-dialog-head{padding:18px 20px 6px;display:flex;align-items:flex-start;gap:8px}
  .bk-dialog-head h3{font-size:20px;font-weight:800;margin:0;flex:1}
  .bk-dialog-body{padding:4px 20px 8px}
  .bk-dialog-foot{padding:12px 20px 20px;display:flex;justify-content:flex-end;gap:8px}
  .bk-summary2{background:var(--bk-bg);border-radius:10px;padding:10px 14px;margin:4px 0 12px;font-weight:600}
  .bk-icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:50%;cursor:pointer;color:var(--bk-sub);display:inline-flex;align-items:center;justify-content:center}
  .bk-icon-btn svg{width:20px;height:20px}

  #bkToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#222a3a;color:#fff;
    padding:12px 18px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);font-weight:700}
  #bkToast.bk-show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){#bkToast{transition:none}}

  /* 画像03に合わせた細部（2026-10-29 再調整） */
  .bk-bar{min-height:64px}
  .bk-brand{font-size:24px;letter-spacing:.01em}
  .bk-bar2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .bk-bar2 .bk-back{margin:0;justify-self:start;color:var(--bk-ink)}
  .bk-bar-t{font-size:19px;font-weight:800;text-align:center}
  .bk-h1{font-size:32px}
  .bk-sub{font-size:17px;font-weight:500}
  .bk-weeknav .bk-wbtn span{color:var(--bk-ink);font-weight:600}
  .bk-weeknav .bk-wbtn svg{color:var(--bk-blue)}
  .bk-dbtn{border-radius:8px}
  .bk-dbtn span{font-size:14px}
  .bk-h2{font-size:20px}
  .bk-slot{border-radius:6px;font-size:19px;font-weight:500;min-height:58px}
  .bk-when{padding:18px 20px;margin-top:4px}
  .bk-when .bk-meta{font-size:19px;font-weight:600}
  .bk-when .bk-right{margin-top:0}
  .bk-field label{font-size:17px}
  .bk-badge.bk-req{font-size:12px;padding:2px 8px}
  .bk-done-mark{width:76px;height:76px}
  .bk-done-mark svg{width:40px;height:40px}
  .bk-summary .bk-sumtitle{font-size:19px;margin-bottom:8px}
  .bk-summary .bk-meta{font-size:17px;font-weight:500}
  .bk-btn.bk-outline{border-radius:6px}
  .bk-btn.bk-soft{border-radius:6px;font-weight:700}
  /* 大きさの調整（2026-10-29）：全体が大きく威圧感があったため一段小さくする */
  .bk-bar{min-height:54px}
  .bk-brand{font-size:19px}
  .bk-bar-t{font-size:16px}
  .bk-h1{font-size:24px}
  .bk-sub{font-size:14px;font-weight:600}
  .bk-h2{font-size:16px}
  .bk-slot{font-size:16px;font-weight:600;min-height:46px}
  .bk-when{padding:14px 16px}
  .bk-when .bk-meta{font-size:16px}
  .bk-field label{font-size:14px}
  .bk-done-mark{width:60px;height:60px}
  .bk-done-mark svg{width:32px;height:32px}
  .bk-summary .bk-sumtitle{font-size:16px}
  .bk-summary .bk-meta{font-size:14px;font-weight:600}
  .bk-dbtn{min-height:54px;padding:6px 0}
  .bk-dbtn b{font-size:17px}
  .bk-btn{font-size:15px;padding:11px 18px;min-height:46px}
  @media (max-width:380px){.bk-h1{font-size:22px}.bk-dbtn b{font-size:16px}.bk-slot{font-size:15px}}
</style>
</head>
<body>
<main id="bkMain"><div class="bk-loading">読み込んでいます…</div></main>
<div class="bk-scrim" id="bkScrim" onclick="if(event.target===this)closeDialog()">
  <div class="bk-dialog" id="bkDialog" role="dialog" aria-modal="true"></div>
</div>
<div id="bkToast" role="status"></div>

<script>
/* 予約スケジュールの公開ページ。ログインは通らない。
   /b/<合言葉>          … 空いている枠を選んで予約する
   /b/manage/<合言葉>   … 予約の確認・日時の変更・キャンセル
   枠の判断はすべてサーバーが持つ（ここは並べるだけ）。時刻は日本時間で固定 */
'use strict';

const PARTS = location.pathname.split('/').filter(Boolean);
const MODE = PARTS[1] === 'manage' ? 'manage' : 'book';
const TOKEN = MODE === 'manage' ? (PARTS[2] || '') : (PARTS[1] || '');
const DOW = ['日', '月', '火', '水', '木', '金', '土'];

const S = {
  info: null,          // ページの情報（タイトル・長さ・質問など）
  manage: null,        // 変更ページのときの予約
  slots: {},           // 'YYYY-MM-DD' -> ['09:00', ...]
  loaded: [],          // 読み込み済みの範囲 [fromYmd, toYmd)（文字列比較で足りる）
  weekStart: null,     // 表示中の週の先頭（日曜）
  month: null,         // ミニカレンダーの月（1日）
  selDay: null,        // 選んだ日（スマホの一覧・ミニカレンダーの印）
  picking: false,      // 変更ページで日時を選び直しているか
  busy: false,
  error: '',
  step: 'pick',        // 予約ページの画面：pick（日時）→ form（入力）→ done（完了）
  done: null,          // 予約が済んだときの控え
  loading: false,
  notice: '',
};

/* ---------- 小道具 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYmd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function sunday(d){var x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x;}
function todayYmd(){return ymd(new Date());}
/* 枠の開始時刻（日本時間の 'YYYY-MM-DD' と 'HH:MM'）を、ずれない形の日時にする */
function slotIso(day,time){return new Date(day+'T'+time+':00+09:00').toISOString();}
function addMin(time,min){var p=time.split(':').map(Number);var t=p[0]*60+p[1]+min;return pad(Math.floor(t/60))+':'+pad(t%60);}
function dayLabel(day){var d=parseYmd(day);return (d.getMonth()+1)+'月'+d.getDate()+'日('+DOW[d.getDay()]+')';}
function shortDay(day){var d=parseYmd(day);return (d.getMonth()+1)+'月'+d.getDate()+'日（'+DOW[d.getDay()]+'）';}
function longDay(day){var d=parseYmd(day);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+DOW[d.getDay()]+'曜日';}
function toast(msg){var t=document.getElementById('bkToast');t.textContent=msg;t.classList.add('bk-show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('bk-show');},2600);}

async function api(path,opts){
  opts=opts||{};
  try{
    var r=await fetch(path,{method:opts.method||'GET',headers:{'Content-Type':'application/json'},
      body:opts.body?JSON.stringify(opts.body):undefined});
    var data=await r.json().catch(function(){return {};});
    return {ok:r.ok,status:r.status,data:data};
  }catch(e){return {ok:false,status:0,data:{error:'通信できませんでした。電波の良いところでやり直してください'}};}
}

const IC = {
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  person:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  monitor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>',
};

/* ---------- 枠の読み込み ----------
   1回に42日（月のカレンダー1枚）ずつ読む。読み込み済みの日は聞き直さない */
function slotsPath(){return MODE==='manage'?'/api/book/manage/'+TOKEN+'/slots':'/api/book/'+TOKEN+'/slots';}
function isLoaded(day){return S.loaded.some(function(r){return day>=r[0]&&day<r[1];});}
async function ensureRange(from,days){
  // 予約期間の外は聞かない
  var w=S.info.window;
  var start=from<w.from?w.from:from;
  var end=ymd(addDays(parseYmd(from),days));
  var winEnd=ymd(addDays(parseYmd(w.to),1));
  if(end>winEnd)end=winEnd;
  if(start>=end)return true;
  // 読んでいない最初の日から読む
  var d=start;
  while(d<end&&isLoaded(d))d=ymd(addDays(parseYmd(d),1));
  if(d>=end)return true;
  var n=Math.min(42,Math.round((parseYmd(end)-parseYmd(d))/86400000));
  var r=await api(slotsPath()+'?from='+d+'&days='+n);
  if(!r.ok){S.error=r.data.error||'空き状況を読み込めませんでした';return false;}
  S.error='';
  Object.assign(S.slots,r.data.days||{});
  S.loaded.push([d,ymd(addDays(parseYmd(d),n))]);
  return ensureRange(from,days);
}
function resetSlots(){S.slots={};S.loaded=[];}
function slotsOf(day){return S.slots[day]||[];}
function inWindow(day){return day>=S.info.window.from&&day<=S.info.window.to;}

/* 次に空いている日を探す（今見ている週の後ろから、予約期間の終わりまで） */
async function findNext(fromDay){
  var d=fromDay;
  for(var i=0;i<12&&d<=S.info.window.to;i++){
    if(!await ensureRange(d,42))return null;
    for(var k=0;k<42;k++){
      var day=ymd(addDays(parseYmd(d),k));
      if(day>S.info.window.to)return null;
      if(slotsOf(day).length)return day;
    }
    d=ymd(addDays(parseYmd(d),42));
  }
  return null;
}

/* ---------- 描画の共通部品 ---------- */
function locationMeta(loc){
  if(!loc)return '';
  if(loc.type==='meet')return '<div class="bk-meta">'+IC.video+'<div>オンライン（Google Meet）</div></div>';

}
function locationShort(loc){
  if(!loc)return '';

  if(loc.type==='place')return loc.text||'';

function topBar(right){

function shell(inner,bar){

var MON=['月','火','水','木','金','土','日'];
function monday(d){var x=new Date(d);x.setHours(0,0,0,0);var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x;}

/* ---------- 画面1：日時を選ぶ（予約・日時の変更で共通） ---------- */
function pickHTML(){
  var i=S.info;var ws=S.weekStart;var win=i.window;
  var prevOk=ymd(addDays(ws,-1))>=win.from;
  var nextOk=ymd(addDays(ws,7))<=win.to;
  var days='';
  for(var k=0;k<7;k++){
    var d=addDays(ws,k);var day=ymd(d);
    var inW=inWindow(day);
    var has=slotsOf(day).length>0;
    var cls='bk-dbtn'+(day===S.selDay?' bk-sel':'')+(has?'':' bk-nodate')+(k===5?' bk-sat':'')+(k===6?' bk-sun':'');
    days+='<button type="button" class="'+cls+'" '+(inW?'':'disabled ')+'aria-pressed="'+(day===S.selDay)+'" aria-label="'+dayLabel(day)+(has?'':' 空きなし')+'" onclick="pickDay(\''+day+'\')">'+
      '<span>'+MON[k]+'</span><b>'+d.getDate()+'</b></button>';
  }
  var sel=S.selDay;var list=sel?slotsOf(sel):[];
  var slots;
  if(S.loading)slots='<div class="bk-note">空き状況を確認しています…</div>';
  else if(S.error)slots='<div class="bk-banner bk-bad">'+esc(S.error)+'</div>';
  else if(!sel)slots='<div class="bk-note">日付を選んでください。</div>';
  else if(!list.length)slots='<div class="bk-empty">この日は空きがありません。<br><button type="button" class="bk-link-btn" onclick="jumpNext()">次に空いている日へ移動</button></div>';
  else slots='<div class="bk-slots">'+list.map(function(t){
    return '<button type="button" class="bk-slot'+(F.day===sel&&F.time===t?' bk-sel':'')+'" aria-pressed="'+(F.day===sel&&F.time===t)+'" onclick="chooseSlot(\''+sel+'\',\''+t+'\')">'+t+'</button>';}).join('')+'</div>';
  var chosen=F.day&&F.time&&F.day===S.selDay;
  var head=MODE==='manage'
    ?'<button type="button" class="bk-back" onclick="stopPicking()">'+IC.left+'予約の確認に戻る</button><h1 class="bk-h1">新しい日時を選ぶ</h1>'
    :'<h1 class="bk-h1">'+esc(i.title)+'</h1>'+(locationShort(i.location)?'<p class="bk-sub">'+esc(locationShort(i.location))+'</p>':'')+
      (i.description?'<p class="bk-desc">'+esc(i.description)+'</p>':'');
  return shell(head+
    '<div class="bk-weeknav"><button type="button" class="bk-wbtn" onclick="moveWeek(-1)" '+(prevOk?'':'disabled')+'>'+IC.left+'<span>前の週</span></button>'+
      '<b>'+ws.getFullYear()+'年'+(ws.getMonth()+1)+'月</b>'+
      '<button type="button" class="bk-wbtn" onclick="moveWeek(1)" '+(nextOk?'':'disabled')+'><span>次の週</span>'+IC.right+'</button></div>'+
    '<div class="bk-week" role="group" aria-label="日付">'+days+'</div>'+
    (sel?'<h2 class="bk-h2">'+(parseYmd(sel).getMonth()+1)+'月'+parseYmd(sel).getDate()+'日 ('+DOW[parseYmd(sel).getDay()]+')</h2>':'')+
    slots+
    '<div class="bk-sticky"><button type="button" class="bk-btn bk-pri bk-block" '+(chosen?'':'disabled ')+'onclick="goNext()">'+(MODE==='manage'?'この日時に変更する':'次へ')+'</button></div>',
    MODE==='manage'?topBar(IC.cal+'<span>予約の変更</span>'):null);
}

/* ---------- 画面2：入力と確認 ---------- */
var F={day:null,time:null,codeSent:false,guest:{},busy:false};
function field(id,label,mode,html,hint){
  return '<div class="bk-field"><label for="'+id+'">'+esc(label)+(mode==='required'?'<span class="bk-badge bk-req">必須</span>':'<span class="bk-badge">任意</span>')+'</label>'+html+(hint?'<div class="bk-fine">'+esc(hint)+'</div>':'')+'</div>';
}
function formHTML(){
  var i=S.info;var f=i.fields||{name:'required',email:'required',affiliation:'off',note:'off'};var g=F.guest||{};
  var q=(i.questions||[]).map(function(x){
    return field('bkq_'+x.id,x.label,x.required?'required':'optional','<textarea id="bkq_'+x.id+'" maxlength="1000">'+esc((g.answers||{})[x.id]||'')+'</textarea>');
  }).join('');
  var emailOn=f.email!=='off';
  var body='<div class="bk-card2 bk-when">'+
      '<div class="bk-meta">'+IC.cal+'<div>'+shortDay(F.day)+' '+F.time+'</div></div>'+
      (locationShort(i.location)?'<div class="bk-meta">'+(i.location.type==='meet'?IC.monitor:IC.pin)+'<div>'+esc(locationShort(i.location))+'</div></div>':'')+
      '<button type="button" class="bk-link-btn bk-right" onclick="backToPick()">日時を変更</button></div>'+
    '<div class="bk-banner bk-bad" id="bkFormErr" role="alert" style="display:none"></div>'+
    (f.name!=='off'?field('bkName','お名前',f.name,'<input id="bkName" autocomplete="name" maxlength="80" value="'+esc(g.name||'')+'">'):'')+
    (emailOn?field('bkEmail','メールアドレス',f.email,
        i.verifyEmail
          ?'<div class="bk-inline"><input id="bkEmail" type="email" autocomplete="email" maxlength="254" value="'+esc(g.email||'')+'"><button type="button" class="bk-btn bk-line" id="bkSendCode" onclick="sendCode()">コードを送信</button></div>'
          :'<input id="bkEmail" type="email" autocomplete="email" maxlength="254" value="'+esc(g.email||'')+'">',
        '入力すると、Googleカレンダーから予約の招待が届きます。'):'')+
    (emailOn&&i.verifyEmail?'<div id="bkCodeBox" style="display:none">'+field('bkCode','確認コード（メールに届いた6桁）','required','<input id="bkCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code">')+'</div>':'')+
    (f.affiliation!=='off'?field('bkAff','所属',f.affiliation,'<input id="bkAff" maxlength="100" value="'+esc(g.affiliation||'')+'">'):'')+
    (i.phone!=='off'?field('bkPhone','電話番号',i.phone,'<input id="bkPhone" type="tel" autocomplete="tel" maxlength="30" value="'+esc(g.phone||'')+'">'):'')+
    (f.note!=='off'?field('bkNote','連絡事項',f.note,'<textarea id="bkNote" maxlength="1000">'+esc(g.note||'')+'</textarea>'):'')+
    q+
    '<div class="bk-sticky"><button type="button" class="bk-btn bk-pri bk-block" id="bkSubmit" onclick="submitBooking()">予約を確定する</button>'+
      '<p class="bk-tz bk-center">この操作で予約が確定します。</p></div>';
  return shell(body,'<header class="bk-bar bk-bar2"><button type="button" class="bk-back" onclick="backToPick()">'+IC.left+'戻る</button><span class="bk-bar-t">'+esc(i.title)+'</span><span></span></header>');
}
function formErr(msg){var e=document.getElementById('bkFormErr');if(!e)return;e.textContent=msg;e.style.display=msg?'block':'none';if(msg)e.scrollIntoView({block:'nearest'});}
function val(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function modeOf(k){var f=S.info.fields||{name:'required',email:'required',affiliation:'off',note:'off'};return f[k]||'off';}
function readForm(){
  var i=S.info;
  var g={name:val('bkName'),email:val('bkEmail'),affiliation:val('bkAff'),note:val('bkNote'),phone:val('bkPhone'),answers:{}};
  (i.questions||[]).forEach(function(q){g.answers[q.id]=val('bkq_'+q.id);});
  F.guest=g; // 戻っても入力が残るよう、確認の前に控えておく
  if(modeOf('name')==='required'&&!g.name)return {error:'お名前を入力してください'};
  if(modeOf('email')==='required'&&!g.email)return {error:'メールアドレスを入力してください'};
  if(modeOf('email')!=='off'&&g.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g.email))return {error:'メールアドレスを正しく入力してください'};
  if(modeOf('affiliation')==='required'&&!g.affiliation)return {error:'所属を入力してください'};
  if(modeOf('note')==='required'&&!g.note)return {error:'連絡事項を入力してください'};
  if(i.phone==='required'&&!g.phone)return {error:'電話番号を入力してください'};
  for(var k=0;k<(i.questions||[]).length;k++){
    var q=i.questions[k];
    if(q.required&&!g.answers[q.id])return {error:'「'+q.label+'」に回答してください'};
  }
  if(i.verifyEmail&&modeOf('email')!=='off'&&g.email){
    g.code=val('bkCode');
    if(!F.codeSent)return {error:'「コードを送信」を押して、届いた確認コードを入力してください'};
    if(!/^\d{6}$/.test(g.code))return {error:'メールに届いた6桁の確認コードを入力してください'};
  }
  return {guest:g};
}
async function sendCode(){
  var email=val('bkEmail');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){formErr('メールアドレスを正しく入力してください');return;}
  var b=document.getElementById('bkSendCode');b.disabled=true;
  var r=await api('/api/book/'+TOKEN+'/verify',{method:'POST',body:{email:email}});
  b.disabled=false;
  if(!r.ok){formErr(r.data.error||'確認コードを送れませんでした');return;}
  formErr('');F.codeSent=true;b.textContent='再送信';
  document.getElementById('bkCodeBox').style.display='block';
  document.getElementById('bkCode').focus();
  toast(email+' に確認コードを送りました');
}
/* 送信中は押せなくする（連打で二重に送らない）。成功するまでは完了画面に進まない */
async function submitBooking(){
  if(F.busy)return;
  var f=readForm();
  if(f.error){formErr(f.error);return;}
  var btn=document.getElementById('bkSubmit');
  F.busy=true;btn.disabled=true;btn.textContent='予約しています…';
  var body=Object.assign({start:slotIso(F.day,F.time)},f.guest);
  var r=await api('/api/book/'+TOKEN,{method:'POST',body:body});
  F.busy=false;
  if(!r.ok){
    if(r.data.taken){
      /* 先に別の人が予約した枠。入力はそのまま残して、日時の選び直しへ戻す */
      F.day=null;F.time=null;S.error='';
      resetSlots();S.step='pick';S.notice='この時間は予約できなくなりました。別の時間を選んでください。';
      await ensureRange(ymd(S.weekStart),7);render();return;
    }
    btn.disabled=false;btn.textContent='予約を確定する';
    formErr(r.data.error||'予約できませんでした。もう一度お試しください');
    return;
  }
  S.done=r.data.booking;S.step='done';render();window.scrollTo(0,0);
}

/* ---------- 画面3：予約完了 ---------- */
function summaryCard(b){
  var loc=b.location||{type:'none'};

    '<div class="bk-sumtitle">'+esc(b.title)+'</div>'+

    (place?'<div class="bk-meta">'+(loc.type==='meet'?IC.monitor:IC.pin)+'<div>'+esc(place)+(loc.type==='meet'&&b.meet_url?'<div class="bk-fine"><a href="'+esc(b.meet_url)+'" target="_blank" rel="noopener">'+esc(b.meet_url)+'</a></div>':'')+'</div></div>':'')+
    (b.name?'<div class="bk-meta">'+IC.person+'<div>'+esc(b.name)+' 様</div></div>':'')+
  '</div>';
}
function doneHTML(){
  var b=S.done;

async function copyManage(){
  var url=S.done.manage_url;
  try{await navigator.clipboard.writeText(url);toast('管理リンクをコピーしました');}
  catch(e){
    var t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(e2){}
    t.remove();toast(ok?'管理リンクをコピーしました':'コピーできませんでした。リンクを長押ししてコピーしてください');
  }
}

/* ---------- 描画の切り替え ---------- */
function render(){
  var main=document.getElementById('bkMain');
  if(MODE==='manage'&&!S.picking){main.innerHTML=manageHTML();return;}
  var html=(MODE==='book'&&S.step==='form'&&F.day)?formHTML():(MODE==='book'&&S.step==='done'?doneHTML():pickHTML());
  main.innerHTML=html;
  if(S.notice&&S.step==='pick'){var n=document.createElement('div');n.className='bk-banner bk-bad';n.setAttribute('role','alert');n.textContent=S.notice;var b=main.querySelector('.bk-body');if(b)b.insertBefore(n,b.firstChild);S.notice='';}
}

/* ---------- 操作 ---------- */
async function showWeekOf(day){
  S.weekStart=monday(parseYmd(day));
  S.loading=true;render();
  await ensureRange(ymd(S.weekStart),14);
  S.loading=false;render();
}
async function moveWeek(n){S.selDay=null;F.day=null;F.time=null;await showWeekOf(ymd(addDays(S.weekStart,7*n)));}
async function pickDay(day){S.selDay=day;if(F.day!==day){F.day=null;F.time=null;}render();}
async function jumpNext(){
  var from=S.selDay?ymd(addDays(parseYmd(S.selDay),1)):ymd(addDays(S.weekStart,7));
  if(from<S.info.window.from)from=S.info.window.from;
  var next=await findNext(from);
  if(!next){toast('この先に予約できる時間はありません');return;}
  S.selDay=next;await showWeekOf(next);
}
function chooseSlot(day,time){F.day=day;F.time=time;render();}
function goNext(){
  if(!F.day||!F.time)return;
  if(MODE==='manage')return openRescheduleConfirm();
  S.step='form';render();window.scrollTo(0,0);
  setTimeout(function(){var el=document.getElementById('bkName')||document.getElementById('bkEmail');if(el)el.focus();},60);
}
function backToPick(){S.step='pick';render();}

/* ダイアログ（日時変更の確認・キャンセルの確認で使う） */
function openDialog(html){document.getElementById('bkDialog').innerHTML=html;document.getElementById('bkScrim').classList.add('bk-open');}
function closeDialog(){if(S.busy)return;document.getElementById('bkScrim').classList.remove('bk-open');}
function slotSummary(day,time,title){

    '<div class="bk-meta">'+IC.cal+'<div><b>'+esc(title||S.info.title)+'</b></div></div>'+
    '<div class="bk-meta">'+IC.clock+'<div>'+longDay(day)+'<br>'+time+'～'+addMin(time,S.info.duration)+'</div></div>'+
    locationMeta(S.info.location)+'</div>';

/* ---------- 変更・キャンセル（本人専用の管理ページ） ---------- */
function manageHTML(){
  var m=S.manage;var b=m.booking;

  if(b.cancelled)head='<div class="bk-done"><div class="bk-done-mark bk-x">'+IC.x+'</div><h1 class="bk-h1 bk-center">この予約はキャンセルされました</h1><p class="bk-sub bk-center">あらためて予約するときは、担当者から届いた予約ページをお使いください。</p></div>';
  else if(b.past)head='<div class="bk-done"><h1 class="bk-h1 bk-center">この予約は開始時刻を過ぎました</h1><p class="bk-sub bk-center">開始時刻以降は、変更・キャンセルできません。内容はこのページで確認できます。</p></div>';

async function startPicking(){
  S.picking=true;resetSlots();S.selDay=null;F.day=null;F.time=null;
  var start=todayYmd()<S.info.window.from?S.info.window.from:todayYmd();

function stopPicking(){S.picking=false;F.day=null;F.time=null;render();window.scrollTo(0,0);}
function openRescheduleConfirm(){
  var b=S.manage.booking;

async function submitReschedule(){
  if(S.busy)return;
  var btn=document.getElementById('bkSubmit');btn.disabled=true;btn.textContent='変更しています…';S.busy=true;
  var r=await api('/api/book/manage/'+TOKEN,{method:'PATCH',body:{start:slotIso(F.day,F.time)}});
  S.busy=false;
  if(!r.ok){
    btn.disabled=false;btn.textContent='この日時に変更';formErr(r.data.error||'変更できませんでした');

  }
  closeDialog();
  S.manage.booking=r.data.booking;S.picking=false;F.day=null;F.time=null;render();window.scrollTo(0,0);

function openCancelConfirm(){
  var b=S.manage.booking;
  openDialog('<div class="bk-dialog-head"><h3>予約をキャンセルしますか？</h3><button type="button" class="bk-icon-btn" onclick="closeDialog()" aria-label="閉じる">'+IC.close+'</button></div>'+
    '<div class="bk-dialog-body">'+
      '<div class="bk-banner bk-bad" id="bkFormErr" style="display:none"></div>'+
      '<div class="bk-summary2">'+esc(b.title)+'<br>'+esc(b.label)+'</div>'+
      '<p style="margin:0;color:var(--bk-sub);font-size:14px">キャンセルすると元に戻せません。</p>'+
    '</div>'+
    '<div class="bk-dialog-foot"><button type="button" class="bk-btn bk-ghost" onclick="closeDialog()">戻る</button>'+
      '<button type="button" class="bk-btn bk-pri" style="background:var(--bk-bad)" id="bkSubmit" onclick="submitCancel()">キャンセルする</button></div>');
}
async function submitCancel(){
  if(S.busy)return;
  var btn=document.getElementById('bkSubmit');btn.disabled=true;btn.textContent='キャンセルしています…';S.busy=true;
  var r=await api('/api/book/manage/'+TOKEN,{method:'DELETE'});
  S.busy=false;
  if(!r.ok){btn.disabled=false;btn.textContent='キャンセルする';formErr(r.data.error||'キャンセルできませんでした');return;}
  closeDialog();
  S.manage.booking=r.data.booking;S.manage.changeable=false;S.manage.reschedulable=false;render();
  toast('予約をキャンセルしました');
}

/* ---------- 起動 ---------- */
function showClosed(title,msg){
  document.getElementById('bkMain').innerHTML='<div class="bk-closed">'+(title?'<p>'+esc(title)+'</p>':'')+'<h2>'+esc(msg)+'</h2></div>';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDialog();});
(async function boot(){
  if(MODE==='manage'){
    var r=await api('/api/book/manage/'+TOKEN);
    if(!r.ok){showClosed('',r.data.error||'読み込めませんでした');return;}
    S.manage=r.data;S.info=r.data.page;
    document.title=r.data.booking.title+' の予約 | OPS日調アプリ';
    render();return;
  }
  var r2=await api('/api/book/'+TOKEN);
  if(!r2.ok){showClosed('',r2.data.error||'読み込めませんでした');return;}
  S.info=r2.data;S.step='pick';
  document.title=S.info.title+' | 予約';
  if(S.info.closed){showClosed(S.info.title,'現在、予約を受け付けていません');return;}
  var start=todayYmd()<S.info.window.from?S.info.window.from:todayYmd();
  S.weekStart=monday(parseYmd(start));
  S.loading=true;render();
  await ensureRange(ymd(S.weekStart),14);
  S.loading=false;
  /* 最初に空いている日を選んでおく。今週に1つも無ければ、その空いている週を開く */
  var first=await findNext(start);
  if(first){
    S.selDay=first;
    if(first>=ymd(addDays(S.weekStart,7))){await showWeekOf(first);return;}
  }
  render();
})();
</script>
