/* ---------- storage ---------- */
const DB_KEY='ops_nittyou_v1';
const nowISO=()=>new Date().toISOString();
const uid=()=>Math.random().toString(36).slice(2,9);

function seed(){

     3:{on:true,s:'09:00',e:'19:00'},4:{on:true,s:'09:00',e:'19:00'},5:{on:true,s:'09:00',e:'19:00'},

/* ---------- storage（フェーズ0：サーバーAPI + localStorageキャッシュ） ---------- */
// サーバー（server/server.js）が /api/db を提供。同一オリジンで配信される想定。
// サーバーに未到達な場合（オフライン等）はlocalStorageキャッシュにフォールバックする。
let DB=null;
let SYNCING=false;

async function apiGetDB(){
  const res=await fetch('/api/db');
  if(!res.ok)throw new Error('GET /api/db failed');
  return res.json();
}
async function apiPutDB(obj){
  const res=await fetch('/api/db',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
  if(!res.ok)throw new Error('PUT /api/db failed');
  return res.json();
}

// 起動時にサーバーからDBを取得。無ければseed()して作成。サーバーに繋がらなければlocalStorageから復元
async function bootLoad(){
  try{
    const remote=await apiGetDB();
    if(remote){localStorage.setItem(DB_KEY,JSON.stringify(remote));return remote;}
    const s=seed();
    const {updatedAt}=await apiPutDB(s);
    s.updatedAt=updatedAt;
    localStorage.setItem(DB_KEY,JSON.stringify(s));
    return s;
  }catch(e){
    console.warn('サーバーに接続できません。ローカルキャッシュを使用します。',e);
    try{const raw=localStorage.getItem(DB_KEY);if(raw)return JSON.parse(raw);}catch(e2){}
    return seed();
  }
}

// DBの保存：呼び出し側の同期性を崩さないよう、localStorageへは即時保存し、サーバーへは非同期で反映する
function save(){
  localStorage.setItem(DB_KEY,JSON.stringify(DB));
  apiPutDB(DB).then(({updatedAt})=>{DB.updatedAt=updatedAt;}).catch(e=>console.warn('サーバー保存に失敗しました',e));
}
async function resetDB(){
  localStorage.removeItem(DB_KEY);
  try{await apiPutDB(seed());}catch(e){console.warn('サーバー側の初期化に失敗しました',e);}
  location.reload();
}

// 他端末・他ブラウザでの変更をゆるやかに反映する定期ポーリング（30秒間隔）
function startPolling(){
  setInterval(async()=>{
    if(SYNCING)return;
    SYNCING=true;
    try{
      const remote=await apiGetDB();
      if(remote&&remote.updatedAt&&remote.updatedAt!==DB.updatedAt){
        DB=remote;
        localStorage.setItem(DB_KEY,JSON.stringify(DB));
        if(ME)render();
      }
    }catch(e){/* オフライン時は無視 */}
    finally{SYNCING=false;}
  },30000);
}

const STATUS={none:{t:'未申請',c:'st-none'},applied:{t:'申請中',c:'st-applied'},fixed:{t:'確定済み',c:'st-fixed'},failed:{t:'不成立',c:'st-failed'}};

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(name){return (name||'?').slice(0,1);}
function pad(n){return String(n).padStart(2,'0');}
function fmtDT(iso){if(!iso)return '—';const d=new Date(iso);const w='日月火水木金土'[d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${w}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function fmtDate(iso){const d=new Date(iso);const w='日月火水木金土'[d.getDay()];return `${d.getMonth()+1}/${d.getDate()}(${w})`;}
function fmtRel(iso){const diff=(Date.now()-new Date(iso))/1000;
  if(diff<60)return 'たった今';if(diff<3600)return Math.floor(diff/60)+'分前';
  if(diff<86400)return Math.floor(diff/3600)+'時間前';return Math.floor(diff/86400)+'日前';}
function toInputDT(iso){if(!iso)return '';const d=new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}
const WD_JP=['日','月','火','水','木','金','土'];
const DEFAULT_WEEKLY={0:{on:false,s:'09:00',e:'19:00'},1:{on:true,s:'09:00',e:'19:00'},2:{on:true,s:'09:00',e:'19:00'},
  3:{on:true,s:'09:00',e:'19:00'},4:{on:true,s:'09:00',e:'19:00'},5:{on:true,s:'09:00',e:'19:00'},6:{on:false,s:'10:00',e:'16:00'}};
function getWeekly(id){const a=DB.availability&&DB.availability[id];return (a&&a.weekly)?a.weekly:DEFAULT_WEEKLY;}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function hm(iso){const d=new Date(iso);return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}

// スタッフの空きスロット（30分刻み）を今後N日分生成
// 除外条件：曜日別の可能時間帯外／登録済みの不可時間ブロック／確定済み面談
function genSlots(staffId,days=14){
  const weekly=getWeekly(staffId);
  const blocks=((DB.availability[staffId]||{}).blocks||[]).map(b=>[new Date(b.start).getTime(),new Date(b.end).getTime()]);
  const taken=DB.interviews.filter(i=>i.staff_id===staffId&&i.status==='fixed'&&i.confirmed_datetime)
    .map(i=>new Date(i.confirmed_datetime).getTime());
  const now=Date.now();const out=[];
  for(let off=0;off<days;off++){
    const day=new Date();day.setHours(0,0,0,0);day.setDate(day.getDate()+off);
    const conf=weekly[day.getDay()];
    if(!conf||!conf.on)continue;
    const [sh,sm]=conf.s.split(':').map(Number);
    const [eh,em]=conf.e.split(':').map(Number);
    const slots=[];
    for(let t=sh*60+sm; t+30<=eh*60+em; t+=30){
      const dt=new Date(day);dt.setHours(Math.floor(t/60),t%60,0,0);
      const st=dt.getTime(),en=st+30*60*1000;
      if(st<now)continue;
      const bad=blocks.some(([bs,be])=>st<be&&en>bs) || taken.some(x=>Math.abs(x-st)<30*60*1000-1);
      slots.push({iso:dt.toISOString(),time:`${pad(Math.floor(t/60))}:${pad(t%60)}`,ok:!bad});
    }
    if(slots.length)out.push({dateObj:day,slots});
  }
  return out;
}

// 不可時間エディタ用：週マトリクス表データ生成（月曜始まり7日 × 30分刻み）
// state: 'off'（受付時間外）/ 'free'（受付中）/ 'block'（不可・解除可）/ 'locked'（予定・面談あり＝操作不可）
function genEditGrid(staffId,weekOffset){
  const weekly=getWeekly(staffId);
  const blocks=((DB.availability[staffId]||{}).blocks||[]);
  const taken=DB.interviews.filter(i=>i.staff_id===staffId&&i.status==='fixed'&&i.confirmed_datetime)
    .map(i=>new Date(i.confirmed_datetime).getTime());
  const now=Date.now();
  const today=new Date();today.setHours(0,0,0,0);
  const dow=today.getDay();
  const diffToMon=(dow===0?-6:1-dow);
  const monday=new Date(today);monday.setDate(today.getDate()+diffToMon+weekOffset*7);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d);}
  let minM=Infinity,maxM=-Infinity;
  days.forEach(d=>{const conf=weekly[d.getDay()];if(conf&&conf.on){
    const [sh,sm]=conf.s.split(':').map(Number);const [eh,em]=conf.e.split(':').map(Number);
    minM=Math.min(minM,sh*60+sm);maxM=Math.max(maxM,eh*60+em);}});
  if(minM===Infinity){minM=9*60;maxM=19*60;}
  const times=[];for(let t=minM;t+30<=maxM;t+=30)times.push(t);
  const grid=days.map(day=>{
    const conf=weekly[day.getDay()];
    return times.map(t=>{
      const dt=new Date(day);dt.setHours(Math.floor(t/60),t%60,0,0);
      const st=dt.getTime(),en=st+30*60000;
      const iso=dt.toISOString();
      if(!conf||!conf.on)return{state:'off',iso};
      const [sh,sm]=conf.s.split(':').map(Number);const [eh,em]=conf.e.split(':').map(Number);
      if(t<sh*60+sm||t+30>eh*60+em)return{state:'off',iso};
      if(st<now)return{state:'off',iso};
      const takenHit=taken.some(x=>Math.abs(x-st)<30*60000-1);
      if(takenHit)return{state:'locked',iso,label:'面談'};
      const blk=blocks.find(b=>{const bs=new Date(b.start).getTime(),be=new Date(b.end).getTime();return st<be&&en>bs;});
      if(blk){
        return blk.kind==='slot'?{state:'block',iso,blockId:blk.id}:{state:'locked',iso,label:'予定'};
      }
      return{state:'free',iso};
    });
  });
  return{days,times,grid};
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

/* =========================================================
   LOGIN
   ========================================================= */
function initLoginBranches(){
  document.getElementById('loginBranch').innerHTML=DB.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
}
function doLogin(){
  const nick=document.getElementById('loginNick').value.trim();
  const err=document.getElementById('loginNickErr');
  if(!nick){err.classList.add('show');return;}
  err.classList.remove('show');
  const role=document.querySelector('input[name=lrole]:checked').value;
  const branch=document.getElementById('loginBranch').value;
  // reuse an existing seeded user of that role if nickname matches, else create
  let u=DB.users.find(x=>x.nickname===nick&&x.role===role);
  if(!u){u={id:'u_'+uid(),nickname:nick,role,branch_id:branch,created_at:nowISO()};DB.users.push(u);save();}
  loginAs(u.id);
}
function loginAs(id){
  ME=findUser(id);
  localStorage.setItem(SESSION_KEY,ME.id);
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderChip();buildNav();go(defaultTab());
}
function logout(){localStorage.removeItem(SESSION_KEY);location.reload();}

function renderChip(){
  document.getElementById('chipAv').textContent=initials(ME.nickname);
  document.getElementById('chipName').textContent=ME.nickname;
  const r=document.getElementById('chipRole');
  r.textContent=ROLE_JP[ME.role];r.className='rolebadge '+ROLE_CLS[ME.role];
  updateBell();
}

  else if(t==='avail')html=viewAvailability();
  else if(t==='avset')html=viewAvailSet();
  else if(t==='branches')html=viewBranches();
  else if(t==='users')html=viewUsers();
  else html='<div class="empty">画面が見つかりません</div>';
  m.innerHTML='<div class="view">'+html+'</div>';
  updateBell();
}

// 週表示グリッド用データ生成：月曜始まり7日 × 30分刻みの時間帯
function genApplyGrid(staffId,weekOffset){
  const weekly=getWeekly(staffId);
  const blocks=((DB.availability[staffId]||{}).blocks||[]).map(b=>[new Date(b.start).getTime(),new Date(b.end).getTime()]);
  const taken=DB.interviews.filter(i=>i.staff_id===staffId&&i.status==='fixed'&&i.confirmed_datetime)
    .map(i=>new Date(i.confirmed_datetime).getTime());
  const now=Date.now();
  const today=new Date();today.setHours(0,0,0,0);
  const dow=today.getDay();
  const diffToMon=(dow===0?-6:1-dow);
  const monday=new Date(today);monday.setDate(today.getDate()+diffToMon+weekOffset*7);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d);}
  let minM=Infinity,maxM=-Infinity;
  days.forEach(d=>{const conf=weekly[d.getDay()];if(conf&&conf.on){
    const [sh,sm]=conf.s.split(':').map(Number);const [eh,em]=conf.e.split(':').map(Number);
    minM=Math.min(minM,sh*60+sm);maxM=Math.max(maxM,eh*60+em);}});
  if(minM===Infinity){minM=9*60;maxM=19*60;}
  const times=[];for(let t=minM;t+30<=maxM;t+=30)times.push(t);
  const grid=days.map(day=>{
    const conf=weekly[day.getDay()];
    return times.map(t=>{
      const dt=new Date(day);dt.setHours(Math.floor(t/60),t%60,0,0);
      const st=dt.getTime(),en=st+30*60000;
      const iso=dt.toISOString();
      if(!conf||!conf.on)return{state:'off',iso};
      const [sh,sm]=conf.s.split(':').map(Number);const [eh,em]=conf.e.split(':').map(Number);
      if(t<sh*60+sm||t+30>eh*60+em)return{state:'off',iso};
      if(st<now)return{state:'off',iso};
      const takenHit=taken.some(x=>Math.abs(x-st)<30*60000-1);
      if(takenHit)return{state:'off',iso};
      const blocked=blocks.some(([bs,be])=>st<be&&en>bs);
      if(blocked)return{state:'off',iso};
      return{state:'ok',iso};
    });
  });
  return{days,times,grid};
}
function viewApply(){

  if(!APPLY)APPLY={staff:staffs[0]?.id||'',weekOffset:0,sel:[],mtype:'meet',note:''};

    <div class="empty"><div class="ei">💼</div><p>あなたの支部に担当できるスタッフがいません。</p></div>`;

  const staffOpts=staffs.map(s=>`<option value="${s.id}" ${s.id===APPLY.staff?'selected':''}>${esc(s.nickname)}</option>`).join('');
  const{days,times,grid}=genApplyGrid(APPLY.staff,APPLY.weekOffset);
  const todayKey=ymd(new Date());
  const monthLabel=`${days[0].getFullYear()}年${days[0].getMonth()+1}月`;

  const headCells=days.map((d,i)=>{
    const w=d.getDay();const key=ymd(d);const hol=holidayName(d.getFullYear(),d.getMonth(),d.getDate());
    const cls=['bt-h',w===0||hol?'sun':'',w===6?'sat':'',key===todayKey?'today':''].join(' ');
    return `<th class="${cls}">${d.getDate()}<small>${WD_JP[w]}</small></th>`;}).join('');

  const bodyRows=times.map((t,ti)=>{
    const label=`${pad(Math.floor(t/60))}:${pad(t%60)}`;
    const cells=grid.map(dayCol=>{
      const c=dayCol[ti];
      if(c.state==='off')return `<td class="bt-c off">×</td>`;
      const idx=APPLY.sel.indexOf(c.iso);
      const sel=idx>=0;
      return `<td class="bt-c ok ${sel?'sel':''}" onclick="toggleSlot('${c.iso}')">${sel?`<span class="bt-num">${idx+1}</span>`:'○'}</td>`;
    }).join('');
    return `<tr><th class="bt-t">${label}</th>${cells}</tr>`;
  }).join('');

  const table=times.length?`<div class="booktable-wrap">
    <table class="booktable"><thead><tr><th class="bt-corner"></th>${headCells}</tr></thead>
    <tbody>${bodyRows}</tbody></table></div>`
    :`<div class="empty" style="padding:28px"><div class="ei">🈳</div><p>この週は面談可能な空き枠がありません。</p></div>`;

  // 選択サマリー
  const summary=APPLY.sel.length?`<div class="divider"></div>
    <label class="fl">選んだ希望日時（最大3つ）</label>
    <div class="selsummary">`+APPLY.sel.map((iso,i)=>`
      <div class="sr"><span class="cn">${i+1}</span><span>${fmtDT(iso)}</span>
      <span class="x" onclick="toggleSlot('${iso}')">×</span></div>`).join('')+`</div>`:'';

  return `<h1 class="page">面談を申請</h1>
    <p class="page-sub">空いている30分枠を最大3つまで選んでください（第1〜第3希望）。担当スタッフが日程を確定します。</p>
    <div class="card"><div class="cb">
      <label class="fl">担当スタッフ</label>
      <select onchange="setApplyStaff(this.value)">${staffOpts}</select>
      <div class="weekpager">
        <button class="pg" onclick="setApplyWeek(-1)" ${APPLY.weekOffset<=0?'disabled':''}>‹ 前の1週間</button>
        <span class="wm">${monthLabel}</span>
        <button class="pg" onclick="setApplyWeek(1)">次の1週間 ›</button>
      </div>
      <label class="fl">日時を選ぶ（${APPLY.sel.length}/3）</label>
      ${table}
      ${summary}
      <div class="divider"></div>
      <label class="fl">面談方法<span class="req">*</span></label>
      <div class="seg">
        <label><input type="radio" name="mtype" value="meet" ${APPLY.mtype==='meet'?'checked':''} onchange="APPLY.mtype='meet'"><span class="segb">Google Meet</span></label>
        <label><input type="radio" name="mtype" value="zoom" ${APPLY.mtype==='zoom'?'checked':''} onchange="APPLY.mtype='zoom'"><span class="segb">Zoom</span></label>
      </div>
      <label class="fl">その他（任意）</label>
      <textarea placeholder="担当スタッフへのメッセージがあれば記入してください（例：この日程は難しくなったら相談したいです）" style="min-height:90px" oninput="APPLY.note=this.value">${esc(APPLY.note||'')}</textarea>
      <button class="btn pri block" style="margin-top:20px" ${APPLY.sel.length?'':'disabled'} onclick="submitApply()">
        ${APPLY.sel.length?`この${APPLY.sel.length}件で申請する`:'枠を選んでください'}</button>
    </div></div>`;
}
function setApplyStaff(id){APPLY.staff=id;APPLY.weekOffset=0;APPLY.sel=[];render();}
function setApplyWeek(delta){APPLY.weekOffset=Math.max(0,(APPLY.weekOffset||0)+delta);render();}
function toggleSlot(iso){
  const i=APPLY.sel.indexOf(iso);
  if(i>=0)APPLY.sel.splice(i,1);
  else{if(APPLY.sel.length>=3){toast('希望は3つまでです');return;}APPLY.sel.push(iso);}
  render();
}
function submitApply(){
  if(!APPLY.sel.length){toast('希望する枠を選んでください');return;}
  // 選択順を第1〜第3希望に。空きスロットのみ選択できるため過去・重複は発生しない。
  const sorted=APPLY.sel.slice(); // 選択順を尊重
  const iv={id:'iv_'+uid(),intern_id:ME.id,staff_id:APPLY.staff||null,status:'applied',
    choice1:sorted[0]||null,choice2:sorted[1]||null,choice3:sorted[2]||null,
    meeting_type:APPLY.mtype,confirmed_datetime:null,note:(APPLY.note||'').trim(),created_at:nowISO()};
  DB.interviews.push(iv);save();
  notifyLog('面談申請',`${ME.nickname}さんが面談を申請しました`);
  toast('面談を申請しました');
  go('my');
}

function confirmInterview(id,dt){
  const iv=DB.interviews.find(x=>x.id===id);
  iv.status='fixed';iv.confirmed_datetime=dt;save();
  notifyLog('面談確定',`${findUser(iv.intern_id)?.nickname}さんの面談が確定しました`);
  // auto compose confirmation mail
  closeSheet();
  toast('面談を確定しました（カレンダー登録・通知済み）');
  openSendMail(iv.intern_id,'面談確定のお知らせ',
    `お疲れ様です。\n面談日程が下記のとおり確定しましたのでお知らせします。\n\n日時：${fmtDT(dt)}\n方法：${MTYPE[iv.meeting_type]}\n\nよろしくお願いいたします。`);

function openCustomConfirm(id){
  openSheet(`<h3>別日時で確定</h3>
    <p class="page-sub">候補以外の日時を指定して確定します。</p>
    <label class="fl">確定日時<span class="req">*</span></label>
    <input type="datetime-local" id="customDT">

    <button class="btn pri block" style="margin-top:16px" onclick="doCustomConfirm('${id}')">この日時で確定</button>`);

function doCustomConfirm(id){
  const v=document.getElementById('customDT').value;const e=document.getElementById('customDTe');
  e.classList.remove('show');
  if(!v){e.textContent='日時を入力してください';e.classList.add('show');return;}
  if(new Date(v)<new Date()){e.textContent='過去の日時は指定できません';e.classList.add('show');return;}
  confirmInterview(id,new Date(v).toISOString());
}
function failInterview(id){
  const iv=DB.interviews.find(x=>x.id===id);const intern=findUser(iv.intern_id);
  if(!confirm(`${intern?.nickname||'この学生'}さんの面談を「不成立」にします。\n再提出依頼メールの作成画面に進みます。よろしいですか？`))return;
  iv.status='failed';iv.confirmed_datetime=null;save();
  notifyLog('面談不成立',`${findUser(iv.intern_id)?.nickname}さんの面談が不成立になりました`);
  closeSheet();
  // show mail template per spec

    `お疲れ様です。\n\nご提出いただいた候補日では面談日程の調整が難しかったため、お手数ですが再度候補日をご提出いただけますでしょうか。\n\nご迷惑をおかけし申し訳ありません。\n\nよろしくお願いいたします。`);
}
function reopenInterview(id){
  const iv=DB.interviews.find(x=>x.id===id);iv.status='applied';save();closeSheet();toast('申請中に戻しました');go('interviews');

// 自分に関係する確定面談を取得（カレンダー併記用）
function myInterviewsForCal(){
  return DB.interviews.filter(iv=>{
    if(iv.status!=='fixed'||!iv.confirmed_datetime)return false;
    if(ME.role==='admin')return true;
    if(ME.role==='intern')return iv.intern_id===ME.id;
    const intern=findUser(iv.intern_id);
    return iv.staff_id===ME.id||(intern&&intern.branch_id===ME.branch_id);
  });
}
function ivLabel(iv){const intern=findUser(iv.intern_id),staff=findUser(iv.staff_id);
  return ME.role==='intern'?`面談：${staff?staff.nickname:'担当'}さん`:`面談：${intern?intern.nickname:'—'}さん`;}
function eventsSection(){
  if(!calYM){const t=new Date();calYM={y:t.getFullYear(),m:t.getMonth()};}
  let list=DB.events.slice();
  if(ME.role!=='admin')list=list.filter(e=>e.branch_id===ME.branch_id);
  const ivs=myInterviewsForCal();
  const canCreate=ME.role!=='intern';
  const {y,m}=calYM;
  const evByDay={},ivByDay={};
  list.forEach(e=>{const k=ymd(new Date(e.start_datetime));(evByDay[k]=evByDay[k]||[]).push(e);});
  ivs.forEach(iv=>{const k=ymd(new Date(iv.confirmed_datetime));(ivByDay[k]=ivByDay[k]||[]).push(iv);});

  const legend=`<div class="cal-legend">
      <span class="legend-dot" style="background:var(--brand)"></span>イベント
      <span class="legend-dot" style="background:var(--iv);margin-left:10px"></span>面談
      <span style="margin-left:auto">日付タップで絞り込み</span></div>`;

  let body;
  if(calMode==='list'){
    body=agendaView(list,ivs,y,m);
  }else{
    const startDow=new Date(y,m,1).getDay();
    const daysInMonth=new Date(y,m+1,0).getDate();
    const prevDays=new Date(y,m,0).getDate();
    const todayKey=ymd(new Date());
    let cells='';
    for(let i=startDow-1;i>=0;i--)cells+=`<div class="calcell out"><span class="dn">${prevDays-i}</span></div>`;
    for(let d=1;d<=daysInMonth;d++){
      const key=ymd(new Date(y,m,d));const evs=evByDay[key]||[];const dvs=ivByDay[key]||[];
      const has=evs.length+dvs.length;const hol=holidayName(y,m,d);
      const cls=['calcell',has?'has':'',key===todayKey?'today':'',key===calSel?'sel':'',hol?'holiday':''].join(' ');
      let dots='';
      if(has){const parts=[...evs.slice(0,2).map(()=>'<span class="evdot"></span>'),
        ...dvs.slice(0,2).map(()=>'<span class="ivdot"></span>')];
        dots=`<div class="dots">${parts.slice(0,3).join('')}${has>3?`<span class="evmore">+${has-3}</span>`:''}</div>`;}
      cells+=`<div class="${cls}"${hol?` title="${esc(hol)}"`:''} ${has?`onclick="calSelect('${key}')"`:''}><span class="dn">${d}</span>${dots}</div>`;
    }
    const trail=(7-(startDow+daysInMonth)%7)%7;
    for(let i=1;i<=trail;i++)cells+=`<div class="calcell out"><span class="dn">${i}</span></div>`;
    const dow=WD_JP.map((w,i)=>`<div class="caldow ${i===0?'sun':''} ${i===6?'sat':''}">${w}</div>`).join('');
    body=`<div class="calgrid">${dow}${cells}</div>${legend}`;
  }

  const cal=`<div class="card cal"><div class="cb">
      <div class="calhead">
        <button class="navbtn" onclick="calShift(-1)">‹</button>
        <span class="cm">${y}年${m+1}月</span>
        <button class="navbtn" onclick="calShift(1)">›</button>
      </div>
      ${body}
    </div></div>`;

  // 選択日 or 当月のイベント（出欠カード）
  let below=list.filter(e=>{const dt=new Date(e.start_datetime);
    return calSel? ymd(dt)===calSel : (dt.getFullYear()===y&&dt.getMonth()===m);});
  below.sort((a,b)=>new Date(a.start_datetime)-new Date(b.start_datetime));
  // 選択日の確定面談（該当日のみ、補足表示）
  const ivBelow=calSel?ivs.filter(iv=>ymd(new Date(iv.confirmed_datetime))===calSel):[];
  const ivCards=ivBelow.map(iv=>`<div class="card"><div class="cb" style="display:flex;align-items:center;gap:10px">
      <span class="tile-ic" style="width:38px;height:38px;background:var(--iv-soft);color:var(--iv);font-size:16px">🗓</span>
      <span><b>${esc(ivLabel(iv))}</b><br><span class="tile-d">${fmtDT(iv.confirmed_datetime)} ・ ${MTYPE[iv.meeting_type]}</span></span>
    </div></div>`).join('');
  const listTitle=calSel?`${Number(calSel.split('-')[1])}/${Number(calSel.split('-')[2])} の予定`:`${m+1}月のイベント`;
  const clearBtn=calSel?`<button class="btn ghost sm" onclick="calSelect(null)">絞り込み解除</button>`:'';
  const cards=(below.length||ivBelow.length)?ivCards+below.map(eventCard).join('')
    :`<div class="empty"><div class="ei">📅</div><p>${calSel?'この日の予定はありません。':'この月のイベントはありません。'}</p></div>`;

  return `<div class="divider" style="margin:22px 0 14px"></div>
    <div style="display:flex;align-items:center;margin:0 2px 10px;gap:8px">
      <h2 style="margin:0;font-size:18px">📅 カレンダー</h2>
      <div class="calview-tabs" style="margin-left:auto">
        <button class="${calMode==='month'?'on':''}" onclick="setCalMode('month')">月</button>
        <button class="${calMode==='list'?'on':''}" onclick="setCalMode('list')">リスト</button>
      </div></div>
    <p class="page-sub" style="margin-top:-2px">イベント（緑）と確定面談（紫）を表示。下で各イベントの出欠を回答できます。</p>
    ${canCreate?`<button class="btn pri block" style="margin-bottom:12px" onclick="openEventForm()">＋ 新しいイベントを作成</button>`:''}
    ${cal}
    <div style="display:flex;align-items:center;margin:16px 2px 8px"><h3 style="margin:0;font-size:15px">${listTitle}</h3><span style="margin-left:auto">${clearBtn}</span></div>
    ${cards}`;
}
// リスト（アジェンダ）表示：当月のイベント＋面談を時系列で
function agendaView(list,ivs,y,m){
  const items=[];
  list.forEach(e=>{const dt=new Date(e.start_datetime);
    if(dt.getFullYear()===y&&dt.getMonth()===m)items.push({dt,type:'ev',title:e.title,sub:`${hm(e.start_datetime)}・${e.location||'—'}`,key:ymd(dt)});});
  ivs.forEach(iv=>{const dt=new Date(iv.confirmed_datetime);
    if(dt.getFullYear()===y&&dt.getMonth()===m)items.push({dt,type:'iv',title:ivLabel(iv),sub:`${hm(iv.confirmed_datetime)}・${MTYPE[iv.meeting_type]}`,key:ymd(dt)});});
  items.sort((a,b)=>a.dt-b.dt);
  if(!items.length)return `<div class="empty" style="padding:26px"><div class="ei">📅</div><p>${m+1}月の予定はありません。</p></div>`;
  return `<div class="agenda">`+items.map(it=>{
    const w=WD_JP[it.dt.getDay()];
    return `<div class="ag" ${it.type==='ev'?`style="cursor:pointer" onclick="calSelect('${it.key}')"`:''}>
      <span class="agd"><span class="agn" style="${it.dt.getDay()===0?'color:#dc2626':it.dt.getDay()===6?'color:#2563eb':''}">${it.dt.getDate()}</span><span class="agw">${w}</span></span>
      <span class="agbar ${it.type==='iv'?'iv':''}"></span>
      <span style="flex:1"><span class="agt">${esc(it.title)}</span><br><span class="ags">${esc(it.sub)}</span></span>
    </div>`;}).join('')+`</div>`;
}

function calShift(delta){let m=calYM.m+delta,y=calYM.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}calYM={y,m};calSel=null;render();}
function calSelect(key){calSel=(key&&key!==calSel)?key:null;render();}
function vote(evId,resp){

function saveEvent(id){
  const title=document.getElementById('evTitle').value.trim();
  const start=document.getElementById('evStart').value;
  let ok=true;
  const te=document.getElementById('evTitleE'),se=document.getElementById('evStartE');
  te.classList.remove('show');se.classList.remove('show');
  if(!title){te.textContent='イベント名は必須です';te.classList.add('show');ok=false;}
  if(!start){se.textContent='開催日時は必須です';se.classList.add('show');ok=false;}
  if(!ok)return;
  const data={title,description:document.getElementById('evDesc').value.trim(),
    start_datetime:new Date(start).toISOString(),
    end_datetime:document.getElementById('evEnd').value?new Date(document.getElementById('evEnd').value).toISOString():new Date(start).toISOString(),
    location:document.getElementById('evLoc').value.trim(),
    branch_id:document.getElementById('evBranch').value,
    meet_url:document.getElementById('evMeet').value.trim(),
    zoom_url:document.getElementById('evZoom').value.trim()};
  if(id){Object.assign(DB.events.find(e=>e.id===id),data);toast('イベントを更新しました');}
  else{DB.events.push({id:'ev_'+uid(),creator_id:ME.id,...data});notifyLog('イベント作成',`「${title}」が作成されました`);toast('イベントを作成しました');}
  save();closeSheet();render();

/* 枠タップ／ドラッグでまとめて不可・解除する（マウス・タッチ共通） */
let AVDRAG=null;
function avPointerDown(e,iso){
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();
  const cell=e.currentTarget;
  const mode=cell.classList.contains('block')?'unblock':'block';
  AVDRAG={mode,touched:new Set()};
  document.body.classList.add('noselect');
  avDragApply(cell,iso);
  document.addEventListener('pointermove',avDragMove);
  document.addEventListener('pointerup',avDragEnd);
  document.addEventListener('pointercancel',avDragEnd);
}
function avDragMove(e){
  if(!AVDRAG)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(el&&el.classList&&el.classList.contains('bt-c')&&el.dataset.iso)avDragApply(el,el.dataset.iso);
}
function avDragApply(cell,iso){
  if(!AVDRAG||AVDRAG.touched.has(iso))return;
  if(AVDRAG.mode==='block'){
    if(!cell.classList.contains('ok'))return;
    const id=avBlock(iso,true);
    cell.classList.remove('ok');cell.classList.add('block');
    cell.dataset.blockId=id;cell.textContent='×';
  }else{
    if(!cell.classList.contains('block'))return;
    const bid=cell.dataset.blockId;
    if(bid)avUnblock(bid,true);
    cell.classList.remove('block');cell.classList.add('ok');
    delete cell.dataset.blockId;cell.textContent='○';
  }
  AVDRAG.touched.add(iso);
}
function avDragEnd(){
  document.removeEventListener('pointermove',avDragMove);
  document.removeEventListener('pointerup',avDragEnd);
  document.removeEventListener('pointercancel',avDragEnd);
  document.body.classList.remove('noselect');
  if(AVDRAG){
    const n=AVDRAG.touched.size;
    AVDRAG=null;
    if(n){save();toast(n>1?`${n}件を更新しました`:'更新しました');}
    render();
  }
}

/* 「日時でまとめて追加」フォーム＋スクロール式 時間ピッカー */
function initBlkForm(){BLKFORM={date:ymd(new Date()),start:'12:00',end:'13:00',note:''};}
// 00:00〜23:30 を30分刻みで返す
function timeOptions(which){
  let h='';
  for(let t=0;t<24*60;t+=30){const v=`${pad(Math.floor(t/60))}:${pad(t%60)}`;
    h+=`<button class="${BLKFORM[which]===v?'on':''}" onclick="tpSet('${which}','${v}')">${v}</button>`;}
  return h;
}
function tpToggle(which){
  const bar=document.getElementById('tpbar_'+which);
  const other=which==='start'?'end':'start';
  document.getElementById('tpbar_'+other)?.classList.add('hidden');
  document.getElementById('tpick_'+other)?.classList.remove('open');
  const willOpen=bar.classList.contains('hidden');
  bar.classList.toggle('hidden');
  document.getElementById('tpick_'+which).classList.toggle('open',willOpen);
  if(willOpen){const on=bar.querySelector('button.on');if(on)on.scrollIntoView({block:'center'});}
}
function tpSet(which,v){
  BLKFORM[which]=v;
  // 開始を変えて終了以上になったら終了を+30分に自動調整
  if(which==='start'&&BLKFORM.end<=v){
    let [hh,mm]=v.split(':').map(Number);let t=hh*60+mm+30;if(t>=24*60)t=24*60-30;
    BLKFORM.end=`${pad(Math.floor(t/60))}:${pad(t%60)}`;
    const ev=document.getElementById('tpv_end');if(ev)ev.textContent=BLKFORM.end;
    const eb=document.getElementById('tpbar_end');if(eb)eb.innerHTML=timeOptions('end');
  }
  document.getElementById('tpv_'+which).textContent=v;
  const bar=document.getElementById('tpbar_'+which);bar.innerHTML=timeOptions(which);bar.classList.add('hidden');
  document.getElementById('tpick_'+which).classList.remove('open');
}
function addBlock(){
  const {date,start:s,end:e}=BLKFORM;const note=(BLKFORM.note||'').trim();
  const err=document.getElementById('blkErr');err.classList.remove('show');
  if(!date||!s||!e){err.textContent='日付・開始・終了を入力してください';err.classList.add('show');return;}
  const start=new Date(`${date}T${s}`),end=new Date(`${date}T${e}`);
  if(end<=start){err.textContent='終了は開始より後にしてください';err.classList.add('show');return;}
  if(end<new Date()){err.textContent='過去の時間は登録できません';err.classList.add('show');return;}
  DB.availability[ME.id]=DB.availability[ME.id]||{};
  DB.availability[ME.id].blocks=DB.availability[ME.id].blocks||[];
  DB.availability[ME.id].blocks.push({id:'blk_'+uid(),start:start.toISOString(),end:end.toISOString(),note});
  save();toast('不可時間を登録しました');
  initBlkForm();render();
}
function delBlock(id){
  const a=DB.availability[ME.id];if(!a)return;
  a.blocks=(a.blocks||[]).filter(b=>b.id!==id);
  save();toast('削除しました');render();
}

function unreadCount(){return (DB.notifications||[]).filter(n=>n.at>lastRead()).length;}
const NOTI_IC={'面談申請':{e:'📝',bg:'#e2f5ec',fg:'#0b8a63'},'面談確定':{e:'✅',bg:'#e7f6ec',fg:'#0f7a37'},
  '面談不成立':{e:'⚠️',bg:'#fdecec',fg:'#dc2626'},'イベント作成':{e:'📅',bg:'#f0eafe',fg:'#7c3aed'},
  'イベント更新':{e:'🔄',bg:'#fdf1e0',fg:'#d97706'}};
function updateBell(){
  const b=document.getElementById('bellBadge');if(!b||!ME)return;
  const n=unreadCount();
  if(n>0){b.textContent=n>9?'9+':n;b.classList.remove('hidden');}
  else b.classList.add('hidden');
}
function openNotifications(){
  const list=(DB.notifications||[]).slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
  const lr=lastRead();
  const rows=list.length?list.map(n=>{const ic=NOTI_IC[n.type]||{e:'🔔',bg:'#eef2f6',fg:'#64748b'};
    return `<div class="noti ${n.at>lr?'unread':''}">
      <span class="nic" style="background:${ic.bg};color:${ic.fg}">${ic.e}</span>
      <span><span class="nt">${esc(n.msg)}</span><br><span class="ns">${esc(n.type)} ・ ${fmtRel(n.at)}</span></span>
    </div>`;}).join(''):'<div class="empty" style="padding:26px"><div class="ei">🔔</div><p>通知はまだありません。</p></div>';
  openSheet(`<h3>通知</h3>
    <p class="page-sub">面談・イベントに関するアプリ内通知です。</p>
    <div class="card"><div class="cb" style="padding:4px 12px">${rows}</div></div>`);
  // 開いたら既読に
  const map=getNotiRead();map[ME.id]=nowISO();localStorage.setItem(NOTI_READ_KEY,JSON.stringify(map));
  updateBell();
}

/* =========================================================
   メール履歴の閲覧
   ========================================================= */
function openMailHistory(){
  let list=DB.emails.slice();
  if(ME.role==='intern')list=list.filter(m=>m.receiver_id===ME.id);        // 受信
  else if(ME.role==='staff')list=list.filter(m=>m.sender_id===ME.id);       // 送信
  list.sort((a,b)=>new Date(b.sent_at||0)-new Date(a.sent_at||0));
  const rows=list.length?list.map(m=>{
    const other=ME.role==='intern'?findUser(m.sender_id):findUser(m.receiver_id);
    const who=ME.role==='intern'?'差出人':'宛先';
    return `<div class="row" style="cursor:pointer" onclick="openMailDetail('${m.id}')">
      <span class="av" style="border-radius:10px;background:var(--brand-soft);color:var(--brand-d)">✉️</span>
      <span class="rmain"><span class="rt">${esc(m.subject)}</span>
      <span class="rs">${who}：${esc(other?.nickname||'—')} ・ ${m.sent_at?fmtRel(m.sent_at):''}</span></span>
      <span class="tile-arrow">›</span></div>`;}).join('')
    :`<div class="empty" style="padding:26px"><div class="ei">✉️</div><p>${ME.role==='intern'?'受信したメールはありません。':'送信したメールはありません。'}</p></div>`;
  openSheet(`<h3>${ME.role==='intern'?'受信メール':'メール履歴（送信済み）'}</h3>
    <div class="hint mock"><span>✉️</span><span>デモ版：アプリ内に記録されたメールの履歴です。</span></div>
    <div class="card" style="margin-top:10px"><div class="rowlist">${rows}</div></div>`);
}
function openMailDetail(id){
  const m=DB.emails.find(x=>x.id===id);if(!m)return;
  const from=findUser(m.sender_id),to=findUser(m.receiver_id);
  openSheet(`<h3>${esc(m.subject)}</h3>
    <dl class="kv" style="margin:12px 0">
      <dt>差出人</dt><dd>${esc(from?.nickname||'—')}</dd>
      <dt>宛先</dt><dd>${esc(to?.nickname||'—')}</dd>
      <dt>送信日時</dt><dd>${m.sent_at?fmtDT(m.sent_at):'—'}</dd>
    </dl>
    <div class="divider"></div>
    <div style="white-space:pre-wrap;font-size:14px;line-height:1.7">${esc(m.body)}</div>
    <button class="btn block" style="margin-top:16px" onclick="openMailHistory()">← 一覧へ戻る</button>`);
}

/* =========================================================
   BOOT
   ========================================================= */
(async()=>{
  DB=await bootLoad();
  initLoginBranches();
  startPolling();
  const saved=localStorage.getItem(SESSION_KEY);
  if(saved&&findUser(saved)){loginAs(saved);}
  const googleParam=new URLSearchParams(location.search).get('google');
  if(googleParam){
    history.replaceState(null,'',location.pathname);
    if(googleParam==='connected')toast('Googleカレンダーと連携しました');
    else if(googleParam==='error')toast('Googleカレンダー連携に失敗しました');
  }
})();
</script>
