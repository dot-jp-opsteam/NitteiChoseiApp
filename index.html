<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>OPS日調アプリ</title>
<!-- テーマは端末設定ではなくアプリ側の設定に従う。既定はダーク。
     CSSより先に data-theme を確定させないと、一瞬だけ違う配色が見えてしまう -->
<script>
(function(){
  var el=document.documentElement;
  try{
    var t=localStorage.getItem('ops_theme_v1');
    el.setAttribute('data-theme',t==='light'?'light':'dark');
  }catch(e){el.setAttribute('data-theme','dark');}
  /* 左メニューの開閉。保存された指定が無ければ、スマホは細い帯・PCは広げた状態にする。
     ここで確定させないと、一瞬だけ違う幅で描かれて中身が横にずれる */
  try{
    var s=localStorage.getItem('ops_sidebar_v1');
    if(s!=='expanded'&&s!=='collapsed')s=window.innerWidth<=760?'collapsed':'expanded';
    el.setAttribute('data-sb',s);
  }catch(e){el.setAttribute('data-sb','expanded');}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap">
<!-- このファイルと style.css はリポジトリ直下にあり、Renderの rootDir(server) の
     外側にある。Renderダッシュボードの Build Filters → Included Paths に
     登録しておかないと、ここを直したpushはビルドされず本番に届かない
     （2026-08-06に登録し直し済み。控えは render.yaml のコメント） -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 背景のオーロラ。CSSだけで動く装飾なので、中身は空のspan3枚でよい -->
<div id="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

<!-- 起動中の表示。読み込みが終わったら hideBoot() が取り除く。
     これが無いと、サーバーが起きるまでの間まっ白な画面になり「壊れた」と誤解される -->
<div id="boot">
  <div class="mark"><b>OPS</b></div>
  <p id="bootMsg">読み込んでいます…</p>
</div>

<!-- ========== LOGIN ========== -->
<div id="login">
  <div class="login-hero">
    <div class="mark reveal"><b>OPS</b></div>
    <h1 class="hero-title reveal">日調アプリ</h1>
    <p class="hero-sub reveal">ドットジェイピー 日程調整・面談管理</p>
  </div>
  <div class="login-card reveal">
    <div id="loginBody" style="text-align:left"></div>
    <p class="fine">データはこのアプリのサーバーに保存されます。</p>
  </div>
</div>

<!-- ========== APP ========== -->
<div id="app" class="hidden">
  <!-- 左端の縦メニュー。上＝ロゴ／中＝画面ナビと設定／下＝本人と通知 -->
  <aside id="sidebar">
    <div class="sb-top">
      <span class="mark"><b>OPS</b></span>
      <span class="sb-brand">日調アプリ<small>ドットジェイピー</small></span>
      <button class="sb-toggle" id="sbToggle" data-ic="panel" onclick="toggleSidebar()" aria-label="メニューを開閉" aria-expanded="true"></button>
    </div>

    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-sep"></div>
    <div class="sb-act" id="sbAct"></div>

    <div class="sb-foot">
      <div class="sb-me">
        <button class="av hexav" id="chipAv" onclick="openMyProfile()" title="プロフィールを開く">–</button>
        <button class="sb-me-t" onclick="openMyProfile()" title="プロフィールを開く"><b id="chipName"></b><small id="chipRole"></small></button>
        <button class="bell" id="bell" onclick="openNotifications()" aria-label="通知" data-ic="bell"><span class="badge hidden" id="bellBadge">0</span></button>
      </div>
      <div class="sb-links">
        <a href="https://www.dot-jp.or.jp/" target="_blank" rel="noopener noreferrer" data-ic-end="external">ドットジェイピー公式</a>
        <a href="https://dot-jp-opsteam.github.io/ops-homepage/" target="_blank" rel="noopener noreferrer" data-ic-end="external">OPS公式</a>
      </div>
    </div>
  </aside>

  <main id="main"></main>
</div>
<!-- スマホでだけ出るメニューボタン。押すと右からメニューが出る -->
<button id="sbBurger" onclick="toggleSidebar()" aria-label="メニューを開く"><span></span><span></span><span></span></button>
<!-- スマホでメニューを広げたときだけ出る覆い -->
<div id="sbScrim" onclick="collapseSidebar()"></div>

<!-- 保存に失敗したときだけ出る帯。黙って消えるのを防ぐ -->
<div id="savebar" class="hidden">
  <span data-ic="alert" class="sb-ic"></span>
  <span class="sb-msg">変更を保存できていません。通信状況をご確認ください。</span>
  <button id="savebarBtn" onclick="retrySave()">再試行</button>
</div>

<!-- generic sheet -->
<div class="scrim" id="scrim" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div id="toast"></div>

/* 大きさは指定しない。CSS側で 1em にしてあるので、置いた場所の文字サイズに合わせて伸び縮みする */
function ic(name,cls){
  return `<svg class="ic${cls?' '+cls:''}" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]||ICON.dot}</svg>`;
}
/* JSで組み立てないHTML（ベル・保存失敗の帯・外部リンク）にもアイコンを入れる。
   data-ic は先頭に、data-ic-end は末尾に差し込む */
function fillStaticIcons(root){
  (root||document).querySelectorAll('[data-ic]').forEach(el=>{
    el.insertAdjacentHTML('afterbegin',ic(el.getAttribute('data-ic')));
    el.removeAttribute('data-ic');
  });
  (root||document).querySelectorAll('[data-ic-end]').forEach(el=>{
    el.insertAdjacentHTML('beforeend',ic(el.getAttribute('data-ic-end')));
    el.removeAttribute('data-ic-end');
  });
}
document.addEventListener('DOMContentLoaded',()=>fillStaticIcons());

/* ---------- storage ---------- */

const nowISO=()=>new Date().toISOString();
const uid=()=>Math.random().toString(36).slice(2,9);

/* =========================================================
   セッショントークン

     タブを複製して別アカウントでログインしても元のタブは影響を受けない。
     新しいタブ（＝ショートカットから開いた場合）は空なのでログイン画面になる。
   - 「次回から自動ログイン」にチェックが入ったときだけ localStorage にも複製し、
     次に開いたタブが起動時にコピーして使う。
   ========================================================= */
const TOKEN_KEY='ops_token_v1';
const getToken=()=>sessionStorage.getItem(TOKEN_KEY);
function setToken(t,remember){
  sessionStorage.setItem(TOKEN_KEY,t);
  if(remember)localStorage.setItem(TOKEN_KEY,t);
  else localStorage.removeItem(TOKEN_KEY);
}
function clearToken(){
  sessionStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(DB_KEY);
}
/* セッションが切れた（サーバーがcode:'unauthenticated'を返した）ときの後始末。
   ログイン中だった場合だけ読み込み直して、ログイン画面から入り直してもらう */
function handleUnauthorized(){
  clearToken();
  if(ME){ME=null;location.reload();}
}

/* すべてのAPI呼び出しの入口。Authorizationヘッダの付与と、
   セッション切れの検出をここ1か所にまとめている */
async function api(path,opts={}){
  const headers={...(opts.headers||{})};
  const token=getToken();
  if(token)headers['Authorization']='Bearer '+token;
  if(opts.body&&!headers['Content-Type'])headers['Content-Type']='application/json';
  const res=await fetch(path,{...opts,headers});
  if(res.status===401&&token){
    // パスワード違いなど、業務上の401と区別するためサーバーの code を見る
    try{
      const d=await res.clone().json();
      if(d&&d.code==='unauthenticated')handleUnauthorized();
    }catch(e){/* JSONでなければセッション切れとは扱わない */}
  }
  return res;
}

// 初期マスタデータ（支部のみ）。ユーザー・面談等は運用開始時点では空。

}

/* ---------- storage（フェーズ0：サーバーAPI + localStorageキャッシュ） ---------- */
// サーバー（server/server.js）が /api/db を提供。同一オリジンで配信される想定。
// サーバーに未到達な場合（オフライン等）はlocalStorageキャッシュにフォールバックする。
let DB=null;
let SYNCING=false;

async function apiGetDB(){
  const res=await api('/api/db');
  if(!res.ok)throw new Error('GET /api/db failed');
  return res.json();
}
async function apiPutDB(obj){
  const res=await api('/api/db',{method:'PUT',body:JSON.stringify(obj)});
  if(!res.ok)throw new Error('PUT /api/db failed');
  return res.json();
}

// 起動時にサーバーからDBを取得。branches等の初期マスタが未投入ならseed()して作成。サーバーに繋がらなければlocalStorageから復元
async function bootLoad(){
  try{
    const remote=await apiGetDB();
    if(remote&&remote.branches){sessionStorage.setItem(DB_KEY,JSON.stringify(remote));return remote;}
    const s=seed();
    const {updatedAt}=await apiPutDB(s);
    s.updatedAt=updatedAt;
    s.users=(remote&&remote.users)||[];
    sessionStorage.setItem(DB_KEY,JSON.stringify(s));
    return s;
  }catch(e){
    console.warn('サーバーに接続できません。キャッシュを使用します。',e);
    try{const raw=sessionStorage.getItem(DB_KEY);if(raw)return JSON.parse(raw);}catch(e2){}
    return seed();
  }
}

/* DBを変更して保存する。
   fn は DB を受け取って書き換える関数。「何をしたか」を関数として受け取ることで、
   他の人が先に保存していた場合（409）に最新のDBを取り込んでから同じ操作をやり直せる。
   以前のように DB 全体を無条件に上書きしていると、2人が同時に操作したときに
   後から保存した方が相手の変更を消してしまう。

   fn の中では、対象を必ず引数の db から引き直すこと（外側で find した参照を使わない）。
   やり直しのときに古いDBのオブジェクトを触ってしまい、変更が反映されないため。 */
async function putDB(){
  const {users,...body}=DB;
  return api('/api/db',{method:'PUT',body:JSON.stringify({...body,_baseUpdatedAt:DB.updatedAt})});
}
/* 専用APIを1回呼んで、作られた（または更新された）1件を受け取る。
   一斉に押される操作は、DB全体を送り直す mutate() ではなくこちらを使う。
   通信や権限の失敗は画面上部の帯で知らせ、null を返す。
   key は応答の中の受け取りたい項目名（'interview' など） */
async function apiCall(path,opts,key){
  try{
    const res=await api(path,opts);
    if(!res.ok){
      const d=await res.json().catch(()=>({}));
      setSaveError(d.error||'保存できませんでした。');
      return null;
    }
    const data=await res.json();
    // 付随して積まれた通知があれば、手元の一覧にも反映する
    if(data.notification)DB.notifications=[...(DB.notifications||[]),data.notification];
    setSaveError(null);
    return key?(data[key]??null):data;
  }catch(e){
    console.warn('保存に失敗しました',path,e);
    setSaveError('保存できていません。通信状況をご確認ください。');
    return null;
  }
}
const apiCreate=(path,body,key)=>apiCall(path,{method:'POST',body:JSON.stringify(body)},key);
const apiPatch=(path,body,key)=>apiCall(path,{method:'PATCH',body:JSON.stringify(body)},key);

async function mutate(fn){
  NOTI_QUEUE=[];              // やり直しのたびに積み直すので、始める前に空にする
  fn(DB);
  sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
  let conflicted=false;
  for(let attempt=0;attempt<3;attempt++){
    try{
      const res=await putDB();
      if(res.ok){
        DB.updatedAt=(await res.json()).updatedAt;
        sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
        setSaveError(null);
        await flushNotifications();   // 保存できてから通知を送る
        sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
        if(conflicted&&ME)render(); // 取り込んだ他の人の変更を画面に出す
        return true;
      }
      if(res.status!==409){
        const d=await res.json().catch(()=>({}));
        setSaveError(d.error||'変更を保存できませんでした。');
        NOTI_QUEUE=[];          // 保存できていないので通知も送らない
        return false;
      }
      conflicted=true;
      DB=await apiGetDB();      // 最新を取り込んで
      NOTI_QUEUE=[];            // やり直しで積み直されるため、前回の分は捨てる
      fn(DB);                   // 同じ操作をやり直す
      sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
    }catch(e){
      console.warn('保存に失敗しました',e);
      setSaveError('変更を保存できていません。通信状況をご確認ください。');
      NOTI_QUEUE=[];
      return false;
    }
  }
  setSaveError('他の方の操作と重なって保存できませんでした。もう一度お試しください。');
  NOTI_QUEUE=[];
  return false;
}

/* 保存できていないことを画面上部の帯で知らせる。
   以前は保存に失敗しても「保存しました」と表示されており、
   データが消えたことに気づけないままだった。msg=null で帯を消す */
function setSaveError(msg){
  const bar=document.getElementById('savebar');
  if(!bar)return;
  bar.classList.toggle('hidden',!msg);
  if(msg)bar.querySelector('.sb-msg').textContent=msg;
}
async function retrySave(){
  const btn=document.getElementById('savebarBtn');
  if(btn){btn.disabled=true;btn.textContent='保存中…';}
  let msg='';
  try{
    const res=await putDB();
    if(res.ok){
      DB.updatedAt=(await res.json()).updatedAt;
      sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
      setSaveError(null);msg='保存しました';
    }else if(res.status===409){
      // 何をやり直せばよいか分からないため、最新を取り込んで操作し直してもらう
      DB=await apiGetDB();
      sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
      setSaveError(null);render();
      msg='他の方が先に更新していたため、最新の内容に更新しました。お手数ですが操作をやり直してください。';
    }else{
      const d=await res.json().catch(()=>({}));
      msg=d.error||'保存できませんでした';
    }
  }catch(e){msg='通信に失敗しました。時間をおいて再度お試しください。';}
  if(btn){btn.disabled=false;btn.textContent='再試行';}
  toast(msg);
}

/* 入力欄から離れたら、見送っていた更新を反映する。
   次にどこへ移ったかが決まってから見たいので、一拍おいてから確かめる */
document.addEventListener('focusout',()=>setTimeout(flushPendingRefresh,0));

// 他端末・他ブラウザでの変更をゆるやかに反映する定期ポーリング（30秒間隔）
function startPolling(){
  setInterval(async()=>{
    if(SYNCING)return;
    SYNCING=true;
    try{
      const remote=await apiGetDB();
      if(remote&&remote.updatedAt&&remote.updatedAt!==DB.updatedAt){
        DB=remote;
        sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
        if(ME)render();
      }
    }catch(e){/* オフライン時は無視 */}
    finally{SYNCING=false;}
  },30000);
}

const ROLE_JP={intern:'インターン生',staff:'スタッフ',branch_admin:'支部管理者',admin:'管理者'};

const STATUS={none:{t:'未申請',c:'st-none'},applied:{t:'申請中',c:'st-applied'},fixed:{t:'確定済み',c:'st-fixed'},failed:{t:'不成立',c:'st-failed'}};
/* 面談の希望日時を取り出す。以前は choice1〜choice3 の3項目だったが
   希望を何件でも出せるようにしたため choices 配列へ移した。
   古い申請には choices が無いので、その場合だけ旧項目から組み立てる */
function ivChoices(iv){
  if(!iv)return [];
  if(Array.isArray(iv.choices)&&iv.choices.length)return iv.choices;
  return [iv.choice1,iv.choice2,iv.choice3].filter(Boolean);
}
const SLOT_MS=30*60*1000;
/* 続いている30分枠をひとつの希望としてまとめる。
   12:00・12:30・13:00 を選んだら「12:00〜13:30」で1件という数え方になる。
   固まりの並び順は「その固まりの枠に最初に触れた位置」で決まるので、
   なぞった順＝希望順がそのまま残る。日をまたぐ枠は続いていても分ける */
function groupSlots(list){
  const first=new Map();
  (list||[]).forEach((iso,i)=>{if(iso&&!first.has(iso))first.set(iso,i);});
  const sorted=[...first.keys()].sort((a,b)=>new Date(a)-new Date(b));
  const runs=[];
  for(const iso of sorted){
    const run=runs[runs.length-1];
    const prev=run&&run[run.length-1];
    const d=new Date(iso),p=prev&&new Date(prev);
    if(p&&d-p===SLOT_MS&&d.getDate()===p.getDate())run.push(iso);
    else runs.push([iso]);
  }
  const at=r=>Math.min(...r.map(x=>first.get(x)));
  return runs.sort((a,b)=>at(a)-at(b));
}
/* 申請の希望を、申請ページと同じ数え方でまとめる。
   ふつうは続いた30分枠が1件。ただし申請者が「終日OK」を選んだ日は、
   途中に埋まっていた時間があっても、その日ぜんぶで1件として扱う。
   「この日はいつでもいい」という申し出を2つにも3つにも割って見せないため。
   all_day を持たない申請（この仕組みより前のもの）は、今までどおり続き具合だけで分ける */
function ivGroups(iv){
  const allDay={};
  (iv&&Array.isArray(iv.all_day)?iv.all_day:[]).forEach(d=>{allDay[d]=true;});
  const first=new Map();
  ivChoices(iv).forEach((iso,i)=>{if(iso&&!first.has(iso))first.set(iso,i);});
  const sorted=[...first.keys()].sort((a,b)=>new Date(a)-new Date(b));
  const runs=[];
  for(const iso of sorted){
    const key=ymd(new Date(iso));
    if(allDay[key]){
      const found=runs.find(r=>r.allDay&&r.key===key);
      if(found){found.slots.push(iso);continue;}
      runs.push({allDay:true,key,slots:[iso]});continue;
    }
    const last=runs[runs.length-1];
    const prev=last&&!last.allDay&&last.slots[last.slots.length-1];
    if(prev&&new Date(iso)-new Date(prev)===SLOT_MS&&key===ymd(new Date(prev))){
      last.slots.push(iso);continue;
    }
    runs.push({allDay:false,key,slots:[iso]});
  }
  const at=r=>Math.min(...r.slots.map(x=>first.get(x)));
  return runs.sort((a,b)=>at(a)-at(b));
}
/* 区間の終わりに出す時刻。理由と規則は apply.html の runEnd と同じ
   （設計書 _specs/2026-08-06-面談まわりの改善-design.md の 1.4）。
   申請画面とスタッフ画面で違う数え方をすると、同じ希望が別の時間に見えてしまう */
function runEnd(run){
  const last=run[run.length-1];
  if(run.length>1)return new Date(last);
  return new Date(new Date(last).getTime()+SLOT_MS);
}
/* まとまりの見出し。「8/6(木) 9:00〜11:00＆14:00〜22:30」。
   終日OKの日は途中が抜けることがあるので、続いた区間ごとに ＆ でつなぐ */
function fmtGroupRange(g){
  if(!g||!g.slots.length)return '—';
  const runs=[];
  g.slots.slice().sort((a,b)=>new Date(a)-new Date(b)).forEach(iso=>{
    const run=runs[runs.length-1];
    const prev=run&&run[run.length-1];
    if(prev&&new Date(iso)-new Date(prev)===SLOT_MS)run.push(iso);
    else runs.push([iso]);
  });
  const times=runs.map(r=>`${hm(r[0])}〜${hm(runEnd(r))}`).join('＆');
  return `${fmtDate(g.slots[0])} ${times}`;
}
/* 「8/5(火) 12:00〜13:30」。終わりは最後の枠の30分後 */
function fmtSlotRange(g){
  if(!g||!g.length)return '—';
  if(g.length===1)return fmtDT(g[0]);
  return `${fmtDT(g[0])}〜${hm(new Date(new Date(g[g.length-1]).getTime()+SLOT_MS))}`;
}
/* 黒地でも沈まない色に統一。黄色系は使わない方針のため外してある */

  {v:'#f47ab0',n:'ピンク'},{v:'#f4706f',n:'レッド'},{v:'#5fd0e8',n:'スカイ'},{v:'#9aa5ad',n:'グレー'},
];
/* カレンダーのチップ色。イベント作成時に選んだ色から地色と文字色を作る。
   ライトは「白に寄せた薄い地色＋濃い文字」、ダークは逆に「黒に寄せた濃い地色＋
   明るい文字」にしないと読めなくなる。判定は端末設定ではなくアプリのテーマに合わせる */
const isDarkMode=()=>document.documentElement.getAttribute('data-theme')!=='light';
function _hexRgb(v){const s=v.replace('#','');return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];}
function chipBg(v){
  if(v.startsWith('var'))return 'var(--iv-soft)';
  const[r,g,b]=_hexRgb(v);
  const f=isDarkMode()?(x=>Math.round(x*0.30)):(x=>Math.round(x+(255-x)*0.84));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function chipFg(v){
  if(v.startsWith('var'))return 'var(--iv)';
  const[r,g,b]=_hexRgb(v);
  const f=isDarkMode()?(x=>Math.round(x+(255-x)*0.45)):(x=>Math.round(x*0.72));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(name){return (name||'?').slice(0,1);}
function pad(n){return String(n).padStart(2,'0');}
function fmtDT(iso){if(!iso)return '—';const d=new Date(iso);const w='日月火水木金土'[d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${w}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function fmtDate(iso){const d=new Date(iso);const w='日月火水木金土'[d.getDay()];return `${d.getMonth()+1}/${d.getDate()}(${w})`;}
function fmtRel(iso){const diff=(Date.now()-new Date(iso))/1000;
  if(diff<60)return 'たった今';if(diff<3600)return Math.floor(diff/60)+'分前';
  if(diff<86400)return Math.floor(diff/3600)+'時間前';return Math.floor(diff/86400)+'日前';}
function toInputDT(iso){if(!iso)return '';const d=new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}
const WD_JP=['日','月','火','水','木','金','土'];
/* 受付時間を設定していないスタッフの既定値。server/slots.js の DEFAULT_WEEKLY と同じにすること。
   設定していない人でも実際に申し込んでもらえるよう、曜日を問わず9〜23時にしてある */
const DEFAULT_WEEKLY={0:{on:true,s:'09:00',e:'23:00'},1:{on:true,s:'09:00',e:'23:00'},2:{on:true,s:'09:00',e:'23:00'},
  3:{on:true,s:'09:00',e:'23:00'},4:{on:true,s:'09:00',e:'23:00'},5:{on:true,s:'09:00',e:'23:00'},6:{on:true,s:'09:00',e:'23:00'}};
function getWeekly(id){const a=DB.availability&&DB.availability[id];return (a&&a.weekly)?a.weekly:DEFAULT_WEEKLY;}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function hm(iso){const d=new Date(iso);return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}

// スタッフの空きスロット（30分刻み）を今後N日分生成
// 除外条件：曜日別の可能時間帯外／登録済みの不可時間ブロック／確定済み面談
function genSlots(staffId,days=14){
  const weekly=getWeekly(staffId);
  const blocks=((DB.availability[staffId]||{}).blocks||[]).map(b=>[new Date(b.start).getTime(),new Date(b.end).getTime()]);
  const taken=(DB.interviews||[]).filter(i=>i.staff_id===staffId&&i.status==='fixed'&&i.confirmed_datetime)
    .map(i=>new Date(i.confirmed_datetime).getTime());
  const now=Date.now();const out=[];
  for(let off=0;off<days;off++){
    const day=new Date();day.setHours(0,0,0,0);day.setDate(day.getDate()+off);
    const conf=weekly[day.getDay()];
    if(!conf||!conf.on)continue;
    const [sh,sm]=conf.s.split(':').map(Number);
    const [eh,em]=conf.e.split(':').map(Number);
    const slots=[];
    for(let t=sh*60+sm; t+30<=eh*60+em; t+=30){
      const dt=new Date(day);dt.setHours(Math.floor(t/60),t%60,0,0);
      const st=dt.getTime(),en=st+30*60*1000;
      if(st<now)continue;
      const bad=blocks.some(([bs,be])=>st<be&&en>bs) || taken.some(x=>Math.abs(x-st)<30*60*1000-1);
      slots.push({iso:dt.toISOString(),time:`${pad(Math.floor(t/60))}:${pad(t%60)}`,ok:!bad});
    }
    if(slots.length)out.push({dateObj:day,slots});
  }
  return out;
}

// 不可時間エディタ用：週マトリクス表データ生成（月曜始まり7日 × 30分刻み）
// state: 'off'（受付時間外）/ 'free'（受付中）/ 'block'（不可・解除可）/ 'locked'（予定・面談あり＝操作不可）
function genEditGrid(staffId,weekOffset){
  const weekly=getWeekly(staffId);
  const blocks=((DB.availability[staffId]||{}).blocks||[]);
  const taken=(DB.interviews||[]).filter(i=>i.staff_id===staffId&&i.status==='fixed'&&i.confirmed_datetime)
    .map(i=>new Date(i.confirmed_datetime).getTime());
  const now=Date.now();
  const today=new Date();today.setHours(0,0,0,0);
  const dow=today.getDay();
  const diffToMon=(dow===0?-6:1-dow);
  const monday=new Date(today);monday.setDate(today.getDate()+diffToMon+weekOffset*7);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d);}
  let minM=Infinity,maxM=-Infinity;
  days.forEach(d=>{const conf=weekly[d.getDay()];if(conf&&conf.on){
    const [sh,sm]=conf.s.split(':').map(Number);const [eh,em]=conf.e.split(':').map(Number);
    minM=Math.min(minM,sh*60+sm);maxM=Math.max(maxM,eh*60+em);}});
  if(minM===Infinity){minM=9*60;maxM=19*60;}
  const times=[];for(let t=minM;t+30<=maxM;t+=30)times.push(t);
  const grid=days.map(day=>{
    const conf=weekly[day.getDay()];
    return times.map(t=>{
      const dt=new Date(day);dt.setHours(Math.floor(t/60),t%60,0,0);
      const st=dt.getTime(),en=st+30*60000;
      const iso=dt.toISOString();
      if(!conf||!conf.on)return{state:'off',iso};
      const [sh,sm]=conf.s.split(':').map(Number);const [eh,em]=conf.e.split(':').map(Number);
      if(t<sh*60+sm||t+30>eh*60+em)return{state:'off',iso};
      if(st<now)return{state:'off',iso};
      const takenHit=taken.some(x=>Math.abs(x-st)<30*60000-1);
      if(takenHit)return{state:'locked',iso,label:'面談'};
      const blk=blocks.find(b=>{const bs=new Date(b.start).getTime(),be=new Date(b.end).getTime();return st<be&&en>bs;});
      if(blk){
        return blk.kind==='slot'?{state:'block',iso,blockId:blk.id}:{state:'locked',iso,label:'予定'};
      }
      return{state:'free',iso};
    });
  });
  return{days,times,grid};
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');

/* ---------- sheet ---------- */
function openSheet(html){const s=document.getElementById('sheet');
  s.innerHTML='<div class="grab"></div>'+html;document.getElementById('scrim').classList.add('open');
  bindSheetSwipe();}
/* 上のバーを持って下へ払うと閉じる。
   スマホでは画面の外まで指を伸ばして背景を押すのが面倒なので、その場で閉じられるようにする。
   途中で止めたときは、指を離した位置で閉じるか戻すかを決める */
function bindSheetSwipe(){
  const sheet=document.getElementById('sheet');
  const grab=sheet.querySelector('.grab');
  if(!grab)return;
  let y0=null,dy=0;
  const move=e=>{
    if(y0==null)return;
    dy=Math.max(0,e.clientY-y0);   // 上には動かさない
    sheet.style.transform=`translateY(${dy}px)`;
  };
  const end=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',end);
    document.removeEventListener('pointercancel',end);
    document.body.classList.remove('noselect');
    if(y0==null)return;
    y0=null;
    sheet.style.transition='';
    sheet.style.transform='';
    // 少しだけ動かしたときは閉じない。触れただけで消えると戸惑うため
    if(dy>90)closeSheet();
  };
  grab.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;
    e.preventDefault();
    y0=e.clientY;dy=0;
    sheet.style.transition='none';
    document.body.classList.add('noselect');
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',end);
    document.addEventListener('pointercancel',end);
  });
}
function closeSheet(){
  document.getElementById('scrim').classList.remove('open');
  // 確認ダイアログを背景タップで閉じた場合は「キャンセル」として扱う
  if(_confirmResolve){const r=_confirmResolve;_confirmResolve=null;r(false);}
  // シートを開いている間に見送った更新を、ここで反映する
  flushPendingRefresh();
}

/* 確認ダイアログ。ブラウザ標準の confirm() はスマホで見た目が浮いてしまうため、
   アプリ内のボトムシートに統一する。true/false を返すので await して使う */
let _confirmResolve=null;
function confirmSheet(title,message,okLabel='実行する',danger=true){
  return new Promise(resolve=>{
    _confirmResolve=resolve;
    openSheet(`<h3>${esc(title)}</h3>
      <p class="page-sub">${esc(message).replace(/\n/g,'<br>')}</p>
      <div class="btn-row" style="margin-top:18px">
        <button class="btn" style="flex:1" onclick="resolveConfirm(false)">キャンセル</button>
        <button class="btn ${danger?'bad':'pri'}" style="flex:1" onclick="resolveConfirm(true)">${esc(okLabel)}</button>
      </div>`);
  });
}
function resolveConfirm(v){
  const r=_confirmResolve;_confirmResolve=null;
  closeSheet();
  if(r)r(v);
}
/* 選択肢のないお知らせ。ブラウザ標準の alert() の置き換え */
function alertSheet(title,message){
  return new Promise(resolve=>{
    _confirmResolve=resolve;
    openSheet(`<h3>${esc(title)}</h3>
      <p class="page-sub">${esc(message).replace(/\n/g,'<br>')}</p>
      <button class="btn pri block" style="margin-top:18px" onclick="resolveConfirm(true)">閉じる</button>`);
  });
}

async function doForgotPassword(){
  const email=document.getElementById('forgotEmail').value.trim();
  const err=document.getElementById('forgotErr');
  const btn=document.getElementById('forgotBtn');
  const done=document.getElementById('forgotDone');
  err.classList.remove('show');
  if(!email){err.textContent='メールアドレスを入力してください';err.classList.add('show');return;}
  btn.disabled=true;btn.textContent='送信中…';
  try{
    const res=await api('/api/auth/forgot-password',{method:'POST',body:JSON.stringify({email})});
    const data=await res.json();
    if(!res.ok){
      err.textContent=data.error||'送信に失敗しました';err.classList.add('show');
      btn.disabled=false;btn.textContent='再設定メールを送る';return;
    }
    // 連打で何通も送られないよう、送信後はボタンを戻さない
    done.querySelector('span:last-child').textContent=data.message;
    done.classList.remove('hidden');
    btn.textContent='送信しました';
  }catch(e){
    err.textContent='通信に失敗しました。時間をおいて再度お試しください。';err.classList.add('show');
    btn.disabled=false;btn.textContent='再設定メールを送る';
  }
}

/* 署名付きトークンから、画面に出すためのメールアドレスと氏名を取り出す。
   ここでの読み取りは表示目的だけ。改ざんされていないかの確認は必ずサーバー側で行う */
function readVerifiedToken(token){
  try{
    const b64=String(token).split('.')[0];
    const json=decodeURIComponent(escape(atob(b64.replace(/-/g,'+').replace(/_/g,'/'))));
    const claims=JSON.parse(json);
    return claims.email?claims:null;
  }catch(e){return null;}
}

const THEME_KEY='ops_theme_v1';

/* =========================================================
   左端の縦メニュー（サイドバー）
   広い画面では中身を左に押し出し、狭い画面ではアイコンだけの細い帯にする。
   広げた状態はスマホでは中身の上に重ねる（押し出すと本文が読めなくなるため）
   ========================================================= */
const SB_KEY='ops_sidebar_v1';
const sbState=()=>document.documentElement.getAttribute('data-sb')==='collapsed'?'collapsed':'expanded';
const isNarrow=()=>window.matchMedia('(max-width:760px)').matches;
function setSidebar(state){
  document.documentElement.setAttribute('data-sb',state);
  try{localStorage.setItem(SB_KEY,state);}catch(e){}
  const t=document.getElementById('sbToggle');
  if(t)t.setAttribute('aria-expanded',state==='expanded'?'true':'false');
  // 狭い画面で広げているときだけ、背面を触れないようにする
  document.getElementById('sbScrim').classList.toggle('open',state==='expanded'&&isNarrow());
  document.body.style.overflow=(state==='expanded'&&isNarrow())?'hidden':'';
}
function toggleSidebar(){setSidebar(sbState()==='expanded'?'collapsed':'expanded');}
function collapseSidebar(){setSidebar('collapsed');}
/* 画面の幅が変わったとき、スマホで広げっぱなしだと本文が隠れるので畳む */
window.addEventListener('resize',()=>{
  if(!isNarrow())document.getElementById('sbScrim').classList.remove('open');
  else if(sbState()==='expanded')setSidebar('collapsed');
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&isNarrow()&&sbState()==='expanded')collapseSidebar();
});
/* 画面ナビを選んだとき、狭い画面では広げたままだと中身が見えないので畳む */
function sbGo(tab){ if(isNarrow())collapseSidebar(); go(tab); }

/* =========================================================
   スクロール連動フェードアップ
   画面を描き直すたびに bindReveal() を呼び、まだ見ていない要素だけ監視する
   ========================================================= */
const REVEAL_IO=('IntersectionObserver' in window)?new IntersectionObserver(es=>{
  es.forEach(en=>{
    if(!en.isIntersecting)return;
    en.target.classList.add('in');
    REVEAL_IO.unobserve(en.target); // 一度出したら監視をやめる
  });
},{rootMargin:'0px 0px -8% 0px',threshold:.06}):null;
function bindReveal(root){
  const scope=root||document;
  // 明示的に付いた .reveal と、画面ごとの主要な塊を拾う。
  // 見出し（h1.page）は動かさない。すぐ下の説明文だけ先に出てしまい、
  // 重なって見えるうえ「読み始めたい場所」が遅れて出るのは邪魔になるため
  scope.querySelectorAll('.card,.hex,.reveal').forEach(el=>{
    if(el.classList.contains('in'))return;
    el.classList.add('reveal');
    if(REVEAL_IO)REVEAL_IO.observe(el); else el.classList.add('in');
  });
}

function render(){

     今どこにいるかが色でも分かる。並びは TAB_ACC の順（ライトのときだけ見える） */
  m.innerHTML=`<div class="view ${TAB_ACC[t]||'a1'}">${homeBackBtn()}${viewFor(t)}</div>`;

/* 中身は render() と同じだが、現れる演出を通さずそのまま出す。

   render() は bindReveal() で全カードを「透明＋下にずらす」状態へ戻すため、
   背景の更新で呼ぶと画面がいったん消えてフェードで戻る＝暗転して見える。
   人が押した操作は render()、サーバーからの更新は renderQuiet() を使うこと。

   読んでいた位置がずれると結局じゃまになるので、縦の位置も戻す */
function renderQuiet(){
  const m=document.getElementById('main');
  const t=currentTab;
  const y=window.scrollY;
  m.innerHTML=`<div class="view ${TAB_ACC[t]||'a1'}">${homeBackBtn()}${viewFor(t)}</div>`;
  // .in まで最初から付けるので、透明の状態を一度も通らない
  m.querySelectorAll('.card,.hex').forEach(el=>el.classList.add('reveal','in'));
  window.scrollTo(0,y);
  updateBell();
}

/* ホームの入口タイル。参考サイトのポートフォリオに合わせて六角形で並べる。
   act には onclick にそのまま入るJSを渡す（go('my') でも openXxx() でもよい）。
   icon は ICON の名前（引数名を ic にすると同名の関数を隠してしまうので避けている）。
   badge は右上に出す件数（0や未指定なら出さない） */
function hex(act,icon,t,d,badge){
  return `<button class="hex" onclick="${act}">
    ${badge?`<span class="hxb">${badge}</span>`:''}
    <span class="hxi">${ic(icon)}</span>
    <span class="hxt">${t}</span>
    <span class="hxd">${d}</span></button>`;
}
/* 六角形をハニカム状に並べる。1行は最大4個までで、
   4個以下なら1行に収める。行が増えたら1つおきに半個ずらして噛み合わせる。
   4個→4、6個→3＋3、7個→4＋3、10個→4＋4＋2。
   1個あたりの幅は --cols から計算するので、行数が変わってもCSSは触らずに済む */
const HEX_PER_ROW=4;
/* 差し色は4色を順に回す。文字列から決まった番号を出すので、
   同じ人・同じ画面には毎回おなじ色が付く（開くたびに変わらない） */
function accCls(n){return 'a'+((n%4)+1);}
function accOf(str){
  let h=0;
  for(const ch of String(str||''))h=(h*31+ch.charCodeAt(0))>>>0;
  return accCls(h);
}
function hexgrid(items){
  const n=items.length;
  const rows=Math.max(1,Math.ceil(n/HEX_PER_ROW));
  // 行数を決めてから均等に割るので、最後の行だけ極端に少なくならない
  const per=Math.max(1,Math.ceil(n/rows));
  // 並び順のとおりに差し色を割り当てる（1枚目から順に4色を回す）
  const painted=items.map((h,i)=>h.replace('class="hex"',`class="hex ${accCls(i)}"`));
  const chunks=[];
  for(let i=0;i<n;i+=per)chunks.push(painted.slice(i,i+per));
  const html=chunks.map((c,i)=>`<div class="hexrow${i%2?' off':''}">${c.join('')}</div>`).join('');
  return `<div class="hexwrap"><div class="hexgrid" style="--cols:${per};--off:${chunks.length>1?'.5':'0'}">${html}</div></div>`;
}

async function loadSharedCalOptions(current){

/* Googleカレンダーを開くボタン。
   パソコンでは新しいタブ、スマホではGoogleカレンダーアプリが開く。
   どちらも日調アプリの画面は残るので、カレンダーを見ながら入力を続けられる */
function openCalendarButton(){
  const label=isMobileDevice()?'Googleカレンダーアプリを開く':'Googleカレンダーを新しいタブで開く';
  const note=isMobileDevice()
    ? 'カレンダーで予定を確認したら、この画面に戻って入力できます。'
    : 'カレンダーを見ながら、この画面に予定を入力できます。';
  return `<button class="btn block" style="margin-top:16px" onclick="openGoogleCalendarTab()">
    ${GOOGLE_LOGO_SVG}<span style="margin-left:8px">${label}</span></button>
    <p class="fine" style="margin-top:8px">${note}</p>`;
}
function isMobileDevice(){
  return /iPhone|iPad|iPod|Android/.test(navigator.userAgent);
}
function openGoogleCalendarTab(){
  // ログイン中のGoogleアカウントで開くよう authuser にメールアドレスを渡す
  const web=ME&&ME.email
    ? `https://calendar.google.com/calendar/u/0/r?authuser=${encodeURIComponent(ME.email)}`
    : 'https://calendar.google.com/calendar/u/0/r';
  const ua=navigator.userAgent;

  if(/Android/.test(ua)){
    // Androidはintent://でアプリを直接開く。未インストールならブラウザ版に自動で切り替わる
    location.href='intent://calendar.google.com/calendar/r#Intent;scheme=https;'
      +'package=com.google.android.calendar;S.browser_fallback_url='
      +encodeURIComponent(web)+';end';
    return;
  }
  if(/iPhone|iPad|iPod/.test(ua)){
    // iOSはURLスキームで開く。アプリが入っていないと何も起きないため、
    // 少し待ってからブラウザ版に切り替える。アプリが開いた場合は画面が隠れるので取り消す
    const fallback=setTimeout(()=>{location.href=web;},1500);
    const onHide=()=>{
      if(document.hidden){
        clearTimeout(fallback);
        document.removeEventListener('visibilitychange',onHide);
      }
    };
    document.addEventListener('visibilitychange',onHide);
    location.href='googlecalendar://';
    return;
  }
  window.open(web,'_blank','noopener');
}
async function disconnectGoogleCalendar(){
  if(!await confirmSheet('Googleカレンダー連携を解除',

  try{
    await api('/api/auth/google/disconnect',{method:'POST',body:JSON.stringify({staffId:ME.id})});

}

/* 面談のインターン生まわり。
   アカウントを廃止したため、申請にはユーザーが結びついていないものがある。
   その場合は本人が入力した本名（intern_name）を使う。
   古い申請はこれまでどおりユーザーから引く。 */
function ivIntern(iv){return findUser(iv.intern_id);}
function ivInternName(iv){const u=ivIntern(iv);return u?u.nickname:(iv.intern_name||'—');}
function ivInternBranch(iv){const u=ivIntern(iv);return u?u.branch_id:iv.branch_id;}
/* アカウントを持たない申請か。
   メール送信など、相手のアカウントが要る操作を出し分けるのに使う */
function ivIsGuest(iv){return !ivIntern(iv);}
/* この面談が自分の支部のものか。ゲスト申請は支部が直接入っている */
function ivInMyBranch(iv){return ivInternBranch(iv)===ME.branch_id;}

function viewStaffInterviews(){
  // staff sees interviews of own branch (assigned to them or their branch)
  const all=(DB.interviews||[]).filter(iv=>{
    return iv.staff_id===ME.id || ivInMyBranch(iv);
  }).sort((a,b)=>{const order={applied:0,fixed:1,failed:2};return order[a.status]-order[b.status]||new Date(b.created_at)-new Date(a.created_at);});
  if(!all.length)return `<h1 class="page">面談一覧</h1><div class="empty"><div class="ei">${ic('list')}</div><p>担当する面談はまだありません。</p></div>`;

  const chip=(v,label)=>`<button class="${IVFILTER.status===v?'on':''}" onclick="setIvFilter('status','${v}')">${label}<span style="opacity:.7"> ${v==='all'?cnt.all:cnt[v]}</span></button>`;
  const filterBar=`<div class="chipfilter">
      ${chip('all','すべて')}${chip('applied','申請中')}${chip('fixed','確定済み')}${chip('failed','不成立')}
    </div>

      <input placeholder="学生名で検索" value="${esc(IVFILTER.q)}" oninput="IVFILTER.q=this.value" onchange="render()"
        onkeydown="if(event.key==='Enter')render()">
      ${q||IVFILTER.status!=='all'?`<button class="btn sm" onclick="clearIvFilter()">クリア</button>`:''}

  if(!list.length)return `<h1 class="page">面談一覧</h1>

    ${filterBar}
    <div class="empty"><div class="ei">${ic('search')}</div><p>条件に一致する面談がありません。</p></div>`;
  const rows=list.map(iv=>{const s=STATUS[iv.status];const intern=ivIntern(iv);const nm=ivInternName(iv);
    return `<div class="row" onclick="openInterview('${iv.id}')">
      <span class="av ${accOf(intern?.id||iv.id)}">${esc(initials(nm))}</span>

        <span class="rs">申請 ${fmtRel(iv.created_at)}${iv.status==='fixed'?'・確定 '+fmtDT(iv.confirmed_datetime):''}</span>
      </span>
      <span class="pill ${s.c}">${s.t}</span>
    </div>`;}).join('');
  return `<h1 class="page">面談一覧</h1>
    <p class="page-sub">${branchName(ME.branch_id)}の面談 ${all.length}件${cnt.applied?` ・ 確定待ち ${cnt.applied}件`:''}${list.length!==all.length?` ・ 表示中 ${list.length}件`:''}</p>

}

function clearIvFilter(){IVFILTER={status:'all',branch:'all',q:''};render();}
function openInterview(id){

      ${guest?`<div class="hint mock" style="margin-top:12px">${ic('alert')}<span>この申請にはメールアドレスがありません。

      <div><h3 style="margin:0">${esc(internName)}</h3>
        <div class="rs" style="color:var(--sub);font-size:13px">${branchName(ivInternBranch(iv))} ・ 申請 ${fmtRel(iv.created_at)}</div></div>

    </div>
    <div style="height:12px"></div>

}
/* 手元の面談一覧を、サーバーが返した内容で入れ替える */
function applyInterview(next){
  DB.interviews=(DB.interviews||[]).map(x=>x.id===next.id?next:x);
  sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
}
async function confirmInterview(id,dt){
  const iv=(DB.interviews||[]).find(x=>x.id===id);
  if(!iv)return;
  const next=await apiPatch(`/api/interviews/${encodeURIComponent(id)}`,
    {status:'fixed',confirmed_datetime:dt},'interview');
  if(!next)return;
  applyInterview(next);
  updateBell();
  closeSheet();
  // アカウントの無い申請は宛先が無いので、メール作成画面へは進まない
  if(ivIsGuest(iv)){
    toast('面談を確定しました。日時は直接お伝えください');
    return;
  }
  toast('面談を確定しました（カレンダー登録・通知済み）');
  openSendMail(iv.intern_id,'面談確定のお知らせ',
    `お疲れ様です。\n面談日程が下記のとおり確定しましたのでお知らせします。\n\n日時：${fmtDT(dt)}\n\nよろしくお願いいたします。`,'fixed');
}
function openCustomConfirm(id){
  openSheet(`<h3>別日時で確定</h3>
    <p class="page-sub">候補以外の日時を指定して確定します。</p>
    <label class="fl">確定日時<span class="req">*</span></label>
    <input type="datetime-local" id="customDT">
    <div class="field-err" id="customDTe"></div>
    <button class="btn pri block" style="margin-top:16px" onclick="doCustomConfirm('${id}')">この日時で確定</button>`);
}
function doCustomConfirm(id){
  const v=document.getElementById('customDT').value;const e=document.getElementById('customDTe');
  e.classList.remove('show');
  if(!v){e.textContent='日時を入力してください';e.classList.add('show');return;}
  if(new Date(v)<new Date()){e.textContent='過去の日時は指定できません';e.classList.add('show');return;}
  confirmInterview(id,new Date(v).toISOString());
}
async function failInterview(id){
  const iv=(DB.interviews||[]).find(x=>x.id===id);
  if(!iv)return;
  const guest=ivIsGuest(iv);
  if(!await confirmSheet('面談を不成立にする',
    guest
      ? `${ivInternName(iv)}さんの面談を「不成立」にします。メールアドレスが無いため、再提出のお願いは直接お伝えください。`
      : `${ivInternName(iv)}さんの面談を「不成立」にします。続けて、再提出依頼メールの作成画面に進みます。`,
    '不成立にする'))return;
  const next=await apiPatch(`/api/interviews/${encodeURIComponent(id)}`,{status:'failed'},'interview');
  if(!next)return;
  applyInterview(next);
  updateBell();
  closeSheet();
  if(guest){toast('不成立にしました。再提出のお願いは直接お伝えください');return;}
  // show mail template per spec
  openSendMail(iv.intern_id,'面談日程再提出のお願い',
    `お疲れ様です。\n\nご提出いただいた候補日では面談日程の調整が難しかったため、お手数ですが再度候補日をご提出いただけますでしょうか。\n\nご迷惑をおかけし申し訳ありません。\n\nよろしくお願いいたします。`,'failed');
}
async function reopenInterview(id){
  const next=await apiPatch(`/api/interviews/${encodeURIComponent(id)}`,{status:'applied'},'interview');
  if(!next)return;
  applyInterview(next);
  closeSheet();toast('申請中に戻しました');go('interviews');
}

/* =========================================================

   ========================================================= */
/* kind に 'fixed'（面談確定）／'failed'（不成立）を渡したときだけ、実際にメールが届く。
   それ以外（Meet/Zoomリンクの送付など）はアプリ内の履歴に残るだけ */
const REAL_MAIL_KINDS=['fixed','failed'];
function openSendMail(receiverId,subject,body,kind){
  const r=findUser(receiverId);
  const real=REAL_MAIL_KINDS.includes(kind);
  openSheet(`<h3>メール送信</h3>
    ${real
      ?`<div class="hint">${ic('send')}<span>このメールは <b>${esc(r?.email||'ご本人のメールアドレス')}</b> 宛に実際に送信されます。</span></div>`
      :`<div class="hint mock">${ic('mail')}<span>このメールは実際には送信されず、アプリ内の履歴に記録されます。</span></div>`}
    <dl class="kv" style="margin:12px 0 4px"><dt>宛先</dt><dd>${esc(r?.nickname||'—')}（インターン生）</dd></dl>
    <label class="fl">件名</label>
    <input id="mailSubj" value="${esc(subject)}">
    <label class="fl">本文</label>
    <textarea id="mailBody" style="min-height:180px">${esc(body)}</textarea>
    <div class="field-err" id="mailErr"></div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn" style="flex:1" onclick="closeSheet()">閉じる</button>
      <button class="btn pri" style="flex:2" id="mailBtn" onclick="sendMail('${receiverId}','${kind||''}')">
        ${real?'送信する':'履歴に記録する'}</button>
    </div>`);
}
async function sendMail(receiverId,kind){
  const subject=document.getElementById('mailSubj').value.trim();
  const body=document.getElementById('mailBody').value.trim();
  const err=document.getElementById('mailErr');
  const btn=document.getElementById('mailBtn');
  err.classList.remove('show');
  if(!subject){err.textContent='件名を入力してください';err.classList.add('show');return;}
  btn.disabled=true;btn.textContent='送信中…';
  try{
    const res=await api('/api/mail/send',{method:'POST',
      body:JSON.stringify({receiver_id:receiverId,subject,body,kind})});
    const data=await res.json();
    if(!res.ok){
      err.textContent=data.error||'送信に失敗しました';err.classList.add('show');
      btn.disabled=false;btn.textContent='送信する';return;
    }
    closeSheet();
    toast(data.warning||(data.sent?'メールを送信しました':'履歴に記録しました'));
    /* 履歴はサーバーが書き込む。書き込んだ1件が返ってくるので、
       DB全体を取り直さずにそれだけ手元へ足す */
    if(data.email)DB.emails=[...(DB.emails||[]),data.email];
    sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
    render();
  }catch(e){
    err.textContent='通信に失敗しました。時間をおいて再度お試しください。';err.classList.add('show');
    btn.disabled=false;btn.textContent='送信する';
  }
}

/* =========================================================
   全体予定表（ドットジェイピーの共有カレンダー）
   ---------------------------------------------------------
   管理者が連携した1つのGoogleカレンダーを、スタッフ全員のカレンダーに
   読み取り専用で重ねて表示する。予定はDBに入れずサーバー経由で都度取得するので、
   Googleカレンダー側で予定が変わればそのまま反映される。
   表示している月ごとに取りに行き、一度取った月は覚えておく。
   ========================================================= */
/* 支部イベント（EVENT_COLORS）にも面談（--iv）にも使っていない色にして、
   全体予定表の予定だとひと目で分かるようにする */
const SHARED_CAL_COLOR='#f0955b';
/* 自分のGoogleカレンダーの予定は、全社の予定と見分けが付く色にする */
const MY_CAL_COLOR='#7f8fa6';
let SHARED_CAL={events:{},loading:{},configured:null,name:null,calendarId:null};
/* 全社カレンダーを自分の画面から隠す設定。
   この端末にだけ残す。人によって見たい・見たくないが違うだけの話なので、
   サーバーに持たせて他の端末や他の人に影響させる必要はない */
const SHARED_HIDE_KEY='ops_hide_shared_v1';
function sharedCalHidden(){
  try{return localStorage.getItem(SHARED_HIDE_KEY)==='1';}catch(e){return false;}
}
function toggleSharedCal(){
  const next=!sharedCalHidden();
  try{localStorage.setItem(SHARED_HIDE_KEY,next?'1':'0');}catch(e){}
  render();
  toast(next?'全社カレンダーの予定を隠しました':'全社カレンダーの予定を表示しました');
}
function sharedCalOn(){return ME&&ME.role!=='intern';}
function sharedKey(y,m){return y+'-'+m;}
/* 表示中の月の予定を確保する。未取得ならサーバーに聞きに行き、
   返ってきたら画面を描き直す（render中に呼ばれるので同期では待たない） */
function ensureSharedCal(y,m){
  if(!sharedCalOn())return [];
  const key=sharedKey(y,m);
  if(SHARED_CAL.events[key])return SHARED_CAL.events[key];
  if(SHARED_CAL.loading[key])return [];
  SHARED_CAL.loading[key]=true;
  const timeMin=new Date(y,m,1).toISOString();
  const timeMax=new Date(y,m+1,1).toISOString();
  api(`/api/shared-calendar/events?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}`)
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      SHARED_CAL.loading[key]=false;
      if(!d)return;
      SHARED_CAL.events[key]=d.events||[];
      SHARED_CAL.configured=!!d.configured;
      if(d.name)SHARED_CAL.name=d.name;
      if(d.calendarId)SHARED_CAL.calendarId=d.calendarId;
      // 取れた予定が画面に出るように描き直す
      if(SHARED_CAL.events[key].length)render();
    })
    .catch(()=>{SHARED_CAL.loading[key]=false;});
  return [];
}
// 全体予定表の予定を、支部イベントと同じ形に整えてカレンダーに並べる
function sharedItemsFor(y,m){
  /* 隠しているときも取得だけは続ける。そうしておかないと、隠している間に
     設定が分からなくなって、表示に戻すボタンまで出せなくなる */
  const list=ensureSharedCal(y,m);
  if(sharedCalHidden())return [];
  return list.map(e=>({
    id:e.id,title:e.title,start:e.start,allDay:e.allDay,location:e.location,shared:true,
  }));
}
/* ---------- 自分のGoogleカレンダーの予定 ----------
   全体予定表と同じ作りで、月ごとに取ってきて重ねるだけ。DBには保存しない。
   サーバーは「呼んだ本人のカレンダー」しか返さないので、
   ここに並ぶ予定が他の人の画面に出ることはない */
let MY_CAL={events:{},loading:{},connected:null};
const MYCAL_HIDE_KEY='ops_hide_mycal_v1';
function myCalHidden(){
  try{return localStorage.getItem(MYCAL_HIDE_KEY)==='1';}catch(e){return false;}
}
function toggleMyCal(){
  const next=!myCalHidden();
  try{localStorage.setItem(MYCAL_HIDE_KEY,next?'1':'0');}catch(e){}
  render();
  toast(next?'自分のGoogleカレンダーの予定を隠しました':'自分のGoogleカレンダーの予定を表示しました');
}
function ensureMyCal(y,m){
  const key=sharedKey(y,m);
  if(MY_CAL.events[key])return MY_CAL.events[key];
  if(MY_CAL.loading[key])return [];
  MY_CAL.loading[key]=true;
  const timeMin=new Date(y,m,1).toISOString();
  const timeMax=new Date(y,m+1,1).toISOString();
  api(`/api/my-calendar/events?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}`)
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      MY_CAL.loading[key]=false;
      if(!d)return;
      MY_CAL.events[key]=d.events||[];
      MY_CAL.connected=!!d.connected;
      if(MY_CAL.events[key].length)render();
    })
    .catch(()=>{MY_CAL.loading[key]=false;});
  return [];
}
/* 自分のGoogleカレンダーの予定を、支部イベントと同じ形に整えて並べる。
   自分にしか見えないものなので、印を付けて見分けられるようにする */
function myCalItemsFor(y,m){
  const list=ensureMyCal(y,m);
  if(myCalHidden())return [];
  return list.map(e=>({
    id:'my_'+e.id,title:e.title,start:e.start,allDay:e.allDay,location:e.location,
    shared:true,mine:true,
  }));
}
function reloadMyCal(){MY_CAL.events={};MY_CAL.loading={};render();}

/* 終日の予定は "2026-07-15" のような日付だけの文字列で届く。
   そのまま new Date() に渡すとUTCの0時と解釈され、時差の分だけ日がずれることがある。
   日付だけのときは地域時間の日付として組み立てて、ずれないようにする */
function sharedDate(e){
  if(e.allDay&&/^\d{4}-\d{2}-\d{2}$/.test(e.start)){
    const[y,m,d]=e.start.split('-').map(Number);return new Date(y,m-1,d);
  }
  return new Date(e.start);
}
function sharedLabel(e){return e.allDay?e.title:`${hm(e.start)} ${e.title}`;}
/* 全体予定表を読み込み直す。Googleカレンダー側を直したあと、
   5分のキャッシュを待たずに反映させたいときに使う */
function reloadSharedCal(){SHARED_CAL.events={};SHARED_CAL.loading={};render();}
/* 全社カレンダーをGoogleカレンダー側で開く。
   embed の形にすると、そのカレンダー1つだけに絞った画面が出る。
   自分の予定と混ざらないので、全社の予定だけを追いたいときに見やすい */

  const id=SHARED_CAL.calendarId;

function myInterviewsForCal(){

function ivLabel(iv){return `面談：${ivInternName(iv)}さん`;}
/* 日付を押したときに重ねて出す、その日の予定の一覧。
   カレンダーの表示位置を動かさずに中身だけ確かめられるようにしている。
   予定を押せば、これまでどおりそれぞれの詳細へ進める */
function openDaySheet(key){
  const [Y,M,D]=key.split('-').map(Number);
  const d=new Date(Y,M-1,D);
  const hol=holidayName(Y,M-1,D);
  let list=DB.events.filter(e=>ymd(new Date(e.start_datetime))===key);
  if(ME.role!=='admin')list=list.filter(e=>e.branch_id===ME.branch_id||e.creator_id===ME.id);
  const ivs=myInterviewsForCal().filter(iv=>ymd(new Date(iv.confirmed_datetime))===key);
  const shared=[...sharedItemsFor(Y,M-1),...myCalItemsFor(Y,M-1)]
    .filter(e=>ymd(sharedDate(e))===key);

  /* ここは中身を確かめるための場所なので、押しても何も起きない見るだけの一覧にする。
     出欠の回答や編集は、これまでどおりカレンダーの下の一覧から行う */
  const row=(color,title,sub)=>`<div class="dayrow">
      <span class="dbar" style="background:${color}"></span>
      <span class="dtx"><b>${esc(title)}</b><small>${esc(sub)}</small></span>
    </div>`;
  const items=[
    ...shared.map(e=>({t:sharedDate(e),html:row(e.mine?MY_CAL_COLOR:SHARED_CAL_COLOR,e.title,
      `${e.allDay?'終日':hm(e.start)}${e.location?' ・ '+e.location:''} ・ ${e.mine?'あなたのGoogleカレンダー（自分だけに表示）':'全社カレンダー'}`)})),
    ...ivs.map(iv=>({t:new Date(iv.confirmed_datetime),html:row('var(--iv)',ivLabel(iv),
      `${hm(iv.confirmed_datetime)} ・ 確定した面談`)})),
    ...list.map(e=>({t:new Date(e.start_datetime),html:row(e.color||EVENT_COLORS[0].v,e.title,
      `${hm(e.start_datetime)}${e.location?' ・ '+e.location:''}`)})),
  ].sort((a,b)=>a.t-b.t);

  const body=items.length?`<div class="daylist">${items.map(i=>i.html).join('')}</div>`
    :`<div class="empty" style="padding:22px"><div class="ei">${ic('calendar')}</div><p>この日の予定はありません。</p></div>`;
  openSheet(`<h3 style="margin:0">${M}月${D}日（${WD_JP[d.getDay()]}）${hol?`<span class="tag" style="margin-left:8px">${esc(hol)}</span>`:''}</h3>
    <p class="page-sub" style="margin:4px 0 12px">${items.length?`${items.length}件の予定`:'予定なし'}</p>
    ${body}
    <button class="btn pri block" style="margin-top:16px" onclick="closeSheet();openEventForm(null,'${key}')">＋ この日に予定を追加</button>`);
}
function eventsSection(){

function agendaView(list,ivs,shared,y,m){
  const items=[];
  (shared||[]).forEach(e=>{const dt=sharedDate(e);
    if(dt.getFullYear()===y&&dt.getMonth()===m)items.push({dt,type:'ev',title:e.title,
      sub:`${e.allDay?'終日':hm(e.start)}・${e.mine?'あなたのGoogleカレンダー':'全体予定表'}`,
      key:ymd(dt),color:e.mine?MY_CAL_COLOR:SHARED_CAL_COLOR});});
  list.forEach(e=>{const dt=new Date(e.start_datetime);
    if(dt.getFullYear()===y&&dt.getMonth()===m)items.push({dt,type:'ev',title:e.title,sub:`${hm(e.start_datetime)}・${e.location||'—'}`,key:ymd(dt),color:e.color||EVENT_COLORS[0].v});});

/* 出欠の回答は専用APIで送る。DB全体を保存し直す方式だと、
   案内の直後に全員が一斉に押したときに大半が保存できなくなるため */
async function vote(evId,resp){
  let ok=false;
  try{
    const res=await api(`/api/events/${encodeURIComponent(evId)}/response`,
      {method:'PUT',body:JSON.stringify({response:resp})});
    if(res.ok){
      const {response}=await res.json();
      // 手元の一覧も同じ形に合わせる（画面をすぐ描き替えるため）
      DB.event_responses=(DB.event_responses||[]).filter(x=>!(x.event_id===evId&&x.user_id===ME.id));
      if(response)DB.event_responses.push(response);
      sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
      setSaveError(null);
      ok=true;
    }else{
      const d=await res.json().catch(()=>({}));
      setSaveError(d.error||'回答を保存できませんでした。');
    }
  }catch(e){
    console.warn('出欠の保存に失敗しました',e);
    setSaveError('回答を保存できていません。通信状況をご確認ください。');
  }
  /* 押した予定の1枚だけを差し替える。render() で画面ごと作り直すと、
     カードの登場アニメが再生し直されて一瞬黒く沈む（面談の枠選びと同じ理由）。
     カードが画面に無いとき（別の画面から呼ばれたとき）だけ、従来どおり描き直す */
  const card=document.getElementById('evc_'+evId);
  const ev=(DB.events||[]).find(e=>e.id===evId);
  if(card&&ev){
    const box=document.createElement('div');
    box.innerHTML=eventCard(ev);
    card.replaceWith(box.firstElementChild);
  }else render();
  if(ok)toast('回答を記録しました');
}

async function saveVisibilityCleanup(){
  const boxes=[...document.querySelectorAll('#visList input[type=checkbox]')];
  const priv=new Set(boxes.filter(c=>c.checked).map(c=>c.dataset.id));
  const all=new Set(boxes.map(c=>c.dataset.id));
  const ok=await mutate(db=>{
    db.events.forEach(e=>{
      if(!all.has(e.id))return;
      // チェックの有無にかかわらず確定させる。そうしないと毎回この案内が出続ける
      e.visibility=priv.has(e.id)?'private':'branch';
    });
  });
  if(!ok)return;
  closeSheet();render();
  toast(priv.size?`${priv.size}件を「自分だけ」にしました`:'公開範囲を確定しました');

/* 30分刻みの時刻の一覧。いまの値が刻みに合わないとき
   （前の作りで作った予定など）は、その値も選べるように混ぜてから並べ直す */
function timeOpts(sel){
  const list=[];
  for(let h=0;h<24;h++)for(const m of [0,30])list.push(`${pad(h)}:${pad(m)}`);
  if(sel&&!list.includes(sel))list.push(sel);
  list.sort();
  return list.map(t=>`<option value="${t}" ${t===sel?'selected':''}>${t}</option>`).join('');
}
/* 開始を動かしたとき、終了がそれより前になっていたら1時間後へ送る。
   「終了が開始より前」という指定にならないようにするため */
function syncEvEnd(){
  const a=document.getElementById('evT1'),b=document.getElementById('evT2');
  if(!a||!b||b.value>a.value)return;
  const [h,m]=a.value.split(':').map(Number);
  const next=`${pad((h+1)%24)}:${pad(m)}`;
  b.value=[...b.options].some(o=>o.value===next)?next:a.value;
}
function pickEvColor(v){
  document.getElementById('evColor').value=v;
  document.querySelectorAll('#evColorPick .cdot').forEach(el=>el.classList.toggle('on',el.dataset.c===v));
}

async function saveEvent(id){
  const title=document.getElementById('evTitle').value.trim();
  const date=document.getElementById('evDate').value;
  const t1=document.getElementById('evT1').value,t2=document.getElementById('evT2').value;
  let valid=true;
  const te=document.getElementById('evTitleE'),se=document.getElementById('evStartE');
  const tme=document.getElementById('evTimeE');
  te.classList.remove('show');se.classList.remove('show');tme.classList.remove('show');
  if(!title){te.textContent='イベント名は必須です';te.classList.add('show');valid=false;}
  if(!date){se.textContent='日付は必須です';se.classList.add('show');valid=false;}
  if(t2<=t1){tme.textContent='終わりの時刻は、始まりより後にしてください';tme.classList.add('show');valid=false;}
  if(!valid)return;
  const visibility=document.getElementById('evVis').value==='branch'?'branch':'private';
  /* 場所とMeet・Zoomのリンクは入力欄をなくしたが、前に入れた内容は消さずに持ち越す。
     編集のたびに黙って空になると、書いてあった集合場所などが失われてしまうため */
  const old=id?DB.events.find(e=>e.id===id):null;
  const data={title,description:document.getElementById('evDesc').value.trim(),
    start_datetime:new Date(`${date}T${t1}`).toISOString(),
    end_datetime:new Date(`${date}T${t2}`).toISOString(),
    location:old?.location||'',
    branch_id:document.getElementById('evBranch').value,
    visibility,
    color:document.getElementById('evColor').value||EVENT_COLORS[0].v,
    meet_url:old?.meet_url||'',
    zoom_url:old?.zoom_url||''};
  const newId=id?null:'ev_'+uid();
  const ok=await mutate(db=>{
    if(id){
      const ev=db.events.find(e=>e.id===id);
      if(ev)Object.assign(ev,data);
    }else{
      db.events.push({id:newId,creator_id:ME.id,...data});
      // 自分だけの予定を支部の全員に知らせても仕方がないので、共有するときだけ通知する
      if(visibility==='branch')pushNotification(db,'イベント作成',`「${title}」が作成されました`);
    }
  });
  if(!ok)return;
  updateBell();
  closeSheet();render();
  toast(id?'イベントを更新しました':'イベントを作成しました');
}
async function deleteEvent(id){
  if(!await confirmSheet('イベントを削除','このイベントと、これまでの出欠回答をすべて削除します。元に戻せません。','削除する'))return;
  // 出欠回答は専用テーブルにあるので、サーバー側がイベントの削除に合わせて片付ける
  const ok=await mutate(db=>{
    db.events=db.events.filter(e=>e.id!==id);
  });
  if(ok)DB.event_responses=(DB.event_responses||[]).filter(r=>r.event_id!==id);
  render();
  if(ok)toast('イベントを削除しました');
}

async function saveAvailability(){
  const weekly={};
  [0,1,2,3,4,5,6].forEach(d=>{
    weekly[d]={on:document.querySelector(`#wk${d} .sw`).classList.contains('on'),
      s:document.getElementById('wks'+d).value||'09:00',
      e:document.getElementById('wke'+d).value||'19:00'};
    if(weekly[d].e<=weekly[d].s)weekly[d].e=weekly[d].s;
  });
  // weekly だけを差し替える。blocks は触らない
  // （Googleカレンダー連携のwebhookがサーバー側で blocks を書き足すことがあるため）

function avSetWeek(delta){AVSET.weekOffset=Math.max(0,(AVSET.weekOffset||0)+delta);render();}

/* 自分の不可時間リストを db から取り出す（無ければ作る） */
function blocksOf(db,userId){
  db.availability=db.availability||{};
  db.availability[userId]=db.availability[userId]||{};
  db.availability[userId].blocks=db.availability[userId].blocks||[];
  return db.availability[userId];
}
function makeSlotBlock(iso){
  const st=new Date(iso),en=new Date(st.getTime()+30*60000);
  return {id:'blk_'+uid(),start:st.toISOString(),end:en.toISOString(),note:'面談不可',kind:'slot'};
}
/* 追加・削除をまとめて反映する。ドラッグで一気に操作した分も1回の保存で済ませる。
   blocks 全体を置き換えるのではなく増減だけを適用することで、
   保存し直しになったときにGoogleカレンダー由来の予定を消してしまわないようにしている */
async function applyBlockChanges({added=[],removedIds=[]}={}){
  return mutate(db=>{
    const av=blocksOf(db,ME.id);
    let list=av.blocks;
    if(removedIds.length)list=list.filter(b=>!removedIds.includes(b.id));
    for(const b of added){if(!list.some(x=>x.id===b.id))list.push(b);}
    av.blocks=list;
  });
}

/* 枠タップ／ドラッグでまとめて不可・解除する（マウス・タッチ共通）。
   ドラッグ中はセルの見た目だけを先に変えて操作内容をためておき、
   指を離した時点で1回だけ保存する（1マスごとに保存すると通信が大量に発生するため） */
let AVDRAG=null;
function avPointerDown(e,iso){
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();
  const cell=e.currentTarget;
  const mode=cell.classList.contains('block')?'unblock':'block';
  AVDRAG={mode,touched:new Set(),added:[],removedIds:[],col:dragColOf(cell)};
  document.body.classList.add('noselect');
  avDragApply(cell,iso);
  document.addEventListener('pointermove',avDragMove);
  document.addEventListener('pointerup',avDragEnd);
  document.addEventListener('pointercancel',avDragEnd);
}
/* 申請画面と同じく、なぞれるのは押し始めた日の列（縦）だけ */
function avDragMove(e){
  if(!AVDRAG)return;
  const el=dragCellAt(e,AVDRAG.col);
  if(el)avDragApply(el,el.dataset.iso);
}
function avDragApply(cell,iso){
  if(!AVDRAG||AVDRAG.touched.has(iso))return;
  if(AVDRAG.mode==='block'){
    if(!cell.classList.contains('ok'))return;
    const b=makeSlotBlock(iso);
    AVDRAG.added.push(b);
    cell.classList.remove('ok');cell.classList.add('block');
    cell.dataset.blockId=b.id;cell.textContent='×';
  }else{
    if(!cell.classList.contains('block'))return;
    const bid=cell.dataset.blockId;
    if(bid)AVDRAG.removedIds.push(bid);
    cell.classList.remove('block');cell.classList.add('ok');
    delete cell.dataset.blockId;cell.textContent='○';
  }
  AVDRAG.touched.add(iso);
}
async function avDragEnd(){
  document.removeEventListener('pointermove',avDragMove);
  document.removeEventListener('pointerup',avDragEnd);
  document.removeEventListener('pointercancel',avDragEnd);
  document.body.classList.remove('noselect');
  if(!AVDRAG)return;
  const {touched,added,removedIds}=AVDRAG;
  AVDRAG=null;
  if(!touched.size){render();return;}
  const ok=await applyBlockChanges({added,removedIds});
  render();
  if(ok)toast(touched.size>1?`${touched.size}件を更新しました`:'更新しました');
}

/* 「日時でまとめて追加」フォーム＋スクロール式 時間ピッカー */
function initBlkForm(){BLKFORM={date:ymd(new Date()),start:'12:00',end:'13:00',note:''};}
// 00:00〜23:30 を30分刻みで返す
function timeOptions(which){
  let h='';
  for(let t=0;t<24*60;t+=30){const v=`${pad(Math.floor(t/60))}:${pad(t%60)}`;
    h+=`<button class="${BLKFORM[which]===v?'on':''}" onclick="tpSet('${which}','${v}')">${v}</button>`;}
  return h;
}
function tpToggle(which){
  const bar=document.getElementById('tpbar_'+which);
  const other=which==='start'?'end':'start';
  document.getElementById('tpbar_'+other)?.classList.add('hidden');
  document.getElementById('tpick_'+other)?.classList.remove('open');
  const willOpen=bar.classList.contains('hidden');
  bar.classList.toggle('hidden');
  document.getElementById('tpick_'+which).classList.toggle('open',willOpen);
  if(willOpen){const on=bar.querySelector('button.on');if(on)on.scrollIntoView({block:'center'});}
}
function tpSet(which,v){
  BLKFORM[which]=v;
  // 開始を変えて終了以上になったら終了を+30分に自動調整
  if(which==='start'&&BLKFORM.end<=v){
    let [hh,mm]=v.split(':').map(Number);let t=hh*60+mm+30;if(t>=24*60)t=24*60-30;
    BLKFORM.end=`${pad(Math.floor(t/60))}:${pad(t%60)}`;
    const ev=document.getElementById('tpv_end');if(ev)ev.textContent=BLKFORM.end;
    const eb=document.getElementById('tpbar_end');if(eb)eb.innerHTML=timeOptions('end');
  }
  document.getElementById('tpv_'+which).textContent=v;
  const bar=document.getElementById('tpbar_'+which);bar.innerHTML=timeOptions(which);bar.classList.add('hidden');
  document.getElementById('tpick_'+which).classList.remove('open');
}
async function addBlock(){
  const {date,start:s,end:e}=BLKFORM;const note=(BLKFORM.note||'').trim();
  const err=document.getElementById('blkErr');err.classList.remove('show');
  if(!date||!s||!e){err.textContent='日付・開始・終了を入力してください';err.classList.add('show');return;}
  const start=new Date(`${date}T${s}`),end=new Date(`${date}T${e}`);
  if(end<=start){err.textContent='終了は開始より後にしてください';err.classList.add('show');return;}
  if(end<new Date()){err.textContent='過去の時間は登録できません';err.classList.add('show');return;}
  const ok=await applyBlockChanges({
    added:[{id:'blk_'+uid(),start:start.toISOString(),end:end.toISOString(),note}],
  });
  if(!ok)return;
  toast('不可時間を登録しました');
  initBlkForm();render();
}
async function delBlock(id){
  const ok=await applyBlockChanges({removedIds:[id]});
  render();
  if(ok)toast('削除しました');
}

    });

  }

/* 標準の支部をまとめて登録する。
   ・古い名前（茨城支部など）は、作り直さずに名前だけ直す
     ＝支部IDが変わらないので、紐づいた予定・面談・依頼が切れない
   ・すでにある名前は足さない（何度押しても増えない）
   ・こちらに無い支部は消さない（手で足した支部を勝手に消さないため） */
async function bulkAddBranches(){
  const renames=DB.branches.filter(b=>LEGACY_BRANCH_RENAMES[b.name])
    .map(b=>({id:b.id,from:b.name,to:LEGACY_BRANCH_RENAMES[b.name]}));
  // 名前を直したあとの状態で、足りないものを数える
  const after=DB.branches.map(b=>LEGACY_BRANCH_RENAMES[b.name]||b.name);
  const adds=STANDARD_BRANCHES.filter(n=>!after.includes(n));

  if(!renames.length&&!adds.length){
    await alertSheet('登録済みです','標準の支部はすべて登録されています。');
    return;
  }
  const lines=[];
  if(renames.length)lines.push('名前を直す：\n'+renames.map(r=>`　${r.from} → ${r.to}`).join('\n'));
  if(adds.length)lines.push(`新しく追加する：${adds.length}件\n　${adds.join('、')}`);
  if(!await confirmSheet('標準の支部をまとめて登録',lines.join('\n\n'),'実行する',false))return;

  const ok=await mutate(db=>{
    db.branches=db.branches||[];
    renames.forEach(r=>{const b=db.branches.find(x=>x.id===r.id);if(b)b.name=r.to;});
    const have=db.branches.map(b=>b.name);
    STANDARD_BRANCHES.forEach(n=>{
      if(!have.includes(n)){db.branches.push({id:'b_'+uid(),name:n});have.push(n);}
    });
  });
  if(!ok)return;
  LOGIN_BRANCHES=DB.branches;   // ログイン画面・初回設定の選択肢にも反映する
  go('branches');
  toast(`支部をそろえました（名前の変更${renames.length}件・追加${adds.length}件）`);
}
function openBranchForm(id){
  const b=id?DB.branches.find(x=>x.id===id):null;
  openSheet(`<h3>${b?'支部を編集':'支部を追加'}</h3>
    <label class="fl">支部名<span class="req">*</span></label>
    <input id="brName" value="${esc(b?.name||'')}" placeholder="例：千葉支部">
    <div class="field-err" id="brNameE"></div>
    <div class="btn-row" style="margin-top:16px">
      ${b?`<button class="btn bad" onclick="deleteBranch('${b.id}')">削除</button>`:''}
      <button class="btn pri" style="flex:1" onclick="saveBranch(${b?`'${b.id}'`:'null'})">${b?'更新する':'追加する'}</button>
    </div>`);
}
async function saveBranch(id){
  const name=document.getElementById('brName').value.trim();const e=document.getElementById('brNameE');
  e.classList.remove('show');
  if(!name){e.textContent='支部名は必須です';e.classList.add('show');return;}
  const ok=await mutate(db=>{
    if(id){const b=db.branches.find(x=>x.id===id);if(b)b.name=name;}
    else db.branches.push({id:'b_'+uid(),name});
  });
  if(!ok)return;
  closeSheet();toast('保存しました');go('branches');
}
async function deleteBranch(id){
  const uc=DB.users.filter(u=>u.branch_id===id).length;
  if(uc>0){
    await alertSheet('削除できません',
      `この支部には ${uc}人 が所属しています。先に所属ユーザーの支部を変更してください。`);
    return;
  }
  const b=DB.branches.find(x=>x.id===id);
  if(!await confirmSheet('支部を削除',`「${b?b.name:'この支部'}」を削除します。元に戻せません。`,'削除する'))return;
  const ok=await mutate(db=>{db.branches=db.branches.filter(x=>x.id!==id);});
  if(!ok)return;
  toast('削除しました');go('branches');
}

/* =========================================================
   通知ログ（アプリ内通知の簡易実装）
   ========================================================= */
/* 通知を1件積む。通知はサーバー側の専用テーブルに入るので、ここでは控えておき、
   mutate() の保存が成功したあとにまとめて送る。
   mutate() の中身は競合したときにやり直されることがあるため、
   その場で送ると同じ通知が二重に記録されてしまう。
   支部はサーバー側で本人の所属に固定される */
let NOTI_QUEUE=[];
function pushNotification(db,type,msg){
  NOTI_QUEUE.push({type,msg});
}
/* 控えておいた通知をまとめて送る。
   通知が届かなくても本筋の保存は成功しているので、
   失敗しても画面にはエラーを出さず、記録だけ残して先へ進む */
async function flushNotifications(){
  if(!NOTI_QUEUE.length)return;
  const items=NOTI_QUEUE.splice(0,NOTI_QUEUE.length);
  try{
    const res=await api('/api/notifications',{method:'POST',body:JSON.stringify({items})});
    if(!res.ok)return;
    // サーバーが実際に積んだ内容をそのまま手元にも足す
    const {added}=await res.json();
    DB.notifications=[...(DB.notifications||[]),...(added||[])];
  }catch(e){console.warn('通知を記録できませんでした',e);}
}
const NOTI_READ_KEY='ops_notiread_v1';
function getNotiRead(){try{return JSON.parse(localStorage.getItem(NOTI_READ_KEY))||{};}catch(e){return {};}}
function lastRead(){return getNotiRead()[ME?.id]||'1970-01-01T00:00:00.000Z';}
function unreadCount(){return (DB.notifications||[]).filter(n=>n.at>lastRead()).length;}
/* 色はCSS変数で持つ。テーマを切り替えても勝手に追従する */
const NOTI_IC={
  '面談申請':{e:'edit',bg:'var(--warn-soft)',fg:'var(--warn-ink)'},
  '面談確定':{e:'check',bg:'var(--ok-soft)',fg:'var(--ok-ink)'},
  '面談不成立':{e:'alert',bg:'var(--bad-soft)',fg:'var(--bad)'},
  'イベント作成':{e:'calendar',bg:'var(--iv-soft)',fg:'var(--iv-ink)'},
  'イベント更新':{e:'refresh',bg:'var(--info-soft)',fg:'var(--info-ink)'},
  '依頼':{e:'megaphone',bg:'var(--brand-soft)',fg:'var(--brand-d)'}};
function updateBell(){
  const b=document.getElementById('bellBadge');if(!b||!ME)return;
  const n=unreadCount();
  if(n>0){b.textContent=n>9?'9+':n;b.classList.remove('hidden');}
  else b.classList.add('hidden');
}
function openNotifications(){
  const list=(DB.notifications||[]).slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
  const lr=lastRead();
  // 変数名を ic にすると同名のアイコン関数を隠してしまうので nic にしている
  const rows=list.length?list.map(n=>{const nic=NOTI_IC[n.type]||{e:'bell',bg:'var(--chip)',fg:'var(--chip-ink)'};
    return `<div class="noti ${n.at>lr?'unread':''}">
      <span class="nic" style="background:${nic.bg};color:${nic.fg}">${ic(nic.e)}</span>
      <span><span class="nt">${esc(n.msg)}</span><br><span class="ns">${esc(n.type)} ・ ${fmtRel(n.at)}</span></span>
    </div>`;}).join(''):`<div class="empty" style="padding:26px"><div class="ei">${ic('bell')}</div><p>通知はまだありません。</p></div>`;
  openSheet(`<h3>通知</h3>
    <p class="page-sub">面談・イベントに関するアプリ内通知です。</p>
    <div class="card"><div class="cb" style="padding:4px 12px">${rows}</div></div>`);
  // 開いたら既読に
  const map=getNotiRead();map[ME.id]=nowISO();localStorage.setItem(NOTI_READ_KEY,JSON.stringify(map));
  updateBell();
}

/* アイコンの背景に使える色。文字が読めるよう、どれも淡い色にしている */
const AVATAR_COLORS=[
  {v:'brand', c:'var(--brand-soft)', n:'既定'},
  {v:'blue',  c:'#dbeafe', n:'ブルー'},
  {v:'green', c:'#d7f5e3', n:'グリーン'},
  {v:'purple',c:'#e9e0fd', n:'パープル'},

  {v:'gray',  c:'#e3e8ee', n:'グレー'},
];
function avatarColor(userId){
  const v=getProfile(userId).avatar_color;

}
function avatarBg(userId){return avatarColor(userId).c;}

   選べない）、本人が動かすと担当と食い違ってしまうため。
   サーバー側でも同じ判定をしている（/api/auth/complete-profile） */

function profileHead(){

/* 色は押した瞬間に見た目へ反映する（保存は「保存する」を押したとき） */
let PROF_COLOR=null;
function pickAvatarColor(v){
  PROF_COLOR=v;
  document.querySelectorAll('.swatch').forEach(el=>el.classList.remove('on'));
  const c=AVATAR_COLORS.find(x=>x.v===v)||AVATAR_COLORS[0];
  const btn=[...document.querySelectorAll('.swatch')].find(el=>el.style.background===c.c||el.title===c.n);
  if(btn)btn.classList.add('on');
  const av=document.getElementById('profAv');
  if(av)av.style.background=c.c;
}

async function saveMyProfile(){
  const nickname=document.getElementById('profNick').value.trim();
  const sel=document.getElementById('profBranch');
  // インターン生は支部の欄が出ないので、今の支部をそのまま送る
  const branch_id=sel?sel.value:ME.branch_id;
  const err=document.getElementById('profErr');
  err.classList.remove('show');
  if(!nickname){err.textContent='名前を入力してください';err.classList.add('show');return;}
  if(!branch_id){err.textContent='所属支部を選択してください';err.classList.add('show');return;}

  // 部署は画面が閉じる前に控えておく（サーバーの応答を待つ間に消えるため）
  const deptEls=document.querySelectorAll('input[name=profDept]');
  const departments=deptEls.length?[...deptEls].filter(c=>c.checked).map(c=>c.value):null;

  try{
    const res=await api('/api/auth/complete-profile',{method:'POST',body:JSON.stringify({nickname,branch_id})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){err.textContent=data.error||'保存に失敗しました';err.classList.add('show');return;}
    if(data.user)ME=data.user;
  }catch(e){err.textContent='通信に失敗しました。時間をおいて再度お試しください。';err.classList.add('show');return;}

  // 部署とアイコンの色はDB側に持っているので、まとめて1回で保存する
  const colorChanged=PROF_COLOR&&PROF_COLOR!==avatarColor(ME.id).v;
  const deptChanged=departments&&departments.join()!==getDepts(ME.id).join();
  if(colorChanged||deptChanged){
    await mutate(db=>{
      const p=profileOf(db,ME.id);
      if(colorChanged)p.avatar_color=PROF_COLOR;
      if(deptChanged)p.departments=departments;
    });
  }
  PROF_COLOR=null;
  renderChip();render();
  openMyProfile();          // 保存したら、見るだけの画面に戻る
  toast('プロフィールを保存しました');
}

/* =========================================================
   所属部署
   ---------------------------------------------------------
   ユーザー表はサーバー側の正規テーブルなので、支部やニックネームと違い
   自由に列を足せない。所属部署は「あとから足した付加情報」なので、
   DB.profiles（ユーザーID→情報）に持たせている。
   DB.availability が同じ形なので、作りを揃えた。
   ========================================================= */
const DEPARTMENTS=['事務局','プログラム','人財開発','クライアント','コンシューマー',
  'コンテスト','デジマ','プロモーション','アライアンス'];

function getProfile(userId){return (DB.profiles&&DB.profiles[userId])||{};}
function getDepts(userId){const d=getProfile(userId).departments;return Array.isArray(d)?d:[];}
/* ホームのタイルに出す短い説明 */
function deptLabel(userId){
  const d=getDepts(userId);
  if(!d.length)return 'まだ設定していません';
  return d.length<=2?d.join('・'):`${d[0]}ほか${d.length-1}件`;
}
/* 変更対象を db から引き直せるようにしておく（mutateのやり直しに備える） */
function profileOf(db,userId){
  db.profiles=db.profiles||{};
  db.profiles[userId]=db.profiles[userId]||{};
  return db.profiles[userId];
}

/* =========================================================
   依頼（支部内への連絡）
   ---------------------------------------------------------
   出せるのはスタッフ・支部管理者のみ。インターン生は受け取り専用。

   宛先は「デジマ宛」のような条件のまま保存せず、送信した時点の
   ユーザーID一覧に展開して固定する。条件のまま持つと、あとで誰かの
   部署が変わったときに、過去の依頼の宛先まで
   変わってしまい「誰に頼んだか」の記録が崩れるため。
   元の指定は target_label に文字列で残し、画面に併記する。
   ========================================================= */
function canSendRequest(u){u=u||ME;return !!u&&(u.role==='staff'||u.role==='branch_admin');}
function allRequests(){return DB.requests||[];}
/* 自分が受け取った依頼（新しい順） */
function myRequests(){
  return allRequests().filter(r=>(r.recipient_ids||[]).includes(ME.id))
    .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
}
/* 自分が送った依頼（新しい順） */
function sentRequests(){
  return allRequests().filter(r=>r.sender_id===ME.id)
    .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
}
function hasConfirmed(r,userId){return (r.read_by||[]).some(x=>x.user_id===userId);}

let REQTAB='inbox'; // 'inbox' | 'sent'
function setReqTab(t){REQTAB=t;render();}

function viewRequests(){
  const canSend=canSendRequest();
  const inbox=myRequests();
  const unread=inbox.filter(r=>!hasConfirmed(r,ME.id)).length;

  // インターン生は受け取り専用なので、切り替えも新規作成も出さない
  if(!canSend){
