<!DOCTYPE html>

<!-- テーマは端末設定ではなくアプリ側の設定に従う。既定はダーク。
     CSSより先に data-theme を確定させないと、一瞬だけ違う配色が見えてしまう -->
<script>
(function(){
  var el=document.documentElement;
  try{
    var t=localStorage.getItem('ops_theme_v1');
    el.setAttribute('data-theme',t==='light'?'light':'dark');
  }catch(e){el.setAttribute('data-theme','dark');}
  /* 左メニューの開閉。保存された指定が無ければ、スマホは細い帯・PCは広げた状態にする。
     ここで確定させないと、一瞬だけ違う幅で描かれて中身が横にずれる */
  try{
    var s=localStorage.getItem('ops_sidebar_v1');
    if(s!=='expanded'&&s!=='collapsed')s=window.innerWidth<=760?'collapsed':'expanded';
    el.setAttribute('data-sb',s);
  }catch(e){el.setAttribute('data-sb','expanded');}
})();
</script>

/* 大きさは指定しない。CSS側で 1em にしてあるので、置いた場所の文字サイズに合わせて伸び縮みする */
function ic(name,cls){
  return `<svg class="ic${cls?' '+cls:''}" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]||ICON.dot}</svg>`;
}
/* JSで組み立てないHTML（ベル・保存失敗の帯・外部リンク）にもアイコンを入れる。
   data-ic は先頭に、data-ic-end は末尾に差し込む */
function fillStaticIcons(root){
  (root||document).querySelectorAll('[data-ic]').forEach(el=>{
    el.insertAdjacentHTML('afterbegin',ic(el.getAttribute('data-ic')));
    el.removeAttribute('data-ic');
  });
  (root||document).querySelectorAll('[data-ic-end]').forEach(el=>{
    el.insertAdjacentHTML('beforeend',ic(el.getAttribute('data-ic-end')));
    el.removeAttribute('data-ic-end');
  });
}
document.addEventListener('DOMContentLoaded',()=>fillStaticIcons());

/* ---------- storage ---------- */
// DBキャッシュは sessionStorage（タブごとに独立）に置く。
// localStorageに置くと、タブAが管理者・タブBがインターン生のときにキャッシュが混ざる
const DB_KEY='ops_nittyou_v1';
const nowISO=()=>new Date().toISOString();
const uid=()=>Math.random().toString(36).slice(2,9);

/* =========================================================
   セッショントークン
   - 保管場所は sessionStorage。タブごとに独立しているため、
     タブを複製して別アカウントでログインしても元のタブは影響を受けない。
     新しいタブ（＝ショートカットから開いた場合）は空なのでログイン画面になる。
   - 「次回から自動ログイン」にチェックが入ったときだけ localStorage にも複製し、
     次に開いたタブが起動時にコピーして使う。
   ========================================================= */
const TOKEN_KEY='ops_token_v1';
const getToken=()=>sessionStorage.getItem(TOKEN_KEY);
function setToken(t,remember){
  sessionStorage.setItem(TOKEN_KEY,t);
  if(remember)localStorage.setItem(TOKEN_KEY,t);
  else localStorage.removeItem(TOKEN_KEY);
}
function clearToken(){
  sessionStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(DB_KEY);
}
/* セッションが切れた（サーバーがcode:'unauthenticated'を返した）ときの後始末。
   ログイン中だった場合だけ読み込み直して、ログイン画面から入り直してもらう */
function handleUnauthorized(){
  clearToken();
  if(ME){ME=null;location.reload();}
}

/* すべてのAPI呼び出しの入口。Authorizationヘッダの付与と、
   セッション切れの検出をここ1か所にまとめている */
async function api(path,opts={}){
  const headers={...(opts.headers||{})};
  const token=getToken();
  if(token)headers['Authorization']='Bearer '+token;
  if(opts.body&&!headers['Content-Type'])headers['Content-Type']='application/json';
  const res=await fetch(path,{...opts,headers});
  if(res.status===401&&token){
    // パスワード違いなど、業務上の401と区別するためサーバーの code を見る
    try{
      const d=await res.clone().json();
      if(d&&d.code==='unauthenticated')handleUnauthorized();
    }catch(e){/* JSONでなければセッション切れとは扱わない */}
  }
  return res;
}

let DB=null;

async function apiGetDB(){
  const res=await api('/api/db');
  if(!res.ok)throw new Error('GET /api/db failed');

}
async function apiPutDB(obj){

}

// 起動時にサーバーからDBを取得。branches等の初期マスタが未投入ならseed()して作成。サーバーに繋がらなければlocalStorageから復元
async function bootLoad(){
  try{
    const remote=await apiGetDB();
    if(remote&&remote.branches){sessionStorage.setItem(DB_KEY,JSON.stringify(remote));return remote;}
    const s=seed();
    const {updatedAt}=await apiPutDB(s);
    s.updatedAt=updatedAt;
    s.users=(remote&&remote.users)||[];
    sessionStorage.setItem(DB_KEY,JSON.stringify(s));
    return s;
  }catch(e){
    console.warn('サーバーに接続できません。キャッシュを使用します。',e);
    try{const raw=sessionStorage.getItem(DB_KEY);if(raw)return JSON.parse(raw);}catch(e2){}
    return seed();
  }

/* DBを変更して保存する。
   fn は DB を受け取って書き換える関数。「何をしたか」を関数として受け取ることで、
   他の人が先に保存していた場合（409）に最新のDBを取り込んでから同じ操作をやり直せる。
   以前のように DB 全体を無条件に上書きしていると、2人が同時に操作したときに
   後から保存した方が相手の変更を消してしまう。

   fn の中では、対象を必ず引数の db から引き直すこと（外側で find した参照を使わない）。
   やり直しのときに古いDBのオブジェクトを触ってしまい、変更が反映されないため。 */
async function putDB(){
  const {users,...body}=DB;
  return api('/api/db',{method:'PUT',body:JSON.stringify({...body,_baseUpdatedAt:DB.updatedAt})});
}
async function mutate(fn){
  fn(DB);
  sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
  let conflicted=false;
  for(let attempt=0;attempt<3;attempt++){
    try{
      const res=await putDB();
      if(res.ok){
        DB.updatedAt=(await res.json()).updatedAt;
        sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
        setSaveError(null);
        if(conflicted&&ME)render(); // 取り込んだ他の人の変更を画面に出す
        return true;
      }
      if(res.status!==409){
        const d=await res.json().catch(()=>({}));
        setSaveError(d.error||'変更を保存できませんでした。');
        return false;
      }
      conflicted=true;
      DB=await apiGetDB();      // 最新を取り込んで
      fn(DB);                   // 同じ操作をやり直す
      sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
    }catch(e){
      console.warn('保存に失敗しました',e);
      setSaveError('変更を保存できていません。通信状況をご確認ください。');
      return false;
    }
  }
  setSaveError('他の方の操作と重なって保存できませんでした。もう一度お試しください。');
  return false;
}

/* 保存できていないことを画面上部の帯で知らせる。
   以前は保存に失敗しても「保存しました」と表示されており、
   データが消えたことに気づけないままだった。msg=null で帯を消す */
function setSaveError(msg){
  const bar=document.getElementById('savebar');
  if(!bar)return;
  bar.classList.toggle('hidden',!msg);
  if(msg)bar.querySelector('.sb-msg').textContent=msg;
}
async function retrySave(){
  const btn=document.getElementById('savebarBtn');
  if(btn){btn.disabled=true;btn.textContent='保存中…';}
  let msg='';
  try{
    const res=await putDB();
    if(res.ok){
      DB.updatedAt=(await res.json()).updatedAt;
      sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
      setSaveError(null);msg='保存しました';
    }else if(res.status===409){
      // 何をやり直せばよいか分からないため、最新を取り込んで操作し直してもらう
      DB=await apiGetDB();
      sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
      setSaveError(null);render();
      msg='他の方が先に更新していたため、最新の内容に更新しました。お手数ですが操作をやり直してください。';
    }else{
      const d=await res.json().catch(()=>({}));
      msg=d.error||'保存できませんでした';
    }
  }catch(e){msg='通信に失敗しました。時間をおいて再度お試しください。';}
  if(btn){btn.disabled=false;btn.textContent='再試行';}
  toast(msg);
}

// 他端末・他ブラウザでの変更をゆるやかに反映する定期ポーリング（30秒間隔）
function startPolling(){
  setInterval(async()=>{
    if(SYNCING)return;
    SYNCING=true;
    try{
      const remote=await apiGetDB();
      if(remote&&remote.updatedAt&&remote.updatedAt!==DB.updatedAt){
        DB=remote;
        sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
        if(ME)render();
      }
    }catch(e){/* オフライン時は無視 */}
    finally{SYNCING=false;}
  },30000);
}

const isDarkMode=()=>document.documentElement.getAttribute('data-theme')!=='light';
function _hexRgb(v){const s=v.replace('#','');return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];}

}

const WD_JP=['日','月','火','水','木','金','土'];
const DEFAULT_WEEKLY={0:{on:false,s:'09:00',e:'19:00'},1:{on:true,s:'09:00',e:'19:00'},2:{on:true,s:'09:00',e:'19:00'},
  3:{on:true,s:'09:00',e:'19:00'},4:{on:true,s:'09:00',e:'19:00'},5:{on:true,s:'09:00',e:'19:00'},6:{on:false,s:'10:00',e:'16:00'}};

// スタッフの空きスロット（30分刻み）を今後N日分生成
// 除外条件：曜日別の可能時間帯外／登録済みの不可時間ブロック／確定済み面談
function genSlots(staffId,days=14){
  const weekly=getWeekly(staffId);
  const blocks=((DB.availability[staffId]||{}).blocks||[]).map(b=>[new Date(b.start).getTime(),new Date(b.end).getTime()]);
  const taken=DB.interviews.filter(i=>i.staff_id===staffId&&i.status==='fixed'&&i.confirmed_datetime)
    .map(i=>new Date(i.confirmed_datetime).getTime());
  const now=Date.now();const out=[];
  for(let off=0;off<days;off++){
    const day=new Date();day.setHours(0,0,0,0);day.setDate(day.getDate()+off);
    const conf=weekly[day.getDay()];
    if(!conf||!conf.on)continue;
    const [sh,sm]=conf.s.split(':').map(Number);
    const [eh,em]=conf.e.split(':').map(Number);
    const slots=[];
    for(let t=sh*60+sm; t+30<=eh*60+em; t+=30){
      const dt=new Date(day);dt.setHours(Math.floor(t/60),t%60,0,0);
      const st=dt.getTime(),en=st+30*60*1000;
      if(st<now)continue;
      const bad=blocks.some(([bs,be])=>st<be&&en>bs) || taken.some(x=>Math.abs(x-st)<30*60*1000-1);
      slots.push({iso:dt.toISOString(),time:`${pad(Math.floor(t/60))}:${pad(t%60)}`,ok:!bad});
    }
    if(slots.length)out.push({dateObj:day,slots});
  }
  return out;
}

// 不可時間エディタ用：週マトリクス表データ生成（月曜始まり7日 × 30分刻み）
// state: 'off'（受付時間外）/ 'free'（受付中）/ 'block'（不可・解除可）/ 'locked'（予定・面談あり＝操作不可）
function genEditGrid(staffId,weekOffset){
  const weekly=getWeekly(staffId);
  const blocks=((DB.availability[staffId]||{}).blocks||[]);
  const taken=DB.interviews.filter(i=>i.staff_id===staffId&&i.status==='fixed'&&i.confirmed_datetime)
    .map(i=>new Date(i.confirmed_datetime).getTime());
  const now=Date.now();
  const today=new Date();today.setHours(0,0,0,0);
  const dow=today.getDay();
  const diffToMon=(dow===0?-6:1-dow);
  const monday=new Date(today);monday.setDate(today.getDate()+diffToMon+weekOffset*7);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d);}
  let minM=Infinity,maxM=-Infinity;
  days.forEach(d=>{const conf=weekly[d.getDay()];if(conf&&conf.on){
    const [sh,sm]=conf.s.split(':').map(Number);const [eh,em]=conf.e.split(':').map(Number);
    minM=Math.min(minM,sh*60+sm);maxM=Math.max(maxM,eh*60+em);}});
  if(minM===Infinity){minM=9*60;maxM=19*60;}
  const times=[];for(let t=minM;t+30<=maxM;t+=30)times.push(t);
  const grid=days.map(day=>{
    const conf=weekly[day.getDay()];
    return times.map(t=>{
      const dt=new Date(day);dt.setHours(Math.floor(t/60),t%60,0,0);
      const st=dt.getTime(),en=st+30*60000;
      const iso=dt.toISOString();
      if(!conf||!conf.on)return{state:'off',iso};
      const [sh,sm]=conf.s.split(':').map(Number);const [eh,em]=conf.e.split(':').map(Number);
      if(t<sh*60+sm||t+30>eh*60+em)return{state:'off',iso};
      if(st<now)return{state:'off',iso};
      const takenHit=taken.some(x=>Math.abs(x-st)<30*60000-1);
      if(takenHit)return{state:'locked',iso,label:'面談'};
      const blk=blocks.find(b=>{const bs=new Date(b.start).getTime(),be=new Date(b.end).getTime();return st<be&&en>bs;});
      if(blk){
        return blk.kind==='slot'?{state:'block',iso,blockId:blk.id}:{state:'locked',iso,label:'予定'};
      }
      return{state:'free',iso};
    });
  });
  return{days,times,grid};
}

async function loadInviteStaff(){
  const id=new URLSearchParams(location.search).get('staff');

  try{
    const res=await api('/api/auth/invite?staff='+encodeURIComponent(id));

    if(r&&r.staff)INVITE_STAFF=r.staff;

async function doForgotPassword(){
  const email=document.getElementById('forgotEmail').value.trim();
  const err=document.getElementById('forgotErr');
  const btn=document.getElementById('forgotBtn');
  const done=document.getElementById('forgotDone');
  err.classList.remove('show');
  if(!email){err.textContent='メールアドレスを入力してください';err.classList.add('show');return;}
  btn.disabled=true;btn.textContent='送信中…';
  try{
    const res=await api('/api/auth/forgot-password',{method:'POST',body:JSON.stringify({email})});
    const data=await res.json();
    if(!res.ok){
      err.textContent=data.error||'送信に失敗しました';err.classList.add('show');
      btn.disabled=false;btn.textContent='再設定メールを送る';return;
    }
    // 連打で何通も送られないよう、送信後はボタンを戻さない
    done.querySelector('span:last-child').textContent=data.message;
    done.classList.remove('hidden');
    btn.textContent='送信しました';
  }catch(e){
    err.textContent='通信に失敗しました。時間をおいて再度お試しください。';err.classList.add('show');
    btn.disabled=false;btn.textContent='再設定メールを送る';
  }
}

async function doResetPassword(token){
  const np=document.getElementById('rsNew').value;
  const np2=document.getElementById('rsNew2').value;
  const err=document.getElementById('rsErr');
  err.classList.remove('show');
  const fail=m=>{err.textContent=m;err.classList.add('show');};
  if(np.length<8)return fail('パスワードは8文字以上で入力してください');
  if(np!==np2)return fail('パスワードが一致しません');
  try{
    const res=await api('/api/auth/reset-password',{method:'POST',body:JSON.stringify({token,new_password:np})});
    const data=await res.json();
    if(!res.ok)return fail(data.error||'再設定に失敗しました');
    switchLoginView('login');
    toast('パスワードを設定しました。新しいパスワードでログインしてください');
  }catch(e){fail('通信に失敗しました。時間をおいて再度お試しください。');}
}

async function doLoginAuth(){

  const password=document.getElementById('loginPassword').value;

  if(!email||!password){err.textContent='メールアドレスとパスワードを入力してください';err.classList.add('show');return;}

  try{

    const data=await res.json();

    setToken(data.token,remember);

}
async function doRegisterIntern(){

/* 署名付きトークンから、画面に出すためのメールアドレスと氏名を取り出す。
   ここでの読み取りは表示目的だけ。改ざんされていないかの確認は必ずサーバー側で行う */
function readVerifiedToken(token){
  try{
    const b64=String(token).split('.')[0];
    const json=decodeURIComponent(escape(atob(b64.replace(/-/g,'+').replace(/_/g,'/'))));
    const claims=JSON.parse(json);
    return claims.email?claims:null;
  }catch(e){return null;}
}

/* ログイン後の共通処理。起動時は /api/bootstrap で取得済みのDBをそのまま渡せるので、
   その分だけ通信の往復を減らせる */
async function enterAppWith(user,preloadedDB){
  ME=user;
  if(preloadedDB&&preloadedDB.branches){
    DB=preloadedDB;
    sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
  }else{
    DB=await bootLoad();   // 初回で支部などの初期データがまだ無い場合はここで投入される
  }
  // 支部の一覧は初回設定画面のプルダウンで使うため、DB取得後に反映しておく
  LOGIN_BRANCHES=DB.branches||LOGIN_BRANCHES;
  if(ME.needs_profile){renderProfileSetup();return;}
  enterApp();
}

/* =========================================================
   テーマ切替（ダーク⇄ライト）
   端末のOS設定ではなくアプリ側の設定に従う。同じキーを <head> の先頭でも
   読んでいて、CSSが当たる前に data-theme を確定させている
   ========================================================= */
const THEME_KEY='ops_theme_v1';
const currentTheme=()=>document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem(THEME_KEY,t);}catch(e){}
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',t==='light'?'#f7fafb':'#000000');
}
function toggleTheme(){
  setTheme(currentTheme()==='light'?'dark':'light');
  // テーマの入口はプロフィールの「ほかの設定」。開いていればその場で表示を更新する
  const v=document.getElementById('profThemeVal');
  if(v)v.textContent=currentTheme()==='light'?'ライト':'ダーク';
  // カレンダーの予定チップは明暗で色の計算式が変わるので、開いている画面を描き直す
  if(ME&&!document.getElementById('app').classList.contains('hidden'))render();
}

/* =========================================================
   左端の縦メニュー（サイドバー）
   広い画面では中身を左に押し出し、狭い画面ではアイコンだけの細い帯にする。
   広げた状態はスマホでは中身の上に重ねる（押し出すと本文が読めなくなるため）
   ========================================================= */
const SB_KEY='ops_sidebar_v1';
const sbState=()=>document.documentElement.getAttribute('data-sb')==='collapsed'?'collapsed':'expanded';
const isNarrow=()=>window.matchMedia('(max-width:760px)').matches;
function setSidebar(state){
  document.documentElement.setAttribute('data-sb',state);
  try{localStorage.setItem(SB_KEY,state);}catch(e){}
  const t=document.getElementById('sbToggle');
  if(t)t.setAttribute('aria-expanded',state==='expanded'?'true':'false');
  // 狭い画面で広げているときだけ、背面を触れないようにする
  document.getElementById('sbScrim').classList.toggle('open',state==='expanded'&&isNarrow());

}

/* =========================================================
   スクロール連動フェードアップ
   画面を描き直すたびに bindReveal() を呼び、まだ見ていない要素だけ監視する
   ========================================================= */
const REVEAL_IO=('IntersectionObserver' in window)?new IntersectionObserver(es=>{
  es.forEach(en=>{
    if(!en.isIntersecting)return;
    en.target.classList.add('in');
    REVEAL_IO.unobserve(en.target); // 一度出したら監視をやめる
  });
},{rootMargin:'0px 0px -8% 0px',threshold:.06}):null;
function bindReveal(root){
  const scope=root||document;
  // 明示的に付いた .reveal と、画面ごとの主要な塊を拾う。
  // 見出し（h1.page）は動かさない。すぐ下の説明文だけ先に出てしまい、
  // 重なって見えるうえ「読み始めたい場所」が遅れて出るのは邪魔になるため
  scope.querySelectorAll('.card,.hex,.reveal').forEach(el=>{
    if(el.classList.contains('in'))return;
    el.classList.add('reveal');
    if(REVEAL_IO)REVEAL_IO.observe(el); else el.classList.add('in');
  });
}

/* ホームの入口タイル。参考サイトのポートフォリオに合わせて六角形で並べる。
   act には onclick にそのまま入るJSを渡す（go('apply') でも openXxx() でもよい）。
   icon は ICON の名前（引数名を ic にすると同名の関数を隠してしまうので避けている）。
   badge は右上に出す件数（0や未指定なら出さない） */
function hex(act,icon,t,d,badge){
  return `<button class="hex" onclick="${act}">
    ${badge?`<span class="hxb">${badge}</span>`:''}
    <span class="hxi">${ic(icon)}</span>
    <span class="hxt">${t}</span>
    <span class="hxd">${d}</span></button>`;
}
/* 六角形をハニカム状に並べる。1行は最大4個までで、
   4個以下なら1行に収める。行が増えたら1つおきに半個ずらして噛み合わせる。
   4個→4、6個→3＋3、7個→4＋3、10個→4＋4＋2。
   1個あたりの幅は --cols から計算するので、行数が変わってもCSSは触らずに済む */
const HEX_PER_ROW=4;
function hexgrid(items){
  const n=items.length;
  const rows=Math.max(1,Math.ceil(n/HEX_PER_ROW));
  // 行数を決めてから均等に割るので、最後の行だけ極端に少なくならない
  const per=Math.max(1,Math.ceil(n/rows));
  const chunks=[];
  for(let i=0;i<n;i+=per)chunks.push(items.slice(i,i+per));
  const html=chunks.map((c,i)=>`<div class="hexrow${i%2?' off':''}">${c.join('')}</div>`).join('');
  return `<div class="hexwrap"><div class="hexgrid" style="--cols:${per};--off:${chunks.length>1?'.5':'0'}">${html}</div></div>`;
}

function isMobileDevice(){
  return /iPhone|iPad|iPod|Android/.test(navigator.userAgent);

function openGoogleCalendarTab(){
  // ログイン中のGoogleアカウントで開くよう authuser にメールアドレスを渡す
  const web=ME&&ME.email
    ? `https://calendar.google.com/calendar/u/0/r?authuser=${encodeURIComponent(ME.email)}`
    : 'https://calendar.google.com/calendar/u/0/r';
  const ua=navigator.userAgent;

  if(/Android/.test(ua)){
    // Androidはintent://でアプリを直接開く。未インストールならブラウザ版に自動で切り替わる
    location.href='intent://calendar.google.com/calendar/r#Intent;scheme=https;'
      +'package=com.google.android.calendar;S.browser_fallback_url='
      +encodeURIComponent(web)+';end';
    return;
  }
  if(/iPhone|iPad|iPod/.test(ua)){
    // iOSはURLスキームで開く。アプリが入っていないと何も起きないため、
    // 少し待ってからブラウザ版に切り替える。アプリが開いた場合は画面が隠れるので取り消す
    const fallback=setTimeout(()=>{location.href=web;},1500);
    const onHide=()=>{
      if(document.hidden){
        clearTimeout(fallback);
        document.removeEventListener('visibilitychange',onHide);
      }
    };
    document.addEventListener('visibilitychange',onHide);
    location.href='googlecalendar://';
    return;
  }
  window.open(web,'_blank','noopener');
}

   面談申請（インターン生）
   ========================================================= */
// 週表示グリッド用データ生成：月曜始まり7日 × 30分刻みの時間帯
function genApplyGrid(staffId,weekOffset){
  const weekly=getWeekly(staffId);
  const blocks=((DB.availability[staffId]||{}).blocks||[]).map(b=>[new Date(b.start).getTime(),new Date(b.end).getTime()]);
  const taken=DB.interviews.filter(i=>i.staff_id===staffId&&i.status==='fixed'&&i.confirmed_datetime)
    .map(i=>new Date(i.confirmed_datetime).getTime());
  const now=Date.now();
  const today=new Date();today.setHours(0,0,0,0);
  const dow=today.getDay();
  const diffToMon=(dow===0?-6:1-dow);
  const monday=new Date(today);monday.setDate(today.getDate()+diffToMon+weekOffset*7);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d);}
  let minM=Infinity,maxM=-Infinity;
  days.forEach(d=>{const conf=weekly[d.getDay()];if(conf&&conf.on){
    const [sh,sm]=conf.s.split(':').map(Number);const [eh,em]=conf.e.split(':').map(Number);
    minM=Math.min(minM,sh*60+sm);maxM=Math.max(maxM,eh*60+em);}});
  if(minM===Infinity){minM=9*60;maxM=19*60;}
  const times=[];for(let t=minM;t+30<=maxM;t+=30)times.push(t);
  const grid=days.map(day=>{
    const conf=weekly[day.getDay()];
    return times.map(t=>{
      const dt=new Date(day);dt.setHours(Math.floor(t/60),t%60,0,0);
      const st=dt.getTime(),en=st+30*60000;
      const iso=dt.toISOString();
      if(!conf||!conf.on)return{state:'off',iso};
      const [sh,sm]=conf.s.split(':').map(Number);const [eh,em]=conf.e.split(':').map(Number);
      if(t<sh*60+sm||t+30>eh*60+em)return{state:'off',iso};
      if(st<now)return{state:'off',iso};
      const takenHit=taken.some(x=>Math.abs(x-st)<30*60000-1);
      if(takenHit)return{state:'off',iso};
      const blocked=blocks.some(([bs,be])=>st<be&&en>bs);
      if(blocked)return{state:'off',iso};
      return{state:'ok',iso};
    });
  });
  return{days,times,grid};
}
function viewApply(){
  // 支部管理者も面談を担当するため、面談相手の候補に含める
  const staffs=DB.users.filter(u=>(u.role==='staff'||u.role==='branch_admin')&&u.branch_id===ME.branch_id);
  // 担当スタッフが決まっていれば、その人を初めから選んでおく
  const preferred=staffs.find(s=>s.id===ME.staff_id)?.id||staffs[0]?.id||'';
  if(!APPLY)APPLY={staff:preferred,weekOffset:0,sel:[],mtype:'meet',note:''};
  if(!staffs.length)return `<h1 class="page">面談を申請</h1>
    <div class="empty"><div class="ei">${ic('briefcase')}</div><p>あなたの支部に担当できるスタッフがいません。</p></div>`;

  const staffOpts=staffs.map(s=>`<option value="${s.id}" ${s.id===APPLY.staff?'selected':''}>${esc(s.nickname)}</option>`).join('');
  const{days,times,grid}=genApplyGrid(APPLY.staff,APPLY.weekOffset);
  const todayKey=ymd(new Date());
  const monthLabel=`${days[0].getFullYear()}年${days[0].getMonth()+1}月`;

  const headCells=days.map((d,i)=>{
    const w=d.getDay();const key=ymd(d);const hol=holidayName(d.getFullYear(),d.getMonth(),d.getDate());
    const cls=['bt-h',w===0||hol?'sun':'',w===6?'sat':'',key===todayKey?'today':''].join(' ');
    return `<th class="${cls}">${d.getDate()}<small>${WD_JP[w]}</small></th>`;}).join('');

  const bodyRows=times.map((t,ti)=>{
    const label=`${pad(Math.floor(t/60))}:${pad(t%60)}`;
    const cells=grid.map(dayCol=>{
      const c=dayCol[ti];
      if(c.state==='off')return `<td class="bt-c off">×</td>`;
      const idx=APPLY.sel.indexOf(c.iso);
      const sel=idx>=0;
      return `<td class="bt-c ok ${sel?'sel':''}" onclick="toggleSlot('${c.iso}')">${sel?`<span class="bt-num">${idx+1}</span>`:'○'}</td>`;
    }).join('');
    return `<tr><th class="bt-t">${label}</th>${cells}</tr>`;
  }).join('');

  const table=times.length?`<div class="booktable-wrap">
    <table class="booktable"><thead><tr><th class="bt-corner"></th>${headCells}</tr></thead>
    <tbody>${bodyRows}</tbody></table></div>`
    :`<div class="empty" style="padding:28px"><div class="ei">${ic('slot-empty')}</div><p>この週は面談可能な空き枠がありません。</p></div>`;

  // 選択サマリー
  const summary=APPLY.sel.length?`<div class="divider"></div>
    <label class="fl">選んだ希望日時（最大3つ）</label>
    <div class="selsummary">`+APPLY.sel.map((iso,i)=>`
      <div class="sr"><span class="cn">${i+1}</span><span>${fmtDT(iso)}</span>
      <span class="x" onclick="toggleSlot('${iso}')">×</span></div>`).join('')+`</div>`:'';

  return `<h1 class="page">面談を申請</h1>
    <p class="page-sub">空いている30分枠を最大3つまで選んでください（第1〜第3希望）。担当スタッフが日程を確定します。</p>
    <div class="card"><div class="cb">
      <label class="fl">担当スタッフ</label>
      <select onchange="setApplyStaff(this.value)">${staffOpts}</select>
      <div class="weekpager">
        <button class="pg" onclick="setApplyWeek(-1)" ${APPLY.weekOffset<=0?'disabled':''}>${ic('chevron-l')}前の1週間</button>
        <span class="wm">${monthLabel}</span>
        <button class="pg" onclick="setApplyWeek(1)">次の1週間${ic('chevron')}</button>
      </div>
      <label class="fl">日時を選ぶ（${APPLY.sel.length}/3）</label>
      ${table}
      ${summary}
      <div class="divider"></div>
      <label class="fl">面談方法<span class="req">*</span></label>
      <div class="seg">
        <label><input type="radio" name="mtype" value="meet" ${APPLY.mtype==='meet'?'checked':''} onchange="APPLY.mtype='meet'"><span class="segb">Google Meet</span></label>
        <label><input type="radio" name="mtype" value="zoom" ${APPLY.mtype==='zoom'?'checked':''} onchange="APPLY.mtype='zoom'"><span class="segb">Zoom</span></label>
      </div>
      <label class="fl">その他（任意）</label>
      <textarea placeholder="担当スタッフへのメッセージがあれば記入してください（例：この日程は難しくなったら相談したいです）" style="min-height:90px" oninput="APPLY.note=this.value">${esc(APPLY.note||'')}</textarea>
      <button class="btn pri block" style="margin-top:20px" ${APPLY.sel.length?'':'disabled'} onclick="submitApply()">
        ${APPLY.sel.length?`この${APPLY.sel.length}件で申請する`:'枠を選んでください'}</button>
    </div></div>`;
}
function setApplyStaff(id){APPLY.staff=id;APPLY.weekOffset=0;APPLY.sel=[];render();}
function setApplyWeek(delta){APPLY.weekOffset=Math.max(0,(APPLY.weekOffset||0)+delta);render();}
function toggleSlot(iso){
  const i=APPLY.sel.indexOf(iso);
  if(i>=0)APPLY.sel.splice(i,1);
  else{if(APPLY.sel.length>=3){toast('希望は3つまでです');return;}APPLY.sel.push(iso);}

async function submitApply(){
  if(!APPLY.sel.length){toast('希望する枠を選んでください');return;}
  // 選択順を第1〜第3希望に。空きスロットのみ選択できるため過去・重複は発生しない。
  const sorted=APPLY.sel.slice(); // 選択順を尊重
  const iv={id:'iv_'+uid(),intern_id:ME.id,staff_id:APPLY.staff||null,status:'applied',
    choice1:sorted[0]||null,choice2:sorted[1]||null,choice3:sorted[2]||null,
    meeting_type:APPLY.mtype,confirmed_datetime:null,note:(APPLY.note||'').trim(),created_at:nowISO()};
  const ok=await mutate(db=>{
    db.interviews.push(iv);

/* kind に 'fixed'（面談確定）／'failed'（不成立）を渡したときだけ、実際にメールが届く。
   それ以外（Meet/Zoomリンクの送付など）はアプリ内の履歴に残るだけ */
const REAL_MAIL_KINDS=['fixed','failed'];
function openSendMail(receiverId,subject,body,kind){
  const r=findUser(receiverId);
  const real=REAL_MAIL_KINDS.includes(kind);
  openSheet(`<h3>メール送信</h3>
    ${real
      ?`<div class="hint">${ic('send')}<span>このメールは <b>${esc(r?.email||'ご本人のメールアドレス')}</b> 宛に実際に送信されます。</span></div>`
      :`<div class="hint mock">${ic('mail')}<span>このメールは実際には送信されず、アプリ内の履歴に記録されます。</span></div>`}
    <dl class="kv" style="margin:12px 0 4px"><dt>宛先</dt><dd>${esc(r?.nickname||'—')}（インターン生）</dd></dl>
    <label class="fl">件名</label>
    <input id="mailSubj" value="${esc(subject)}">
    <label class="fl">本文</label>
    <textarea id="mailBody" style="min-height:180px">${esc(body)}</textarea>
    <div class="field-err" id="mailErr"></div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn" style="flex:1" onclick="closeSheet()">閉じる</button>
      <button class="btn pri" style="flex:2" id="mailBtn" onclick="sendMail('${receiverId}','${kind||''}')">
        ${real?'送信する':'履歴に記録する'}</button>
    </div>`);
}
async function sendMail(receiverId,kind){
  const subject=document.getElementById('mailSubj').value.trim();
  const body=document.getElementById('mailBody').value.trim();
  const err=document.getElementById('mailErr');
  const btn=document.getElementById('mailBtn');
  err.classList.remove('show');
  if(!subject){err.textContent='件名を入力してください';err.classList.add('show');return;}
  btn.disabled=true;btn.textContent='送信中…';
  try{
    const res=await api('/api/mail/send',{method:'POST',
      body:JSON.stringify({receiver_id:receiverId,subject,body,kind})});
    const data=await res.json();
    if(!res.ok){
      err.textContent=data.error||'送信に失敗しました';err.classList.add('show');
      btn.disabled=false;btn.textContent='送信する';return;
    }
    closeSheet();
    toast(data.warning||(data.sent?'メールを送信しました':'履歴に記録しました'));
    // 履歴はサーバーが書き込むので、取り直して画面に反映する
    try{DB=await apiGetDB();sessionStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}
    render();
  }catch(e){
    err.textContent='通信に失敗しました。時間をおいて再度お試しください。';err.classList.add('show');
    btn.disabled=false;btn.textContent='送信する';
  }
}

/* =========================================================
   全体予定表（ドットジェイピーの共有カレンダー）
   ---------------------------------------------------------
   管理者が連携した1つのGoogleカレンダーを、スタッフ全員のカレンダーに
   読み取り専用で重ねて表示する。予定はDBに入れずサーバー経由で都度取得するので、
   Googleカレンダー側で予定が変わればそのまま反映される。
   表示している月ごとに取りに行き、一度取った月は覚えておく。
   ========================================================= */
/* 支部イベント（EVENT_COLORS）にも面談（--iv）にも使っていない色にして、
   全体予定表の予定だとひと目で分かるようにする */
const SHARED_CAL_COLOR='#f0955b';
let SHARED_CAL={events:{},loading:{},configured:null,name:null};
function sharedCalOn(){return ME&&ME.role!=='intern';}
function sharedKey(y,m){return y+'-'+m;}
/* 表示中の月の予定を確保する。未取得ならサーバーに聞きに行き、
   返ってきたら画面を描き直す（render中に呼ばれるので同期では待たない） */
function ensureSharedCal(y,m){
  if(!sharedCalOn())return [];
  const key=sharedKey(y,m);
  if(SHARED_CAL.events[key])return SHARED_CAL.events[key];
  if(SHARED_CAL.loading[key])return [];
  SHARED_CAL.loading[key]=true;
  const timeMin=new Date(y,m,1).toISOString();
  const timeMax=new Date(y,m+1,1).toISOString();
  api(`/api/shared-calendar/events?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}`)
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      SHARED_CAL.loading[key]=false;
      if(!d)return;
      SHARED_CAL.events[key]=d.events||[];
      SHARED_CAL.configured=!!d.configured;
      if(d.name)SHARED_CAL.name=d.name;
      // 取れた予定が画面に出るように描き直す
      if(SHARED_CAL.events[key].length)render();
    })
    .catch(()=>{SHARED_CAL.loading[key]=false;});
  return [];
}
// 全体予定表の予定を、支部イベントと同じ形に整えてカレンダーに並べる
function sharedItemsFor(y,m){
  return ensureSharedCal(y,m).map(e=>({
    id:e.id,title:e.title,start:e.start,allDay:e.allDay,location:e.location,shared:true,
  }));
}
/* 終日の予定は "2026-07-15" のような日付だけの文字列で届く。
   そのまま new Date() に渡すとUTCの0時と解釈され、時差の分だけ日がずれることがある。
   日付だけのときは地域時間の日付として組み立てて、ずれないようにする */
function sharedDate(e){
  if(e.allDay&&/^\d{4}-\d{2}-\d{2}$/.test(e.start)){
    const[y,m,d]=e.start.split('-').map(Number);return new Date(y,m-1,d);
  }
  return new Date(e.start);
}
function sharedLabel(e){return e.allDay?e.title:`${hm(e.start)} ${e.title}`;}
/* 全体予定表を読み込み直す。Googleカレンダー側を直したあと、
   5分のキャッシュを待たずに反映させたいときに使う */
function reloadSharedCal(){SHARED_CAL.events={};SHARED_CAL.loading={};render();}

// 自分に関係する確定面談を取得（カレンダー併記用）
function myInterviewsForCal(){
  return DB.interviews.filter(iv=>{
    if(iv.status!=='fixed'||!iv.confirmed_datetime)return false;
    if(ME.role==='admin')return true;
    if(ME.role==='intern')return iv.intern_id===ME.id;
    const intern=findUser(iv.intern_id);
    return iv.staff_id===ME.id||(intern&&intern.branch_id===ME.branch_id);
  });
}
function ivLabel(iv){const intern=findUser(iv.intern_id),staff=findUser(iv.staff_id);
  return ME.role==='intern'?`面談：${staff?staff.nickname:'担当'}さん`:`面談：${intern?intern.nickname:'—'}さん`;}
function eventsSection(){
  if(!calYM){const t=new Date();calYM={y:t.getFullYear(),m:t.getMonth()};}
  let list=DB.events.slice();
  // 自分だけの予定は、どの支部の絞り込みでも自分には見えるようにする
  if(ME.role!=='admin')list=list.filter(e=>e.branch_id===ME.branch_id||e.creator_id===ME.id);
  const ivs=myInterviewsForCal();
  const unreviewed=myUnreviewedEvents();
  const {y,m}=calYM;
  const shared=sharedItemsFor(y,m);
  const evByDay={},ivByDay={},shByDay={};
  list.forEach(e=>{const k=ymd(new Date(e.start_datetime));(evByDay[k]=evByDay[k]||[]).push(e);});
  ivs.forEach(iv=>{const k=ymd(new Date(iv.confirmed_datetime));(ivByDay[k]=ivByDay[k]||[]).push(iv);});
  shared.forEach(e=>{const k=ymd(sharedDate(e));(shByDay[k]=shByDay[k]||[]).push(e);});

  let body;
  if(calMode==='list'){
    body=agendaView(list,ivs,shared,y,m);
  }else{
    const startDow=new Date(y,m,1).getDay();
    const daysInMonth=new Date(y,m+1,0).getDate();
    const todayKey=ymd(new Date());
    let cells='';
    // 前月の空白セル（数字は表示しない）
    for(let i=0;i<startDow;i++)cells+=`<div class="calcell out"></div>`;
    for(let d=1;d<=daysInMonth;d++){
      const key=ymd(new Date(y,m,d));const evs=evByDay[key]||[];const dvs=ivByDay[key]||[];
      const shs=shByDay[key]||[];
      const items=[
        // 全体予定表は組織全体の予定なので、その日の先頭に出す
        ...shs.map(e=>({t:sharedDate(e),color:SHARED_CAL_COLOR,label:sharedLabel(e)})),
        ...evs.map(e=>({t:new Date(e.start_datetime),color:e.color||EVENT_COLORS[0].v,label:`${hm(e.start_datetime)} ${e.title}`})),
        ...dvs.map(iv=>({t:new Date(iv.confirmed_datetime),color:'var(--iv)',label:`${hm(iv.confirmed_datetime)} ${ivLabel(iv)}`})),
      ].sort((a,b)=>a.t-b.t);
      const has=items.length;const hol=holidayName(y,m,d);
      const cls=['calcell',has?'has':'',key===todayKey?'today':'',key===calSel?'sel':'',hol?'holiday':''].join(' ');
      let chipsHtml='';
      if(has){
        // 予定そのものを押したときは作成フォームではなく、その日の一覧を開く
        const open=`onclick="event.stopPropagation();calSelect('${key}')"`;
        if(chipsMode()==='dot'){
          // 色の丸だけ。中身はこの下の一覧で読ませる
          const maxDots=4;
          const dots=items.slice(0,maxDots).map(it=>`<span class="cdotm" style="background:${it.color}"></span>`).join('');
          const more=has>maxDots?`<span class="dotmore">…</span>`:'';
          chipsHtml=`<div class="dots" ${open}>${dots}${more}</div>`;
        }else{
          // 全画面のほうが1日ぶんの幅も高さもあるので、1件多く見せる
          const cap=calFull?4:3;
          const showN=has>cap?cap-1:has;
          const shown=items.slice(0,showN).map(it=>`<span class="chip" style="background:${chipBg(it.color)};color:${chipFg(it.color)}">${esc(it.label)}</span>`).join('');
          const more=has>showN?`<span class="chipmore">+${has-showN}</span>`:'';
          chipsHtml=`<div class="chips" ${open}>${shown}${more}</div>`;
        }
      }
      cells+=`<div class="${cls} add"${hol?` title="${esc(hol)}"`:''} onclick="openEventForm(null,'${key}')"><span class="dn">${d}</span>${chipsHtml}</div>`;
    }
    const trail=(7-(startDow+daysInMonth)%7)%7;
    for(let i=1;i<=trail;i++)cells+=`<div class="calcell out"></div>`;
    const dow=WD_JP.map((w)=>`<div class="caldow">${w}</div>`).join('');
    body=`<div class="calgrid">${dow}${cells}</div>`;
  }

  const cal=`<div class="card cal ${calMode==='month'&&chipsMode()==='dot'?'dots':''}"><div class="cb">
      <div class="calhead">
        <span class="cm"><span class="cm-m">${m+1}月</span><span class="cm-y">${y}</span></span>
        <span class="calnav">
          <button class="navbtn" onclick="calShift(-1)" aria-label="前の月">${ic('chevron-l')}</button>
          <button class="navbtn" onclick="calShift(1)" aria-label="次の月">${ic('chevron')}</button>
        </span>
      </div>
      ${body}
    </div></div>`;

  // 選択日 or 当月のイベント（出欠カード）
  let below=list.filter(e=>{const dt=new Date(e.start_datetime);
    return calSel? ymd(dt)===calSel : (dt.getFullYear()===y&&dt.getMonth()===m);});
  below.sort((a,b)=>new Date(a.start_datetime)-new Date(b.start_datetime));
  // 選択日の確定面談（該当日のみ、補足表示）
  const ivBelow=calSel?ivs.filter(iv=>ymd(new Date(iv.confirmed_datetime))===calSel):[];
  const ivCards=ivBelow.map(iv=>`<div class="card"><div class="cb" style="display:flex;align-items:center;gap:10px">
      <span class="tile-ic" style="width:38px;height:38px;background:var(--iv-soft);color:var(--iv);font-size:18px">${ic('calendar')}</span>
      <span><b>${esc(ivLabel(iv))}</b><br><span class="tile-d">${fmtDT(iv.confirmed_datetime)} ・ ${MTYPE[iv.meeting_type]}</span></span>
    </div></div>`).join('');
  // 選択日の全体予定表（読み取り専用。編集はGoogleカレンダー側で行う）
  const shBelow=calSel?shared.filter(e=>ymd(sharedDate(e))===calSel):[];
  const shCards=shBelow.map(e=>`<div class="card"><div class="cb" style="display:flex;align-items:center;gap:10px">
      <span class="tile-ic" style="width:38px;height:38px;background:${chipBg(SHARED_CAL_COLOR)};color:${chipFg(SHARED_CAL_COLOR)};font-size:18px">${ic('calendar')}</span>
      <span><b>${esc(e.title)}</b><br><span class="tile-d">${e.allDay?'終日':fmtDT(e.start)}${e.location?' ・ '+esc(e.location):''} ・ 全体予定表</span></span>
    </div></div>`).join('');
  const listTitle=calSel?`${Number(calSel.split('-')[1])}/${Number(calSel.split('-')[2])} の予定`:`${m+1}月のイベント`;
  const clearBtn=calSel?`<button class="btn ghost sm" onclick="calSelect(null)">絞り込み解除</button>`:'';
  const cards=(below.length||ivBelow.length||shBelow.length)?shCards+ivCards+below.map(eventCard).join('')
    :`<div class="empty"><div class="ei">${ic('calendar')}</div><p>${calSel?'この日の予定はありません。':'この月のイベントはありません。'}</p></div>`;

  const viewTabs=`<div class="calview-tabs">
        <button class="${calMode==='month'?'on':''}" onclick="setCalMode('month')">月</button>
        <button class="${calMode==='list'?'on':''}" onclick="setCalMode('list')">リスト</button>
      </div>`;
  // 予定の見せ方は月表示のときだけ意味がある（リストは元から全文が出る）
  const chipTabs=calMode==='month'?`<div class="calview-tabs">
        <button class="${chipsMode()==='dot'?'on':''}" onclick="setChipsMode('dot')" title="予定を色の丸で示す">ドット</button>
        <button class="${chipsMode()==='text'?'on':''}" onclick="setChipsMode('text')" title="予定を文字で示す">文字</button>
      </div>`:'';
  const listBlock=`<div style="display:flex;align-items:center;margin:16px 2px 8px"><h3 style="margin:0;font-size:15px">${listTitle}</h3><span style="margin-left:auto">${clearBtn}</span></div>
    ${cards}`;

  /* 全画面。説明文やお知らせは出さず、操作バーとカレンダーだけにする。
     選んだ日の予定は、これまでどおり下にスクロールすれば読める */
  if(calFull){
    return `<div class="calfull-bar">
        <button class="btn ghost sm" onclick="setCalFull(false)">${ic('back')}戻る</button>
        <span class="calfull-tabs">${chipTabs}${viewTabs}</span>
      </div>
      ${cal}
      <div style="padding:0 12px">${listBlock}</div>`;
  }

  return `<div class="divider" style="margin:22px 0 14px"></div>
    <div class="calsec-head">
      <h2>${ic('calendar')}カレンダー</h2>
      <span class="calsec-tools">
        ${chipTabs}${viewTabs}
        <button class="btn ghost sm calfull-btn" onclick="setCalFull(true)" title="カレンダーを画面いっぱいに表示">${ic('panel')}全画面</button>
      </span></div>
    <p class="page-sub" style="margin-top:-2px">日付をクリックすると、その日の予定を追加できます。予定の帯をクリックすると、その日の一覧が下に出ます。</p>
    ${sharedCalOn()&&SHARED_CAL.configured?`<div class="hint">
      <span style="width:14px;height:14px;border-radius:4px;background:${SHARED_CAL_COLOR};flex:none"></span>
      <span>この色の予定は <b>${esc(SHARED_CAL.name||'全体予定表')}</b> です。ドットジェイピーのカレンダーをそのまま表示しています（このアプリからは編集できません）。</span></div>`:''}
    ${isFullAdmin()&&SHARED_CAL.configured===false?`<div class="hint mock" style="cursor:pointer" onclick="openSharedCalendarSettings()">
      ${ic('calendar')}<span>全体予定表がまだ設定されていません。タップして、スタッフ全員に見せるカレンダーを設定できます。</span></div>`:''}
    ${unreviewed.length?`<div class="hint mock" style="background:var(--brand-soft);border-color:var(--line-h);cursor:pointer" onclick="openVisibilityCleanup()">
      ${ic('lock')}<span>公開範囲を選べるようになる前に作った予定が <b>${unreviewed.length}件</b> あります。
      いまも支部の全員に見えているので、<b>個人的なものを「自分だけ」に変えられます</b>。タップして見直す。</span></div>`:''}
    <button class="btn pri block quiet" style="margin-bottom:12px" onclick="openEventForm()">＋ 新しい予定を作成</button>
    ${cal}
    ${listBlock}`;
}
// リスト（アジェンダ）表示：当月のイベント＋面談を時系列で
function agendaView(list,ivs,shared,y,m){
  const items=[];
  (shared||[]).forEach(e=>{const dt=sharedDate(e);
    if(dt.getFullYear()===y&&dt.getMonth()===m)items.push({dt,type:'ev',title:e.title,sub:`${e.allDay?'終日':hm(e.start)}・全体予定表`,key:ymd(dt),color:SHARED_CAL_COLOR});});
  list.forEach(e=>{const dt=new Date(e.start_datetime);
    if(dt.getFullYear()===y&&dt.getMonth()===m)items.push({dt,type:'ev',title:e.title,sub:`${hm(e.start_datetime)}・${e.location||'—'}`,key:ymd(dt),color:e.color||EVENT_COLORS[0].v});});
  ivs.forEach(iv=>{const dt=new Date(iv.confirmed_datetime);
    if(dt.getFullYear()===y&&dt.getMonth()===m)items.push({dt,type:'iv',title:ivLabel(iv),sub:`${hm(iv.confirmed_datetime)}・${MTYPE[iv.meeting_type]}`,key:ymd(dt)});});
  items.sort((a,b)=>a.dt-b.dt);
  if(!items.length)return `<div class="empty" style="padding:26px"><div class="ei">${ic('calendar')}</div><p>${m+1}月の予定はありません。</p></div>`;
  return `<div class="agenda">`+items.map(it=>{
    const w=WD_JP[it.dt.getDay()];
    return `<div class="ag" ${it.type==='ev'?`style="cursor:pointer" onclick="calSelect('${it.key}')"`:''}>
      <span class="agd"><span class="agn" style="${it.dt.getDay()===0?'color:var(--sun)':it.dt.getDay()===6?'color:var(--sat)':''}">${it.dt.getDate()}</span><span class="agw">${w}</span></span>
      <span class="agbar ${it.type==='iv'?'iv':''}" ${it.type==='ev'?`style="background:${it.color}"`:''}></span>
      <span style="flex:1"><span class="agt">${esc(it.title)}</span><br><span class="ags">${esc(it.sub)}</span></span>
    </div>`;}).join('')+`</div>`;
}
function setCalMode(mode){calMode=mode;render();}
function calShift(delta){let m=calYM.m+delta,y=calYM.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}calYM={y,m};calSel=null;render();}
function calSelect(key){calSel=(key&&key!==calSel)?key:null;render();}
async function vote(evId,resp){
  const ok=await mutate(db=>{
    const r=db.event_responses.find(x=>x.event_id===evId&&x.user_id===ME.id);
    if(!r){db.event_responses.push({id:uid(),event_id:evId,user_id:ME.id,response:resp});return;}
    // 同じものをもう一度押したら取り消し
    if(r.response===resp)db.event_responses=db.event_responses.filter(x=>x!==r);
    else r.response=resp;
  });
  render();
  if(ok)toast('回答を記録しました');
}
function openEventResponders(evId){
  const resp=DB.event_responses.filter(r=>r.event_id===evId);
  const label={ok:'○ 参加',may:'△ 未定',no:'× 不参加'};
  const rows=resp.length?resp.map(r=>{const u=findUser(r.user_id);
    return `<div class="row"><span class="av">${esc(initials(u?.nickname))}</span>
      <span class="rmain"><span class="rt">${esc(u?.nickname||'—')}</span>
      <span class="rs">${branchName(u?.branch_id)}</span></span>
      <span class="tag">${label[r.response]}</span></div>`;}).join('')
    :'<div class="empty">まだ回答がありません</div>';
  openSheet(`<h3>回答者一覧</h3><div class="card"><div class="rowlist">${rows}</div></div>`);
}
/* 公開範囲の仕組みを入れる前に作られた、自分の予定。
   visibility を持たないので支部の全員に見えている状態のもの */
function myUnreviewedEvents(){
  return DB.events
    .filter(e=>e.creator_id===ME.id&&e.visibility===undefined)
    .sort((a,b)=>new Date(a.start_datetime)-new Date(b.start_datetime));
}
/* 昔の予定を1件ずつ見て、個人的なものだけ「自分だけ」に変える。
   チェックしなかったものは支部共有のままで確定させ、この案内をもう出さないようにする */
function openVisibilityCleanup(){
  const evs=myUnreviewedEvents();
  if(!evs.length){toast('見直しが必要な予定はありません');return;}
  const rows=evs.map((e,i)=>`<label class="visrow">
      <input type="checkbox" data-id="${e.id}" ${i===0?'':''}>
      <span class="visrow-b">
        <b>${esc(e.title)}</b>
        <span class="tile-d">${fmtDT(e.start_datetime)}${e.location?' ・ '+esc(e.location):''}</span>
      </span>
    </label>`).join('');
  openSheet(`<h3>昔の予定の公開範囲を見直す</h3>
    <div class="hint">${ic('bulb')}<span>下の予定は、いまも <b>${esc(branchName(ME.branch_id))}の全員</b> に見えています。
      ほかの人に見せたくないものにチェックを入れてください。チェックしたものだけ「自分だけ」になります。</span></div>
    <div class="btn-row" style="margin:10px 0">
      <button class="btn sm" onclick="visCleanupAll(true)">すべて選ぶ</button>
      <button class="btn sm" onclick="visCleanupAll(false)">すべて外す</button>
    </div>
    <div class="vislist" id="visList">${rows}</div>
    <button class="btn pri block" style="margin-top:16px" onclick="saveVisibilityCleanup()">この内容で確定する（${evs.length}件）</button>
    <p class="page-sub" style="margin-top:8px">チェックを入れなかった予定は、これまでどおり支部の全員に見えたままになります。</p>`);
}
function visCleanupAll(on){
  document.querySelectorAll('#visList input[type=checkbox]').forEach(c=>{c.checked=on;});
}
async function saveVisibilityCleanup(){
  const boxes=[...document.querySelectorAll('#visList input[type=checkbox]')];
  const priv=new Set(boxes.filter(c=>c.checked).map(c=>c.dataset.id));
  const all=new Set(boxes.map(c=>c.dataset.id));
  const ok=await mutate(db=>{
    db.events.forEach(e=>{
      if(!all.has(e.id))return;
      // チェックの有無にかかわらず確定させる。そうしないと毎回この案内が出続ける
      e.visibility=priv.has(e.id)?'private':'branch';
    });
  });
  if(!ok)return;
  closeSheet();render();
  toast(priv.size?`${priv.size}件を「自分だけ」にしました`:'公開範囲を確定しました');
}
/* dateKey（'2026-07-15'）を渡すと、その日の9:00を初期値にして開く。

  // 新規は「自分だけ」を既定にする。古い予定は visibility が無いので支部共有として扱う

    <label class="fl">予定の名前<span class="req">*</span></label>
    <input id="evTitle" value="${esc(ev?.title||'')}"><div class="field-err" id="evTitleE"></div>
    <label class="fl">説明</label>
    <textarea id="evDesc">${esc(ev?.description||'')}</textarea>
    <label class="fl">開催日時<span class="req">*</span></label>
    <input type="datetime-local" id="evStart" value="${startVal}"><div class="field-err" id="evStartE"></div>
    <label class="fl">終了日時</label>
    <input type="datetime-local" id="evEnd" value="${toInputDT(ev?.end_datetime)}">
    <label class="fl">開催場所</label>
    <input id="evLoc" value="${esc(ev?.location||'')}" placeholder="例：水戸市民会館／オンライン">
    <label class="fl">この予定を見られる人</label>
    ${canShare?`<select id="evVis" onchange="toggleEvBranch()">
      <option value="private" ${vis==='private'?'selected':''}>自分だけ</option>
      <option value="branch" ${vis==='branch'?'selected':''}>支部の全員（出欠を取る）</option>
    </select>`:`<input id="evVis" type="hidden" value="private">
    <p class="page-sub" style="margin-top:4px">あなたが入れた予定は、ほかの人には見えません。</p>`}
    <div id="evBranchWrap" style="display:${canShare&&vis==='branch'?'':'none'}">
    <label class="fl">対象支部</label>
    <select id="evBranch">${bopts}</select></div>
    <label class="fl">カレンダーの色</label>
    <div class="colorpick" id="evColorPick">${EVENT_COLORS.map(c=>`<span class="cdot${c.v===(ev?.color||EVENT_COLORS[0].v)?' on':''}" style="background:${c.v}" data-c="${c.v}" title="${c.n}" onclick="pickEvColor('${c.v}')"></span>`).join('')}</div>
    <input type="hidden" id="evColor" value="${esc(ev?.color||EVENT_COLORS[0].v)}">
    <label class="fl">Meetリンク</label>
    <input id="evMeet" value="${esc(ev?.meet_url||'')}" placeholder="https://meet.google.com/...">
    <label class="fl">Zoomリンク</label>
    <input id="evZoom" value="${esc(ev?.zoom_url||'')}" placeholder="https://zoom.us/j/...">
    <button class="btn pri block" style="margin-top:18px" onclick="saveEvent(${ev?`'${ev.id}'`:'null'})">${ev?'更新する':'作成する'}</button>`);
}
function pickEvColor(v){
  document.getElementById('evColor').value=v;
  document.querySelectorAll('#evColorPick .cdot').forEach(el=>el.classList.toggle('on',el.dataset.c===v));
}
// 対象支部は、支部の全員に共有するときだけ意味があるので、そのときだけ見せる
function toggleEvBranch(){
  const wrap=document.getElementById('evBranchWrap');
  if(wrap)wrap.style.display=document.getElementById('evVis').value==='branch'?'':'none';
}
async function saveEvent(id){
  const title=document.getElementById('evTitle').value.trim();
  const start=document.getElementById('evStart').value;
  let valid=true;
  const te=document.getElementById('evTitleE'),se=document.getElementById('evStartE');
  te.classList.remove('show');se.classList.remove('show');
  if(!title){te.textContent='イベント名は必須です';te.classList.add('show');valid=false;}
  if(!start){se.textContent='開催日時は必須です';se.classList.add('show');valid=false;}
  if(!valid)return;
  const visibility=document.getElementById('evVis').value==='branch'?'branch':'private';
  const data={title,description:document.getElementById('evDesc').value.trim(),
    start_datetime:new Date(start).toISOString(),
    end_datetime:document.getElementById('evEnd').value?new Date(document.getElementById('evEnd').value).toISOString():new Date(start).toISOString(),
    location:document.getElementById('evLoc').value.trim(),
    branch_id:document.getElementById('evBranch').value,
    visibility,
    color:document.getElementById('evColor').value||EVENT_COLORS[0].v,
    meet_url:document.getElementById('evMeet').value.trim(),
    zoom_url:document.getElementById('evZoom').value.trim()};
  const newId=id?null:'ev_'+uid();
  const ok=await mutate(db=>{
    if(id){
      const ev=db.events.find(e=>e.id===id);
      if(ev)Object.assign(ev,data);
    }else{
      db.events.push({id:newId,creator_id:ME.id,...data});
      // 自分だけの予定を支部の全員に知らせても仕方がないので、共有するときだけ通知する
      if(visibility==='branch')pushNotification(db,'イベント作成',`「${title}」が作成されました`);
    }
  });
  if(!ok)return;
  updateBell();
  closeSheet();render();
  toast(id?'イベントを更新しました':'イベントを作成しました');
}
async function deleteEvent(id){
  if(!await confirmSheet('イベントを削除','このイベントと、これまでの出欠回答をすべて削除します。元に戻せません。','削除する'))return;
  const ok=await mutate(db=>{
    db.events=db.events.filter(e=>e.id!==id);
    db.event_responses=db.event_responses.filter(r=>r.event_id!==id);
  });
  render();
  if(ok)toast('イベントを削除しました');
}

   ========================================================= */
function openAvailabilitySettings(){
  const w=getWeekly(ME.id);
  const rows=[1,2,3,4,5,6,0].map(d=>{const c=w[d];const on=c.on;
    return `<div class="wkrow ${on?'':'off'}" id="wk${d}">
      <span class="wd ${d===0?'sun':''} ${d===6?'sat':''}">${WD_JP[d]}</span>
      <span class="sw ${on?'on':''}" onclick="toggleWk(${d})"><i></i></span>
      <span class="times">
        <input type="time" id="wks${d}" value="${c.s}">
        <span style="color:var(--sub)">〜</span>
        <input type="time" id="wke${d}" value="${c.e}">
      </span></div>`;}).join('');
  openSheet(`<h3>面談可能時間帯</h3>
    <p class="page-sub">インターン生は、ここで設定した時間帯の中から30分刻みで面談を予約できます。</p>
    <div class="hint">${ic('calendar-check')}<span>Googleカレンダーと連携している場合、予定は自動的に不可時間として反映されます（ホーム画面の「Googleカレンダー連携」から設定できます）。</span></div>
    <div style="margin-top:8px">${rows}</div>
    <button class="btn pri block" style="margin-top:18px" onclick="saveAvailability()">保存する</button>

    <!-- 曜日ごとの設定と、日を指定した「この日のここは無理」は表裏一体なので
         ここから続けて開けるようにする。逆向きの導線は viewAvailSet() 側にある -->
    <div class="divider" style="margin:20px 0 14px"></div>
    <p class="fl">個別の予定で埋まっている時間</p>
    <p class="page-sub" style="margin-top:2px">上で決めた時間帯のうち、特定の日だけ空けられないときはこちらで30分枠を指定します。</p>
    <button class="btn block" style="margin-top:10px" onclick="closeSheet();go('avset')">
      ${ic('ban')}面談できない時間を登録</button>
    ${openCalendarButton()}`);
}
function toggleWk(d){
  const c=getWeekly(ME.id)[d];const cur=document.querySelector(`#wk${d} .sw`).classList.contains('on');
  document.querySelector(`#wk${d} .sw`).classList.toggle('on',!cur);
  document.getElementById('wk'+d).classList.toggle('off',cur);
}
async function saveAvailability(){
  const weekly={};
  [0,1,2,3,4,5,6].forEach(d=>{
    weekly[d]={on:document.querySelector(`#wk${d} .sw`).classList.contains('on'),
      s:document.getElementById('wks'+d).value||'09:00',
      e:document.getElementById('wke'+d).value||'19:00'};
    if(weekly[d].e<=weekly[d].s)weekly[d].e=weekly[d].s;
  });
  // weekly だけを差し替える。blocks は触らない
  // （Googleカレンダー連携のwebhookがサーバー側で blocks を書き足すことがあるため）
  const ok=await mutate(db=>{
    db.availability=db.availability||{};
    db.availability[ME.id]=Object.assign({},db.availability[ME.id],{weekly});
  });
  if(!ok)return;
  closeSheet();toast('面談可能時間帯を保存しました');
}

      <span class="rmain"><span class="rt">${fmtDate(b.start)} ${hm(b.start)}〜${hm(b.end)}</span>
      <span class="rs">${esc(b.note||'予定あり')}${isSlot?'（枠タップ）':''}</span></span>
      <button class="btn sm bad" onclick="delBlock('${b.id}')">削除</button>

      </div>
      <div>
        <label class="fl" style="margin-top:0">終了</label>

        <div class="tpbar hidden" id="tpbar_end">${timeOptions('end')}</div>
      </div>
    </div>
    <label class="fl">メモ（任意）</label>
    <input id="blkNote" value="${esc(BLKFORM.note)}" placeholder="例：授業／アルバイト" oninput="BLKFORM.note=this.value">

    <h3 style="margin:6px 2px 8px;font-size:15px">① カレンダーから枠をタップ</h3>
    <div class="card"><div class="cb">
      <div class="weekpager">
        <button class="pg" onclick="avSetWeek(-1)" ${(AVSET.weekOffset||0)<=0?'disabled':''}>${ic('chevron-l')}前の1週間</button>
        <span class="wm">${monthLabel}</span>
        <button class="pg" onclick="avSetWeek(1)">次の1週間${ic('chevron')}</button>
      </div>
      <label class="fl">時間をタップ（不可 ${blockedCnt}枠）</label>

function avSetWeek(delta){AVSET.weekOffset=Math.max(0,(AVSET.weekOffset||0)+delta);render();}

/* 自分の不可時間リストを db から取り出す（無ければ作る） */
function blocksOf(db,userId){
  db.availability=db.availability||{};
  db.availability[userId]=db.availability[userId]||{};
  db.availability[userId].blocks=db.availability[userId].blocks||[];
  return db.availability[userId];
}
function makeSlotBlock(iso){
  const st=new Date(iso),en=new Date(st.getTime()+30*60000);
  return {id:'blk_'+uid(),start:st.toISOString(),end:en.toISOString(),note:'面談不可',kind:'slot'};
}
/* 追加・削除をまとめて反映する。ドラッグで一気に操作した分も1回の保存で済ませる。
   blocks 全体を置き換えるのではなく増減だけを適用することで、
   保存し直しになったときにGoogleカレンダー由来の予定を消してしまわないようにしている */
async function applyBlockChanges({added=[],removedIds=[]}={}){
  return mutate(db=>{
    const av=blocksOf(db,ME.id);
    let list=av.blocks;
    if(removedIds.length)list=list.filter(b=>!removedIds.includes(b.id));
    for(const b of added){if(!list.some(x=>x.id===b.id))list.push(b);}
    av.blocks=list;
  });
}

/* 枠タップ／ドラッグでまとめて不可・解除する（マウス・タッチ共通）。
   ドラッグ中はセルの見た目だけを先に変えて操作内容をためておき、
   指を離した時点で1回だけ保存する（1マスごとに保存すると通信が大量に発生するため） */
let AVDRAG=null;
function avPointerDown(e,iso){
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();
  const cell=e.currentTarget;
  const mode=cell.classList.contains('block')?'unblock':'block';
  AVDRAG={mode,touched:new Set(),added:[],removedIds:[]};
  document.body.classList.add('noselect');
  avDragApply(cell,iso);
  document.addEventListener('pointermove',avDragMove);
  document.addEventListener('pointerup',avDragEnd);
  document.addEventListener('pointercancel',avDragEnd);
}
function avDragMove(e){
  if(!AVDRAG)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(el&&el.classList&&el.classList.contains('bt-c')&&el.dataset.iso)avDragApply(el,el.dataset.iso);
}
function avDragApply(cell,iso){
  if(!AVDRAG||AVDRAG.touched.has(iso))return;
  if(AVDRAG.mode==='block'){
    if(!cell.classList.contains('ok'))return;
    const b=makeSlotBlock(iso);
    AVDRAG.added.push(b);
    cell.classList.remove('ok');cell.classList.add('block');
    cell.dataset.blockId=b.id;cell.textContent='×';
  }else{
    if(!cell.classList.contains('block'))return;
    const bid=cell.dataset.blockId;
    if(bid)AVDRAG.removedIds.push(bid);
    cell.classList.remove('block');cell.classList.add('ok');
    delete cell.dataset.blockId;cell.textContent='○';
  }
  AVDRAG.touched.add(iso);
}
async function avDragEnd(){
  document.removeEventListener('pointermove',avDragMove);
  document.removeEventListener('pointerup',avDragEnd);
  document.removeEventListener('pointercancel',avDragEnd);
  document.body.classList.remove('noselect');
  if(!AVDRAG)return;
  const {touched,added,removedIds}=AVDRAG;
  AVDRAG=null;
  if(!touched.size){render();return;}
  const ok=await applyBlockChanges({added,removedIds});
  render();
  if(ok)toast(touched.size>1?`${touched.size}件を更新しました`:'更新しました');
}

/* 「日時でまとめて追加」フォーム＋スクロール式 時間ピッカー */
function initBlkForm(){BLKFORM={date:ymd(new Date()),start:'12:00',end:'13:00',note:''};}
// 00:00〜23:30 を30分刻みで返す
function timeOptions(which){
  let h='';
  for(let t=0;t<24*60;t+=30){const v=`${pad(Math.floor(t/60))}:${pad(t%60)}`;
    h+=`<button class="${BLKFORM[which]===v?'on':''}" onclick="tpSet('${which}','${v}')">${v}</button>`;}
  return h;
}
function tpToggle(which){
  const bar=document.getElementById('tpbar_'+which);
  const other=which==='start'?'end':'start';
  document.getElementById('tpbar_'+other)?.classList.add('hidden');
  document.getElementById('tpick_'+other)?.classList.remove('open');
  const willOpen=bar.classList.contains('hidden');
  bar.classList.toggle('hidden');
  document.getElementById('tpick_'+which).classList.toggle('open',willOpen);
  if(willOpen){const on=bar.querySelector('button.on');if(on)on.scrollIntoView({block:'center'});}
}
function tpSet(which,v){
  BLKFORM[which]=v;
  // 開始を変えて終了以上になったら終了を+30分に自動調整
  if(which==='start'&&BLKFORM.end<=v){
    let [hh,mm]=v.split(':').map(Number);let t=hh*60+mm+30;if(t>=24*60)t=24*60-30;
    BLKFORM.end=`${pad(Math.floor(t/60))}:${pad(t%60)}`;
    const ev=document.getElementById('tpv_end');if(ev)ev.textContent=BLKFORM.end;
    const eb=document.getElementById('tpbar_end');if(eb)eb.innerHTML=timeOptions('end');
  }
  document.getElementById('tpv_'+which).textContent=v;
  const bar=document.getElementById('tpbar_'+which);bar.innerHTML=timeOptions(which);bar.classList.add('hidden');
  document.getElementById('tpick_'+which).classList.remove('open');
}
async function addBlock(){
  const {date,start:s,end:e}=BLKFORM;const note=(BLKFORM.note||'').trim();
  const err=document.getElementById('blkErr');err.classList.remove('show');
  if(!date||!s||!e){err.textContent='日付・開始・終了を入力してください';err.classList.add('show');return;}
  const start=new Date(`${date}T${s}`),end=new Date(`${date}T${e}`);
  if(end<=start){err.textContent='終了は開始より後にしてください';err.classList.add('show');return;}
  if(end<new Date()){err.textContent='過去の時間は登録できません';err.classList.add('show');return;}
  const ok=await applyBlockChanges({
    added:[{id:'blk_'+uid(),start:start.toISOString(),end:end.toISOString(),note}],
  });
  if(!ok)return;
  toast('不可時間を登録しました');
  initBlkForm();render();
}
async function delBlock(id){
  const ok=await applyBlockChanges({removedIds:[id]});
  render();
  if(ok)toast('削除しました');
}

/* =========================================================
   支部管理（管理者）
   ========================================================= */
function viewBranches(){
  // 支部が数個だったころは六角形で並べていたが、全国分（40近く）になると
  // 縦に長すぎて探せないため、件数が多いときは一覧表示に切り替える
  const many=DB.branches.length>8;
  const legacy=DB.branches.filter(b=>LEGACY_BRANCH_RENAMES[b.name]).length;
  // 古い名前を直したあとの状態で数える。そうしないと、名前を直せば済むものまで
  // 「未登録」に数えてしまい、実際に増える件数と食い違う
  const after=DB.branches.map(b=>LEGACY_BRANCH_RENAMES[b.name]||b.name);
  const missing=STANDARD_BRANCHES.filter(n=>!after.includes(n)).length;

  const head=`<h1 class="page">支部管理</h1>
    <p class="page-sub">支部を${many?'選ぶ':'タップする'}と編集・削除ができます。</p>
    ${(missing||legacy)?`<div class="hint">${ic('bulb')}<span>
      ${legacy?`古い名前の支部が <b>${legacy}件</b> あります。`:''}
      ${missing?`未登録の支部が <b>${missing}件</b> あります。`:''}
      下の「まとめて登録」で一度にそろえられます。</span></div>`:''}`;

  const foot=`<div class="btn-row" style="margin-top:16px">
      <button class="btn" style="flex:1" onclick="openBranchForm()">＋ 支部を追加</button>
      <button class="btn pri" style="flex:1" onclick="bulkAddBranches()">標準の支部をまとめて登録</button>
    </div>`;

  if(!many){
    const cells=DB.branches.map(b=>{
      const uc=DB.users.filter(u=>u.branch_id===b.id).length;
      return hex(`openBranchForm('${b.id}')`,'building',esc(b.name),`ユーザー ${uc}人`);
    });
    return head+hexgrid(cells)+foot;
  }
  const rows=DB.branches.map(b=>{
    const uc=DB.users.filter(u=>u.branch_id===b.id).length;
    return `<div class="row" style="cursor:pointer" onclick="openBranchForm('${b.id}')">
      <span class="av" style="border-radius:10px;background:var(--brand-soft);color:var(--brand-d);font-size:18px">${ic('building')}</span>
      <span class="rmain"><span class="rt">${esc(b.name)}</span>
      <span class="rs">ユーザー ${uc}人</span></span>
      <span class="tile-arrow">${ic('chevron')}</span></div>`;
  }).join('');
  return head+`<div class="card"><div class="rowlist">${rows}</div></div>`+foot;
}

/* 標準の支部をまとめて登録する。
   ・古い名前（茨城支部など）は、作り直さずに名前だけ直す
     ＝支部IDが変わらないので、紐づいた予定・面談・依頼が切れない
   ・すでにある名前は足さない（何度押しても増えない）
   ・こちらに無い支部は消さない（手で足した支部を勝手に消さないため） */
async function bulkAddBranches(){
  const renames=DB.branches.filter(b=>LEGACY_BRANCH_RENAMES[b.name])
    .map(b=>({id:b.id,from:b.name,to:LEGACY_BRANCH_RENAMES[b.name]}));
  // 名前を直したあとの状態で、足りないものを数える
  const after=DB.branches.map(b=>LEGACY_BRANCH_RENAMES[b.name]||b.name);
  const adds=STANDARD_BRANCHES.filter(n=>!after.includes(n));

  if(!renames.length&&!adds.length){
    await alertSheet('登録済みです','標準の支部はすべて登録されています。');
    return;
  }
  const lines=[];
  if(renames.length)lines.push('名前を直す：\n'+renames.map(r=>`　${r.from} → ${r.to}`).join('\n'));
  if(adds.length)lines.push(`新しく追加する：${adds.length}件\n　${adds.join('、')}`);
  if(!await confirmSheet('標準の支部をまとめて登録',lines.join('\n\n'),'実行する',false))return;

  const ok=await mutate(db=>{
    db.branches=db.branches||[];
    renames.forEach(r=>{const b=db.branches.find(x=>x.id===r.id);if(b)b.name=r.to;});
    const have=db.branches.map(b=>b.name);
    STANDARD_BRANCHES.forEach(n=>{
      if(!have.includes(n)){db.branches.push({id:'b_'+uid(),name:n});have.push(n);}
    });
  });
  if(!ok)return;
  LOGIN_BRANCHES=DB.branches;   // ログイン画面・初回設定の選択肢にも反映する
  go('branches');
  toast(`支部をそろえました（名前の変更${renames.length}件・追加${adds.length}件）`);
}
function openBranchForm(id){
  const b=id?DB.branches.find(x=>x.id===id):null;
  openSheet(`<h3>${b?'支部を編集':'支部を追加'}</h3>
    <label class="fl">支部名<span class="req">*</span></label>
    <input id="brName" value="${esc(b?.name||'')}" placeholder="例：千葉支部">
    <div class="field-err" id="brNameE"></div>
    <div class="btn-row" style="margin-top:16px">
      ${b?`<button class="btn bad" onclick="deleteBranch('${b.id}')">削除</button>`:''}
      <button class="btn pri" style="flex:1" onclick="saveBranch(${b?`'${b.id}'`:'null'})">${b?'更新する':'追加する'}</button>
    </div>`);
}
async function saveBranch(id){
  const name=document.getElementById('brName').value.trim();const e=document.getElementById('brNameE');
  e.classList.remove('show');
  if(!name){e.textContent='支部名は必須です';e.classList.add('show');return;}
  const ok=await mutate(db=>{
    if(id){const b=db.branches.find(x=>x.id===id);if(b)b.name=name;}
    else db.branches.push({id:'b_'+uid(),name});
  });
  if(!ok)return;
  closeSheet();toast('保存しました');go('branches');
}
async function deleteBranch(id){
  const uc=DB.users.filter(u=>u.branch_id===id).length;
  if(uc>0){
    await alertSheet('削除できません',
      `この支部には ${uc}人 が所属しています。先に所属ユーザーの支部を変更してください。`);
    return;
  }
  const b=DB.branches.find(x=>x.id===id);
  if(!await confirmSheet('支部を削除',`「${b?b.name:'この支部'}」を削除します。元に戻せません。`,'削除する'))return;
  const ok=await mutate(db=>{db.branches=db.branches.filter(x=>x.id!==id);});
  if(!ok)return;
  toast('削除しました');go('branches');
}

let DIR_STATUS={count:0,updated_at:null,domain:'dot-jp.or.jp'};
let DIR_QUERY='';      // 検索欄の入力内容（再描画で消えないよう保持する）
let DIR_RESULTS=null;  // null=未検索、[]=該当なし
let DIR_BUSY=false;
let DIR_ADDING=null;   // 「追加」シートで対象にしているメールアドレス
async function loadDirectoryStatus(){
  try{
    const res=await api('/api/admin/directory/status');
    if(!res.ok)return;
    DIR_STATUS=await res.json();
    if(isAdminLike()&&currentTab==='users')render();
  }catch(e){/* オフライン時は無視 */}
}
async function searchDirectory(){
  const el=document.getElementById('dirQ');
  DIR_QUERY=el?el.value.trim():'';
  if(!DIR_QUERY){DIR_RESULTS=null;render();return;}
  DIR_BUSY=true;render();
  try{
    const res=await api('/api/admin/directory/search?q='+encodeURIComponent(DIR_QUERY));
    const data=await res.json();
    DIR_RESULTS=res.ok?(data.results||[]):[];
    if(!res.ok)toast(data.error||'検索に失敗しました');
  }catch(e){DIR_RESULTS=[];toast('検索に失敗しました');}
  DIR_BUSY=false;render();
  const again=document.getElementById('dirQ');
  if(again){again.value=DIR_QUERY;again.focus();}
}
function dirKeydown(ev){if(ev.key==='Enter'){ev.preventDefault();searchDirectory();}}

async function doAddStaff(){

async function doDirectoryImport(){
  const text=document.getElementById('dirText').value;
  const e=document.getElementById('dirTextE');e.classList.remove('show');
  if(!text.trim()){e.textContent='内容を貼り付けてください';e.classList.add('show');return;}

      body:JSON.stringify({text})});

    if(!res.ok){e.textContent=data.error||'取り込みに失敗しました';e.classList.add('show');return;}

    toast(`${data.imported}件を取り込みました${data.skipped?`（${data.skipped}件スキップ）`:''}`);

async function saveUser(id){
  const nick=document.getElementById('usNick').value.trim();const e=document.getElementById('usNickE');
  e.classList.remove('show');
  if(!nick){e.textContent='ニックネームは必須です';e.classList.add('show');return;}

  const data={nickname:nick,branch_id:document.getElementById('usBranch').value,role,
    staff_id:role==='intern'?(document.getElementById('usStaff').value||null):null};
  // インターン先はサーバーのユーザー表ではなくDB側に持っているので、別々に保存する
  const placeEl=document.getElementById('usPlace');
  const place=role==='intern'?(placeEl?placeEl.value||null:null):null;
  try{
    const res=await api(`/api/admin/users/${id}`,{method:'PATCH',body:JSON.stringify(data)});
    if(!res.ok){const d=await res.json().catch(()=>({}));toast(d.error||'保存に失敗しました');return;}
    if(place!==(getProfile(id).internship_id||null)){
      await mutate(db=>{profileOf(db,id).internship_id=place;});
    }
    closeSheet();toast('保存しました');
    await refreshUsersAfterAdminChange();
  }catch(e){toast('保存に失敗しました');}
}
async function deleteUser(id){

}

/* =========================================================
   通知ログ（アプリ内通知の簡易実装）
   ========================================================= */
/* 通知を1件積む。単体では保存せず、通知の原因になった変更と同じ mutate() の中で呼ぶ。
   別々に保存すると、保存が2回に分かれて競合の機会が増えるため。
   branch_id は、他支部の通知が見えないようサーバー側で絞り込むために持たせる */
function pushNotification(db,type,msg){
  db.notifications=db.notifications||[];
  db.notifications.push({id:uid(),type,msg,at:nowISO(),branch_id:ME.branch_id||null});
}
const NOTI_READ_KEY='ops_notiread_v1';
function getNotiRead(){try{return JSON.parse(localStorage.getItem(NOTI_READ_KEY))||{};}catch(e){return {};}}
function lastRead(){return getNotiRead()[ME?.id]||'1970-01-01T00:00:00.000Z';}
function unreadCount(){return (DB.notifications||[]).filter(n=>n.at>lastRead()).length;}
/* 色はCSS変数で持つ。テーマを切り替えても勝手に追従する */
const NOTI_IC={
  '面談申請':{e:'edit',bg:'var(--warn-soft)',fg:'var(--warn-ink)'},
  '面談確定':{e:'check',bg:'var(--ok-soft)',fg:'var(--ok-ink)'},
  '面談不成立':{e:'alert',bg:'var(--bad-soft)',fg:'var(--bad)'},
  'イベント作成':{e:'calendar',bg:'var(--iv-soft)',fg:'var(--iv-ink)'},
  'イベント更新':{e:'refresh',bg:'var(--info-soft)',fg:'var(--info-ink)'},
  '依頼':{e:'megaphone',bg:'var(--brand-soft)',fg:'var(--brand-d)'}};
function updateBell(){
  const b=document.getElementById('bellBadge');if(!b||!ME)return;
  const n=unreadCount();
  if(n>0){b.textContent=n>9?'9+':n;b.classList.remove('hidden');}
  else b.classList.add('hidden');
}
function openNotifications(){
  const list=(DB.notifications||[]).slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
  const lr=lastRead();
  // 変数名を ic にすると同名のアイコン関数を隠してしまうので nic にしている
  const rows=list.length?list.map(n=>{const nic=NOTI_IC[n.type]||{e:'bell',bg:'var(--chip)',fg:'var(--chip-ink)'};
    return `<div class="noti ${n.at>lr?'unread':''}">
      <span class="nic" style="background:${nic.bg};color:${nic.fg}">${ic(nic.e)}</span>
      <span><span class="nt">${esc(n.msg)}</span><br><span class="ns">${esc(n.type)} ・ ${fmtRel(n.at)}</span></span>
    </div>`;}).join(''):`<div class="empty" style="padding:26px"><div class="ei">${ic('bell')}</div><p>通知はまだありません。</p></div>`;
  openSheet(`<h3>通知</h3>
    <p class="page-sub">面談・イベントに関するアプリ内通知です。</p>
    <div class="card"><div class="cb" style="padding:4px 12px">${rows}</div></div>`);
  // 開いたら既読に
  const map=getNotiRead();map[ME.id]=nowISO();localStorage.setItem(NOTI_READ_KEY,JSON.stringify(map));
  updateBell();
}

    <button class="btn pri block" style="margin-top:18px" onclick="saveInternCard('${u.id}')">保存する</button>`);
}

async function saveInternCard(id){
  const staff_id=document.getElementById('icStaff').value||null;
  const place=document.getElementById('icPlace').value||null;
  const err=document.getElementById('icErr');
  err.classList.remove('show');
  const before=findUser(id);
  const staffChanged=staff_id!==(before?before.staff_id||null:null);

  if(staffChanged){
    try{
      const res=await api(`/api/staff/interns/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify({staff_id})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok){err.textContent=data.error||'変更に失敗しました';err.classList.add('show');return;}
    }catch(e){err.textContent='通信に失敗しました。時間をおいて再度お試しください。';err.classList.add('show');return;}
  }
  if(place!==(getProfile(id).internship_id||null)){
    await mutate(db=>{profileOf(db,id).internship_id=place;});
  }
  closeSheet();
  // 担当が変わるとユーザー一覧の中身も変わるので、サーバーから取り直す
  if(staffChanged)await refreshUsersAfterAdminChange();
  render();
  toast(staffChanged&&staff_id!==ME.id?'担当を引き継ぎました':'保存しました');
}

   左メニュー下の自分の名前・アイコンを押すと開く。
   ニックネームと所属支部は、初回設定と同じ /api/auth/complete-profile で

   アイコンの色は見た目だけの設定なので、DB.profiles に置いている。
   ========================================================= */
/* アイコンの背景に使える色。文字が読めるよう、どれも淡い色にしている */
const AVATAR_COLORS=[
  {v:'brand', c:'var(--brand-soft)', n:'既定'},
  {v:'blue',  c:'#dbeafe', n:'ブルー'},
  {v:'green', c:'#d7f5e3', n:'グリーン'},
  {v:'purple',c:'#e9e0fd', n:'パープル'},
  {v:'pink',  c:'#fcdfec', n:'ピンク'},
  {v:'orange',c:'#fde8cf', n:'オレンジ'},
  {v:'gray',  c:'#e3e8ee', n:'グレー'},
];
function avatarColor(userId){
  const v=getProfile(userId).avatar_color;
  return AVATAR_COLORS.find(c=>c.v===v)||AVATAR_COLORS[0];
}
function avatarBg(userId){return avatarColor(userId).c;}
/* Googleでログインした人は写真を持っていることがあるので、あれば使う。
   読み込めなかったときは頭文字に戻す（onerror） */
function avatarInner(u){
  if(u&&u.avatar_url){
    return `<img src="${esc(u.avatar_url)}" alt="" referrerpolicy="no-referrer"
      style="width:100%;height:100%;object-fit:cover"
      onerror="this.replaceWith(document.createTextNode('${esc(initials(u.nickname))}'))">`;
  }
  return esc(initials(u?u.nickname:''));
}

/* 支部を自分で変えられるのはスタッフ以上。
   インターン生の支部は担当スタッフと同じでなければならず（担当は同支部の人しか
   選べない）、本人が動かすと担当と食い違ってしまうため。
   サーバー側でも同じ判定をしている（/api/auth/complete-profile） */
function canChangeMyBranch(u){u=u||ME;return !!u&&u.role!=='intern';}

/* プロフィールの下に並べる「ほかの設定」。

/* 1行ぶんの見た目。右端はふつう「＞」だが、テーマのように
   別画面へ行かず値が変わるだけのものは、そこに現在値を出す */
function profileRow(icon,label,act,right){

      <span class="av" style="border-radius:10px;background:var(--brand-soft);color:var(--brand-d);font-size:18px">${ic(icon)}</span>

function profileLinks(){

  return [
    ME.role==='intern'?['workplace','インターン先','openMyInternshipForm()']:null,

function profileHead(){

/* 色は押した瞬間に見た目へ反映する（保存は「保存する」を押したとき） */
let PROF_COLOR=null;
function pickAvatarColor(v){
  PROF_COLOR=v;
  document.querySelectorAll('.swatch').forEach(el=>el.classList.remove('on'));
  const c=AVATAR_COLORS.find(x=>x.v===v)||AVATAR_COLORS[0];
  const btn=[...document.querySelectorAll('.swatch')].find(el=>el.style.background===c.c||el.title===c.n);
  if(btn)btn.classList.add('on');
  const av=document.getElementById('profAv');
  if(av)av.style.background=c.c;
}

async function saveMyProfile(){
  const nickname=document.getElementById('profNick').value.trim();
  const sel=document.getElementById('profBranch');
  // インターン生は支部の欄が出ないので、今の支部をそのまま送る
  const branch_id=sel?sel.value:ME.branch_id;
  const err=document.getElementById('profErr');
  err.classList.remove('show');
  if(!nickname){err.textContent='名前を入力してください';err.classList.add('show');return;}
  if(!branch_id){err.textContent='所属支部を選択してください';err.classList.add('show');return;}

  // 部署は画面が閉じる前に控えておく（サーバーの応答を待つ間に消えるため）
  const deptEls=document.querySelectorAll('input[name=profDept]');
  const departments=deptEls.length?[...deptEls].filter(c=>c.checked).map(c=>c.value):null;

  try{
    const res=await api('/api/auth/complete-profile',{method:'POST',body:JSON.stringify({nickname,branch_id})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){err.textContent=data.error||'保存に失敗しました';err.classList.add('show');return;}
    if(data.user)ME=data.user;
  }catch(e){err.textContent='通信に失敗しました。時間をおいて再度お試しください。';err.classList.add('show');return;}

  // 部署とアイコンの色はDB側に持っているので、まとめて1回で保存する
  const colorChanged=PROF_COLOR&&PROF_COLOR!==avatarColor(ME.id).v;
  const deptChanged=departments&&departments.join()!==getDepts(ME.id).join();
  if(colorChanged||deptChanged){
    await mutate(db=>{
      const p=profileOf(db,ME.id);
      if(colorChanged)p.avatar_color=PROF_COLOR;
      if(deptChanged)p.departments=departments;
    });
  }
  PROF_COLOR=null;
  renderChip();render();
  openMyProfile();          // 保存したら、見るだけの画面に戻る
  toast('プロフィールを保存しました');
}

/* =========================================================
   所属部署・インターン先
   ---------------------------------------------------------
   ユーザー表はサーバー側の正規テーブルなので、支部やニックネームと違い
   自由に列を足せない。所属部署とインターン先は「あとから足した付加情報」
   なので、DB.profiles（ユーザーID→情報）に持たせている。
   DB.availability が同じ形なので、作りを揃えた。
   ========================================================= */
const DEPARTMENTS=['事務局','プログラム','人財開発','クライアント','コンシューマー',
  'コンテスト','デジマ','プロモーション','アライアンス'];

function getProfile(userId){return (DB.profiles&&DB.profiles[userId])||{};}
function getDepts(userId){const d=getProfile(userId).departments;return Array.isArray(d)?d:[];}
/* ホームのタイルに出す短い説明 */
function deptLabel(userId){
  const d=getDepts(userId);
  if(!d.length)return 'まだ設定していません';
  return d.length<=2?d.join('・'):`${d[0]}ほか${d.length-1}件`;
}
/* 変更対象を db から引き直せるようにしておく（mutateのやり直しに備える） */
function profileOf(db,userId){
  db.profiles=db.profiles||{};
  db.profiles[userId]=db.profiles[userId]||{};
  return db.profiles[userId];
}

/* ---------- 所属部署の設定（スタッフ・支部管理者。複数選べる） ---------- */

}
async function saveMyDepartments(){
  const departments=[...document.querySelectorAll('input[name=deptChk]:checked')].map(c=>c.value);
  const ok=await mutate(db=>{profileOf(db,ME.id).departments=departments;});

/* ---------- インターン先マスタ ---------- */
function branchInternships(){
  return (DB.internships||[]).filter(p=>p.branch_id===ME.branch_id)

function findInternship(id){return (DB.internships||[]).find(p=>p.id===id)||null;}

function internsAt(internshipId){
  return DB.users.filter(u=>u.role==='intern'&&u.branch_id===ME.branch_id

/* 支部のスタッフ全員が追加・編集できる。同じ名前が増えると宛先選びで迷うため、
   登録時に既存と突き合わせて注意を出す */
function openInternshipMaster(){

    <button class="btn pri block" style="margin-top:16px" onclick="openInternshipForm()">＋ インターン先を追加</button>`);

function openInternshipForm(id){
  const p=id?findInternship(id):null;
  openSheet(`<h3>${p?'インターン先を編集':'インターン先を追加'}</h3>
    <label class="fl">インターン先の名前<span class="req">*</span></label>
    <input id="ipName" autocomplete="off" placeholder="例）○○議員事務所" value="${p?esc(p.name):''}">
    <div class="field-err" id="ipErr"></div>
    <div class="hint" style="margin-top:12px">${ic('bulb')}<span>支部のみんなで使う一覧です。略さず、正式な名前で登録すると探しやすくなります。</span></div>
    <button class="btn pri block" style="margin-top:18px" onclick="saveInternship(${p?`'${p.id}'`:'null'})">保存する</button>
    ${p?`<button class="btn block" style="margin-top:10px" onclick="deleteInternship('${p.id}')">この インターン先を削除</button>`:''}
    <button class="btn block" style="margin-top:10px" onclick="openInternshipMaster()">${ic('back')}一覧へ戻る</button>`);
}
async function saveInternship(id){
  const name=document.getElementById('ipName').value.trim();
  const err=document.getElementById('ipErr');
  err.classList.remove('show');
  if(!name){err.textContent='インターン先の名前を入力してください';err.classList.add('show');return;}
  // 同じ名前が二重にできると、宛先を選ぶときにどちらか分からなくなる
  const dup=branchInternships().find(p=>p.id!==id&&p.name===name);
  if(dup){err.textContent='同じ名前がすでに登録されています';err.classList.add('show');return;}
  const ok=await mutate(db=>{
    db.internships=db.internships||[];
    if(id){
      const p=db.internships.find(x=>x.id===id);
      if(p)p.name=name;
    }else{
      db.internships.push({id:'ip_'+uid(),name,branch_id:ME.branch_id,created_by:ME.id,created_at:nowISO()});
    }
  });
  if(!ok)return;
  openInternshipMaster();render();
  toast(id?'インターン先を更新しました':'インターン先を追加しました');
}
async function deleteInternship(id){
  const p=findInternship(id);
  const n=internsAt(id).length;
  // 誰かが登録したままだと、その人のインターン先が行方不明になる
  if(n){toast(`${n}名が登録中のため削除できません。先に登録を変えてください`);return;}
  if(!await confirmSheet('インターン先を削除',`「${p?p.name:''}」を削除します。よろしいですか？`,'削除する'))return;
  const ok=await mutate(db=>{
    db.internships=(db.internships||[]).filter(x=>x.id!==id);
  });
  if(!ok)return;
  openInternshipMaster();render();
  toast('インターン先を削除しました');
}
