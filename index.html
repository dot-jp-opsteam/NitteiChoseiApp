      <p class="page-sub">スタッフから届いた連絡・依頼です。</p>
      ${unread?`<div class="hint">${ic('megaphone')}<span><b>${unread}件</b> がまだ未確認です。</span></div>`:''}
      ${requestList(inbox,'inbox')}`;
  }

  const sent=sentRequests();
  const tabs=`<div class="seg" style="margin-bottom:14px">
    <label><input type="radio" name="reqTab" ${REQTAB==='inbox'?'checked':''} onchange="setReqTab('inbox')">
      <span class="segb">受けた依頼${unread?`（${unread}）`:''}</span></label>
    <label><input type="radio" name="reqTab" ${REQTAB==='sent'?'checked':''} onchange="setReqTab('sent')">
      <span class="segb">送った依頼</span></label>
  </div>`;
  return `<h1 class="page">依頼</h1>
    <p class="page-sub">${branchName(ME.branch_id)}のスタッフ・インターン生に、連絡や出欠確認を出せます。</p>
    <div class="btn-row" style="margin-bottom:16px">
      <button class="btn pri" style="flex:1" onclick="openRequestForm()">＋ 依頼を出す</button>
      <button class="btn pri" style="flex:1" onclick="openRequestForm('attend')">＋ 出欠を確認する</button>
    </div>
    ${tabs}
    ${REQTAB==='inbox'?requestList(inbox,'inbox'):requestList(sent,'sent')}`;
}

function requestList(list,kind){
  if(!list.length){
    return `<div class="empty" style="padding:30px"><div class="ei">${ic('megaphone')}</div>
      <p>${kind==='inbox'?'届いている依頼はありません。':'まだ依頼を出していません。'}</p></div>`;
  }
  const rows=list.map(r=>{
    const total=(r.recipient_ids||[]).length;
    const done=(r.read_by||[]).length;
    const sender=findUser(r.sender_id);
    const att=isAttend(r);
    // 出欠確認は「確認したか」ではなく「答えたか」「決まったか」で状態を出す
    const answered=att?(r.responses||[]).some(a=>a.user_id===ME.id):false;
    const numAns=att?attendResponders(r).length:0;
    const sub=att
      ? (kind==='inbox'
        ? `${esc(sender?sender.nickname:'—')}さん ・ 候補${(r.options||[]).length}件 ・ ${fmtRel(r.created_at)}`
        : `${esc(r.target_label||'')} ・ ${numAns}/${total}人が回答 ・ ${fmtRel(r.created_at)}`)
      : (kind==='inbox'
        ? `${esc(sender?sender.nickname:'—')}さん ・ ${fmtRel(r.created_at)}`
        : `${esc(r.target_label||'')} ・ ${done}/${total}人が確認 ・ ${fmtRel(r.created_at)}`);
    let badge='';
    if(att&&r.confirmed)badge='<span class="tag ok">確定</span>';
    else if(att&&kind==='inbox'&&!answered)badge='<span class="tag" style="background:var(--brand-soft);color:var(--brand-d)">未回答</span>';
    else if(!att&&kind==='inbox'&&!hasConfirmed(r,ME.id))badge='<span class="tag" style="background:var(--brand-soft);color:var(--brand-d)">未確認</span>';
    return `<div class="row" style="cursor:pointer" onclick="openRequestDetail('${r.id}')">
      <span class="av ${att?'a2':''}" style="border-radius:10px;${att?'':'background:var(--brand-soft);color:var(--brand-d);'}font-size:18px">${ic(att?'calendar-check':'megaphone')}</span>
      <span class="rmain"><span class="rt">${esc(r.subject)} ${badge}</span>
      <span class="rs">${sub}</span></span>
      <span class="tile-arrow">${ic('chevron')}</span></div>`;
  }).join('');
  return `<div class="card"><div class="rowlist">${rows}</div></div>`;
}

/* =========================================================
   出欠確認
   ---------------------------------------------------------
   依頼の一種として持つ。候補ごとに ○△× を集め、送った人が1つ選んで確定する。
   確定すると支部のカレンダーに予定が1件できる（サーバー側でまとめて行う）
   ========================================================= */
const ATT_MARK={ok:'○',may:'△',no:'×'};
function isAttend(r){return r&&r.kind==='attend';}
/* 候補ごとの集計。誰が何を答えたかも引ける形にして返す */
function attendTally(r){
  const byOpt=new Map();
  (r.options||[]).forEach(o=>byOpt.set(o.id,{ok:0,may:0,no:0,who:new Map()}));
  (r.responses||[]).forEach(a=>{
    const t=byOpt.get(a.option_id);
    if(!t||!ATT_MARK[a.response])return;
    t[a.response]++;
    t.who.set(a.user_id,a.response);
  });
  return byOpt;
}
/* 集計の対象になる人。あて先の全員を並べ、まだ答えていない人も出す。
   誰待ちなのかが分からないと催促できないため。
   あて先から外れたあとに答えが残っている人（部署の変更など）も落とさない */
function attendResponders(r){
  const ids=[...(r.recipient_ids||[])];
  (r.responses||[]).forEach(a=>{if(!ids.includes(a.user_id))ids.push(a.user_id);});
  return ids;
}
/* 1人でも答えた人。集計の「回答者◯名」に使う */
function attendAnswered(r){
  const ids=[];
  (r.responses||[]).forEach(a=>{if(!ids.includes(a.user_id))ids.push(a.user_id);});
  return ids;
}
/* ○がいちばん多い候補。同じ数のものが複数あれば、その全部を返す。
   誰も答えていないうちは何も返さない。全部が0で並ぶだけの状態で
   「最有力」と言われても意味がないため */
function attendBest(r,tally){
  let top=0;
  (r.options||[]).forEach(o=>{const t=tally.get(o.id);if(t&&t.ok>top)top=t.ok;});
  if(!top)return new Set();
  return new Set((r.options||[]).filter(o=>tally.get(o.id).ok===top).map(o=>o.id));
}
/* 出欠確認を開くURL。ログインしていればそのまま回答画面に飛ぶ */
function attendUrl(id){
  return `${location.origin}${location.pathname}?req=${encodeURIComponent(id)}`;
}
async function copyAttendUrl(id){
  const url=attendUrl(id);
  try{
    await navigator.clipboard.writeText(url);
    toast('URLをコピーしました');
  }catch(e){
    // 権限が下りない環境（古い端末など）では選択状態にして手でコピーしてもらう
    const el=document.getElementById('attUrl');
    if(el){el.focus();el.select();}
    toast('コピーできませんでした。選択された文字をコピーしてください');
  }
}

function openAttendDetail(id){
  const r=allRequests().find(x=>x.id===id);
  if(!r)return;
  const sender=findUser(r.sender_id);
  const mineToAnswer=(r.recipient_ids||[]).includes(ME.id);
  const isOwner=r.sender_id===ME.id||ME.role==='admin';
  const tally=attendTally(r);
  const responders=attendResponders(r);
  const answered=new Set(attendAnswered(r));
  const opts=r.options||[];
  const confirmedOpt=r.confirmed?opts.find(o=>o.id===r.confirmed):null;

  const best=attendBest(r,tally);

  /* 一覧。人を横に並べる表はやめた（十数人いると横に送られて日程と印を同時に見られない）。
     日程ごとの数だけを出し、誰が何を答えたかは行を押して掘る。
     確定ボタンは押しても回答状況を開かない（押し間違いで別の画面へ飛ばないように） */
  const rows=opts.map(o=>{
    const t=tally.get(o.id);
    const isConf=r.confirmed===o.id;
    const isBest=!r.confirmed&&best.has(o.id);
    const tag=isConf?'<span class="tag ok">確定</span>'
      :isBest?'<span class="tag ok">最有力</span>':'';
    return `<div class="atl ${isConf?'on':''} ${isBest?'best':''}"
      onclick="openAttendOption('${r.id}','${o.id}')">
      <span class="atl-d">${fmtSlot(o)}${tag}</span>
      ${['ok','may','no'].map(v=>`<span class="atl-c ${v} ${t[v]?'':'zero'}"
        >${ATT_MARK[v]}<b>${t[v]}</b></span>`).join('')}
      ${isOwner&&!r.confirmed?`<button class="btn sm pri"
        onclick="event.stopPropagation();confirmAttend('${r.id}','${o.id}')">この日で確定</button>`:''}
    </div>`;
  }).join('');

  /* 自分の回答。候補ごとに ○△× を1つ選ぶ。
     押すたびに通信すると候補の数だけ往復するので、選ぶのは画面上だけにして
     最後に「回答を送る」でまとめて送る */
  ATTANS={};
  (r.responses||[]).forEach(a=>{if(a.user_id===ME.id)ATTANS[a.option_id]=a.response;});
  const answerBlock=(mineToAnswer&&!r.confirmed)?`
    <div class="divider" style="margin:18px 0 14px"></div>
    <label class="fl">あなたの回答<span class="fl-sub">候補ごとに選んでください</span></label>
    <div class="attans" id="attans">${opts.map(o=>`
      <div class="attrow">
        <span class="atname">${fmtSlot(o)}</span>
        <span class="att3">${['ok','may','no'].map(v=>`
          <button type="button" class="attb v-${v} ${ATTANS[o.id]===v?'on':''}"
            data-op="${o.id}" data-v="${v}" onclick="pickAttend('${o.id}','${v}')">${ATT_MARK[v]}</button>`).join('')}</span>
      </div>`).join('')}</div>
    <div class="field-err" id="attErr"></div>
    <button class="btn pri block" style="margin-top:14px" id="attBtn" onclick="submitAttend('${r.id}')">回答を送る</button>`:'';

  /* URLは依頼を出した本人と管理者にだけ出す。回答するだけの人には要らない。
     このリンク自体はログインの力を持たない。開いた人は自分のアカウントでログインし、
     自動ログインが効いていればログイン画面を飛ばして回答画面へ直行する */
  const urlBlock=isOwner?`
    <label class="fl" style="margin-top:14px">出欠URL
      <span class="fl-sub">このリンクを配ると、支部のスタッフがそのまま回答できます</span></label>
    <div class="urlrow">
      <input id="attUrl" readonly value="${esc(attendUrl(r.id))}" onclick="this.select()">
      <button class="btn sm" onclick="copyAttendUrl('${r.id}')">コピー</button>
    </div>`:'';

  openSheet(`<h3>${esc(r.subject)} <span class="tag" style="background:var(--brand-soft);color:var(--brand-d)">出欠</span></h3>
    <p class="page-sub" style="margin-top:0">${esc(sender?sender.nickname:'—')}さん ・ ${esc(r.target_label||'')}（${(r.recipient_ids||[]).length}名）</p>
    ${urlBlock}
    ${r.body?`<div style="white-space:pre-wrap;font-size:14px;line-height:1.7;margin-top:14px">${esc(r.body)}</div>`:''}
    ${confirmedOpt?`<div class="hint" style="margin-top:14px">${ic('check')}<span>
      <b>${fmtSlot(confirmedOpt)}</b> で確定しました。カレンダーに予定を追加しています。</span></div>`:''}
    <label class="fl" style="margin-top:18px">出欠集計
      <span class="fl-sub">日程を押すと、誰が何を答えたかが見られます</span></label>
    <p class="atsum">${responders.length}名中 <b>${answered.size}名</b>が回答${
      responders.length>answered.size?` ・ 未回答 ${responders.length-answered.size}名`:''}</p>
    <div class="atlist">${rows}</div>
    ${answerBlock}`);
}

/* 日程1件の回答状況。○△× ごとに名前を並べ、まだ答えていない人は下にまとめる。
   シートを重ねずに中身だけ入れ替える。重ねると閉じたときにどこへ戻るのか分からなくなるため */
function openAttendOption(reqId,optId){
  const r=allRequests().find(x=>x.id===reqId);
  if(!r)return;
  const o=(r.options||[]).find(x=>x.id===optId);
  if(!o)return;
  const who=attendTally(r).get(optId).who;
  const ids=attendResponders(r);
  const groups=[
    ['ok', ATT_MARK.ok,  ids.filter(u=>who.get(u)==='ok')],
    ['may',ATT_MARK.may, ids.filter(u=>who.get(u)==='may')],
    ['no', ATT_MARK.no,  ids.filter(u=>who.get(u)==='no')],
    ['none','まだ回答していない', ids.filter(u=>!who.get(u))],
  ];
  // 0人の区分は見出しごと出さない
  const blocks=groups.filter(g=>g[2].length).map(([v,ttl,list])=>`
    <div class="atgrp ${v==='none'?'none':''}">
      <div class="atgh"><span class="atgm ${v}">${ttl}</span><b>${list.length}名</b></div>
      <div class="atppl">${list.map(attendPerson).join('')}</div>
    </div>`).join('');
  openSheet(`<button type="button" class="atback"
      onclick="openAttendDetail('${r.id}')">${ic('back')}出欠集計へ戻る</button>
    <h3>${fmtSlot(o)} の回答状況</h3>
    <p class="page-sub" style="margin-top:0">${esc(r.subject)}</p>
    ${blocks}`);
}
/* 名前の札。Googleの写真を持っている人はそれを出す。
   丸の色は人ごとに変えず、一覧の行と同じ地の色にそろえた。
   ここで見たいのは「誰が答えたか」で、色は名前を読む邪魔になるため */
function attendPerson(uid){
  const u=findUser(uid);
  return `<span class="atp"><span class="av">${avatarInner(u)}</span>
    <span>${esc((u||{}).nickname||'—')}</span></span>`;
}
/* 候補1件の見せ方。「9/12(土) 19:00〜21:00」 */
function fmtSlot(o){
  const s=new Date(o.start),e=o.end?new Date(o.end):null;
  return `${s.getMonth()+1}/${s.getDate()}(${WD_JP[s.getDay()]}) ${hm(s)}${e?'〜'+hm(e):''}`;
}
let ATTANS={};   // 画面上で選んでいる自分の回答 {候補id:'ok'|'may'|'no'}
function pickAttend(optId,v){
  ATTANS[optId]=v;
  // 押した行のボタンだけ塗り替える。画面ごと作り直すと一瞬暗く沈むため
  document.querySelectorAll(`#attans .attb[data-op="${optId}"]`).forEach(b=>{
    b.classList.toggle('on',b.dataset.v===v);
  });
}
async function submitAttend(id){
  const err=document.getElementById('attErr');
  const btn=document.getElementById('attBtn');
  err.classList.remove('show');
  const r=allRequests().find(x=>x.id===id);
  const opts=(r&&r.options)||[];
  const answers=opts.filter(o=>ATTANS[o.id]).map(o=>({option_id:o.id,response:ATTANS[o.id]}));
  if(answers.length<opts.length){
    err.textContent='すべての候補に答えてください';err.classList.add('show');return;
  }
  btn.disabled=true;btn.textContent='送信中…';
  try{
    const res=await api(`/api/requests/${encodeURIComponent(id)}/response`,
      {method:'PUT',body:JSON.stringify({answers})});
    if(!res.ok){
      const d=await res.json().catch(()=>({}));
      err.textContent=d.error||'回答を保存できませんでした';err.classList.add('show');
      btn.disabled=false;btn.textContent='回答を送る';return;
    }
    const {saved}=await res.json();
    // 手元の一覧も同じ形に合わせる（すぐ集計に反映するため）
    r.responses=(r.responses||[]).filter(a=>a.user_id!==ME.id).concat(saved);
    sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
    setSaveError(null);
  }catch(e){
    console.warn('出欠の回答に失敗しました',e);
    err.textContent='送信できませんでした。通信状況をご確認ください';err.classList.add('show');
    btn.disabled=false;btn.textContent='回答を送る';return;
  }
  closeSheet();render();
  toast('回答を送りました');
  openAttendDetail(id);   // 集計を見せる
}
async function confirmAttend(reqId,optId){
  const r=allRequests().find(x=>x.id===reqId);
  const o=(r.options||[]).find(x=>x.id===optId);
  if(!o)return;
  if(!await confirmSheet('この日で確定する',
    `${fmtSlot(o)} で確定します。カレンダーに予定が追加され、回答した方へお知らせが届きます。`,'確定する'))return;
  try{
    const res=await api(`/api/requests/${encodeURIComponent(reqId)}/confirm`,
      {method:'POST',body:JSON.stringify({option_id:optId})});
    if(!res.ok){
      const d=await res.json().catch(()=>({}));
      setSaveError(d.error||'確定できませんでした。');return;
    }
    const {event,notification}=await res.json();
    r.confirmed=optId;
    if(event){r.event_id=event.id;DB.events=[...(DB.events||[]),event];}
    if(notification)DB.notifications=[...(DB.notifications||[]),notification];
    sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
    setSaveError(null);
  }catch(e){
    console.warn('日程の確定に失敗しました',e);
    setSaveError('確定できていません。通信状況をご確認ください。');return;
  }
  closeSheet();updateBell();render();
  toast('日程を確定しました');
}

function openRequestDetail(id){
  const r=allRequests().find(x=>x.id===id);
  if(!r)return;
  if(isAttend(r))return openAttendDetail(id);
  const sender=findUser(r.sender_id);
  const mine=(r.recipient_ids||[]).includes(ME.id);
  const done=hasConfirmed(r,ME.id);

  // 送った本人には、誰が確認したかを名前で見せる
  let status='';
  if(r.sender_id===ME.id){
    const names=(r.recipient_ids||[]).map(uid2=>{
      const u=findUser(uid2);
      const ok=hasConfirmed(r,uid2);
      return `<span class="slot" style="${ok?'':'opacity:.5'}">${ok?'✓ ':''}${esc(u?u.nickname:'—')}</span>`;
    }).join('');
    status=`<div class="divider"></div>
      <p class="fl" style="margin-top:14px">確認した人（${(r.read_by||[]).length}/${(r.recipient_ids||[]).length}）</p>
      <div class="slots" style="margin-top:8px">${names}</div>`;
  }

  openSheet(`<h3>${esc(r.subject)}</h3>
    <dl class="kv" style="margin:12px 0">
      <dt>差出人</dt><dd>${esc(sender?sender.nickname:'—')}</dd>
      <dt>あて先</dt><dd>${esc(r.target_label||'—')}（${(r.recipient_ids||[]).length}名）</dd>
      <dt>送信日時</dt><dd>${fmtDT(r.created_at)}</dd>
    </dl>
    <div class="divider"></div>
    <div style="white-space:pre-wrap;font-size:14px;line-height:1.7;margin-top:14px">${esc(r.body)}</div>
    ${mine?(done
      ? `<div class="hint" style="margin-top:18px">${ic('check')}<span>確認済みとしてお伝えしています。</span></div>`
      : `<button class="btn pri block" style="margin-top:18px" onclick="confirmRequest('${r.id}')">確認しました</button>`):''}
    ${status}`);
}

/* 「確認しました」は専用APIで送る。ここは支部の全員に配った依頼を
   全員が押す場所なので、DB全体を保存し直す方式では耐えられない。
   サーバー側は1人1行を足すだけなので、何人が同時に押しても衝突しない */
async function confirmRequest(id){
  try{
    const res=await api(`/api/requests/${encodeURIComponent(id)}/read`,{method:'POST'});
    if(!res.ok){
      const d=await res.json().catch(()=>({}));
      setSaveError(d.error||'確認を保存できませんでした。');
      return;
    }
    const {read}=await res.json();
    const r=(DB.requests||[]).find(x=>x.id===id);
    if(r){
      r.read_by=r.read_by||[];
      if(!r.read_by.some(x=>x.user_id===ME.id))r.read_by.push(read);
    }
    sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
    setSaveError(null);
  }catch(e){
    console.warn('確認の保存に失敗しました',e);
    setSaveError('確認を保存できていません。通信状況をご確認ください。');
    return;
  }
  closeSheet();render();
  toast('確認しました');
}

/* ---------- 依頼を出す ---------- */
let REQFORM=null; // {mode, picked:Set相当の配列}

/* 宛先の選び方。mode ごとに「展開して選ぶもの」が変わる。
   インターン生あての3つ（all_intern / pick_intern / by_place）は外した。
   インターン生はアカウントを持たなくなり、依頼を受け取る手段が無いため。
   受け取れない相手に送れてしまうほうが事故になる。
   by_place（インターン先で選ぶ）は 2026-08-05 に処理ごと取り除いた。
   ※ 残る2つの mode を処理する側のコードは、過去の依頼を読むために残してある */
const REQ_MODES=[
  {id:'all_staff',   label:'支部の全スタッフ'},
  {id:'pick_staff',  label:'スタッフを選ぶ'},
  {id:'by_dept',     label:'部署で選ぶ'},
];

function openRequestForm(kind){
  REQFORM={mode:'all_staff',picked:[],kind:kind==='attend'?'attend':'normal',opts:[]};
  if(REQFORM.kind==='attend')addReqOption();   // 中で描き直すのでここでは呼ばない
  else renderRequestForm();
}
function setReqMode(mode){
  REQFORM.mode=mode;
  REQFORM.picked=[];   // 選び方を変えたら選択はやり直し
  renderRequestForm(true);
}
function toggleReqPick(value){
  const i=REQFORM.picked.indexOf(value);
  if(i>=0)REQFORM.picked.splice(i,1);
  else REQFORM.picked.push(value);
  renderRequestForm(true);
}

function branchStaff(){
  return DB.users.filter(u=>(u.role==='staff'||u.role==='branch_admin')&&u.branch_id===ME.branch_id)
    .sort((a,b)=>String(a.nickname).localeCompare(String(b.nickname),'ja'));
}
function branchInterns(){
  return DB.users.filter(u=>u.role==='intern'&&u.branch_id===ME.branch_id)
    .sort((a,b)=>String(a.nickname).localeCompare(String(b.nickname),'ja'));
}

/* 選ばれている条件を、実際の宛先（ユーザーIDの配列）と表示名に変える */
function resolveRecipients(){
  const m=REQFORM.mode, picked=REQFORM.picked;
  if(m==='all_staff'){
    const list=branchStaff().filter(u=>u.id!==ME.id);  // 自分あては含めない
    return {ids:list.map(u=>u.id),label:'支部の全スタッフ'};
  }
  if(m==='all_intern'){
    const list=branchInterns();
    return {ids:list.map(u=>u.id),label:'支部の全インターン生'};
  }
  if(m==='pick_staff'||m==='pick_intern'){
    const ids=picked.filter(id=>id!==ME.id);
    const names=ids.map(id=>{const u=findUser(id);return u?u.nickname:'—';});
    return {ids,label:names.join('、')||'（未選択）'};
  }
  if(m==='by_dept'){
    const ids=[],labels=[];
    picked.forEach(d=>{
      labels.push(d);
      branchStaff().forEach(u=>{
        if(u.id!==ME.id&&getDepts(u.id).includes(d)&&!ids.includes(u.id))ids.push(u.id);
      });
    });
    return {ids,label:labels.length?labels.join('、')+'（部署）':'（未選択）'};
  }
  return {ids:[],label:'（未選択）'};
}

/* 選び方に応じた「展開部分」。
   keepText=true のときは、件名・本文に打ちかけの文字を残したまま描き直す */
function reqPickerHTML(){
  const m=REQFORM.mode, picked=REQFORM.picked;
  const chip=(value,label,sub)=>`<button type="button" class="pickchip ${picked.includes(value)?'on':''}"
      onclick="toggleReqPick('${value}')">
      <span>${esc(label)}</span>${sub?`<span class="picksub">${esc(sub)}</span>`:''}</button>`;

  if(m==='all_staff'){
    const n=branchStaff().filter(u=>u.id!==ME.id).length;
    return `<div class="hint">${ic('users')}<span>自分を除いた <b>${n}名</b> のスタッフに届きます。</span></div>`;
  }
  if(m==='all_intern'){
    return `<div class="hint">${ic('users')}<span>支部の <b>${branchInterns().length}名</b> のインターン生に届きます。</span></div>`;
  }
  if(m==='pick_staff'){
    const list=branchStaff().filter(u=>u.id!==ME.id);
    if(!list.length)return `<div class="empty" style="padding:20px"><p>ほかにスタッフがいません。</p></div>`;
    return `<div class="picklist">${list.map(u=>chip(u.id,u.nickname,deptLabel(u.id)==='まだ設定していません'?'':deptLabel(u.id))).join('')}</div>`;
  }
  if(m==='pick_intern'){
    const list=branchInterns();
    if(!list.length)return `<div class="empty" style="padding:20px"><p>インターン生がいません。</p></div>`;
    return `<div class="picklist">${list.map(u=>chip(u.id,u.nickname,'')).join('')}</div>`;
  }
  if(m==='by_dept'){
    return `<div class="picklist">${DEPARTMENTS.map(d=>{
      const n=branchStaff().filter(u=>u.id!==ME.id&&getDepts(u.id).includes(d)).length;
      return chip(d,d,`${n}名`);
    }).join('')}</div>`;
  }
  return '';
}

/* ふつうの依頼と出欠確認の切り替え。候補の日時は REQFORM.opts に貯める */
function setReqKind(kind){
  REQFORM.kind=kind;
  if(kind==='attend'&&!REQFORM.opts.length)addReqOption();
  renderRequestForm(true);
}
/* 候補を1件足す。前の候補があればその翌週の同じ時間を初期値にする。
   毎週の定例を並べることが多いので、そのほうが打ち直しが少ない */
function addReqOption(){
  const last=REQFORM.opts[REQFORM.opts.length-1];
  if(last){
    const d=new Date(last.date+'T00:00');
    d.setDate(d.getDate()+7);
    REQFORM.opts.push({date:ymd(d),t1:last.t1,t2:last.t2});
  }else{
    const d=new Date();d.setDate(d.getDate()+7);
    REQFORM.opts.push({date:ymd(d),t1:'19:00',t2:'21:00'});
  }
  renderRequestForm(true);
}
function removeReqOption(i){
  REQFORM.opts.splice(i,1);
  renderRequestForm(true);
}
/* 入力欄の値をその場で控える。描き直しても打った内容が消えないようにするため */
function syncReqOptions(){
  REQFORM.opts.forEach((o,i)=>{
    const d=document.getElementById('ro_d'+i), a=document.getElementById('ro_a'+i), b=document.getElementById('ro_b'+i);
    if(d)o.date=d.value;
    if(a)o.t1=a.value;
    if(b)o.t2=b.value;
  });
}
function reqOptionsHTML(){
  if(REQFORM.kind!=='attend')return '';
  const rows=REQFORM.opts.map((o,i)=>`<div class="optrow">
      <input type="date" id="ro_d${i}" value="${o.date}" onchange="syncReqOptions()">
      <div class="timerange">
        <select id="ro_a${i}" onchange="syncReqOptions()">${timeOpts(o.t1)}</select>
        <span class="tr-sep">〜</span>
        <select id="ro_b${i}" onchange="syncReqOptions()">${timeOpts(o.t2)}</select>
      </div>
      <button type="button" class="optx" onclick="syncReqOptions();removeReqOption(${i})"
        ${REQFORM.opts.length<=1?'disabled':''} aria-label="この候補を消す">×</button>
    </div>`).join('');
  return `<label class="fl" style="margin-top:16px">候補の日時<span class="req">*</span>
      <span class="fl-sub">答える人は候補ごとに ○△× を選びます</span></label>
    <div class="optlist">${rows}</div>
    <button type="button" class="btn ghost sm" style="margin-top:8px" onclick="syncReqOptions();addReqOption()">
      ＋ 候補を追加</button>`;
}

function renderRequestForm(keepText){
  // 描き直しの前に、打ちかけの件名・本文を控えておく
  const prevSubj=keepText?(document.getElementById('reqSubj')||{}).value||'':'';
  const prevBody=keepText?(document.getElementById('reqBody')||{}).value||'':'';
  const {ids,label}=resolveRecipients();
  const attend=REQFORM.kind==='attend';

  const modeBtns=REQ_MODES.map(o=>`<button type="button" class="modechip ${REQFORM.mode===o.id?'on':''}"
    onclick="setReqMode('${o.id}')">${o.label}</button>`).join('');

  openSheet(`<h3>${attend?'出欠を確認する':'依頼を出す'}</h3>
    <p class="page-sub" style="margin-top:0">${branchName(ME.branch_id)}の中に、${attend?'日程の候補を出して出欠を集めます。':'連絡や依頼を送ります。'}</p>

    <label class="fl">送るもの</label>
    <div class="modechips">
      <button type="button" class="modechip ${attend?'':'on'}" onclick="setReqKind('normal')">連絡・依頼</button>
      <button type="button" class="modechip ${attend?'on':''}" onclick="setReqKind('attend')">出欠確認</button>
    </div>

    <label class="fl" style="margin-top:16px">あて先の選び方</label>
    <div class="modechips">${modeBtns}</div>
    <div style="margin-top:12px">${reqPickerHTML()}</div>

    <div class="hint" style="margin-top:12px">${ic('send')}<span>いまのあて先：<b>${esc(label)}</b>（${ids.length}名）</span></div>

    <label class="fl" style="margin-top:16px">件名<span class="req">*</span></label>
    <input id="reqSubj" autocomplete="off" placeholder="${attend?'例）第3四半期 チーム懇親会':'例）来週の定例、資料の準備をお願いします'}" value="${esc(prevSubj)}">
    <label class="fl">本文</label>
    <textarea id="reqBody" rows="${attend?4:6}" placeholder="${attend?'集まる場所や持ち物など、伝えたいことがあれば書いてください。':'お願いしたい内容を書いてください。'}">${esc(prevBody)}</textarea>
    ${reqOptionsHTML()}
    <div class="field-err" id="reqErr"></div>

    <button class="btn pri block" style="margin-top:18px" id="reqBtn" onclick="submitRequest()">${attend?'出欠確認を送る':'この内容で送る'}</button>`);
}

async function submitRequest(){
  const subject=document.getElementById('reqSubj').value.trim();
  const body=document.getElementById('reqBody').value.trim();
  const err=document.getElementById('reqErr');
  const btn=document.getElementById('reqBtn');
  err.classList.remove('show');

  const {ids,label}=resolveRecipients();
  if(!ids.length){err.textContent='あて先を選んでください';err.classList.add('show');return;}
  if(!subject){err.textContent='件名を入力してください';err.classList.add('show');return;}

  const attend=REQFORM.kind==='attend';
  let options=[];
  if(attend){
    syncReqOptions();
    if(!REQFORM.opts.length){err.textContent='候補の日時を1件以上追加してください';err.classList.add('show');return;}
    for(const o of REQFORM.opts){
      if(!o.date){err.textContent='候補の日付を入れてください';err.classList.add('show');return;}
      if(o.t2<=o.t1){err.textContent='終わりの時刻は始まりより後にしてください';err.classList.add('show');return;}
    }
    // 同じ日時が2つあると集計の見分けがつかないので弾く
    const seen=new Set();
    for(const o of REQFORM.opts){
      const key=o.date+' '+o.t1;
      if(seen.has(key)){err.textContent='同じ日時の候補が重なっています';err.classList.add('show');return;}
      seen.add(key);
    }
    options=REQFORM.opts.map(o=>({
      start:new Date(`${o.date}T${o.t1}`).toISOString(),
      end:new Date(`${o.date}T${o.t2}`).toISOString(),
    }));
  }

  btn.disabled=true;btn.textContent='送信中…';
  /* 依頼は専用APIで作る。あて先は送った時点で固定される（上のコメント参照）。
     受け取った人への通知はサーバー側で一緒に積まれる */
  try{
    const res=await api('/api/requests',{method:'POST',
      body:JSON.stringify({subject,body,target_label:label,recipient_ids:ids,
        kind:attend?'attend':'normal',options})});
    if(!res.ok){
      const d=await res.json().catch(()=>({}));
      err.textContent=d.error||'送信できませんでした';err.classList.add('show');
      btn.disabled=false;btn.textContent=attend?'出欠確認を送る':'この内容で送る';
      return;
    }
    const {request,notification}=await res.json();
    DB.requests=[...(DB.requests||[]),request];
    // あて先への通知はサーバー側で一緒に積まれるので、手元の一覧にも反映する
    if(notification)DB.notifications=[...(DB.notifications||[]),notification];
    sessionStorage.setItem(DB_KEY,JSON.stringify(DB));
    setSaveError(null);
  }catch(e){
    console.warn('依頼の送信に失敗しました',e);
    err.textContent='送信できませんでした。通信状況をご確認ください';err.classList.add('show');
    btn.disabled=false;btn.textContent='この内容で送る';
    return;
  }
  REQFORM=null;REQTAB='sent';
  closeSheet();updateBell();render();
  toast(`${ids.length}名に送りました`);
}

/* =========================================================
   メール履歴の閲覧
   ========================================================= */
/* 送ったものと受け取ったものの両方を並べる。
   以前はスタッフに送信済みしか出しておらず、出欠確認のように
   「自分あてに届く記録」を受け取っても気づけなかった。
   管理者にはサーバーが全員分を返すので、当事者のものだけに絞る */
function openMailHistory(){
  const mine=(DB.emails||[]).filter(m=>m.sender_id===ME.id||m.receiver_id===ME.id);
  const list=mine.sort((a,b)=>new Date(b.sent_at||0)-new Date(a.sent_at||0));
  const rows=list.length?list.map(m=>{
    const got=m.receiver_id===ME.id;
    const other=findUser(got?m.sender_id:m.receiver_id);
    return `<div class="row" style="cursor:pointer" onclick="openMailDetail('${m.id}')">
      <span class="av" style="border-radius:10px;background:var(--brand-soft);color:var(--brand-d);font-size:18px">${ic('mail')}</span>
      <span class="rmain"><span class="rt">${esc(m.subject)}</span>
      <span class="rs"><span class="tag ${got?'ok':''}">${got?'受信':'送信'}</span>
        ${got?'差出人':'宛先'}：${esc(other?.nickname||'—')} ・ ${m.sent_at?fmtRel(m.sent_at):''}</span></span>
      <span class="tile-arrow">${ic('chevron')}</span></div>`;}).join('')
    :`<div class="empty" style="padding:26px"><div class="ei">${ic('mail')}</div><p>メールの記録はまだありません。</p></div>`;
  openSheet(`<h3>メール履歴</h3>
    <div class="hint">${ic('mail')}<span>面談の確定・不成立のお知らせはメールでも届きます。
      それ以外はアプリ内の記録のみです。</span></div>
    <div class="card" style="margin-top:10px"><div class="rowlist">${rows}</div></div>`);
}
function openMailDetail(id){
  const m=(DB.emails||[]).find(x=>x.id===id);if(!m)return;
  const from=findUser(m.sender_id),to=findUser(m.receiver_id);
  openSheet(`<h3>${esc(m.subject)}</h3>
    <dl class="kv" style="margin:12px 0">
      <dt>差出人</dt><dd>${esc(from?.nickname||'—')}</dd>
      <dt>宛先</dt><dd>${esc(to?.nickname||'—')}</dd>
      <dt>送信日時</dt><dd>${m.sent_at?fmtDT(m.sent_at):'—'}</dd>
      <dt>メール</dt><dd>${m.delivered?'実際に送信済み':'アプリ内の記録のみ'}</dd>
    </dl>
    <div class="divider"></div>
    <div style="white-space:pre-wrap;font-size:14px;line-height:1.7">${esc(m.body)}</div>
    <button class="btn block" style="margin-top:16px" onclick="openMailHistory()">${ic('back')}一覧へ戻る</button>`);
}

/* =========================================================
   BOOT
   ========================================================= */
/* 起動中の表示を消す。
   Renderの無料枠は15分アクセスが無いとスリープし、次のアクセスで起動に数十秒かかる。
   その間ずっと「読み込んでいます…」だけだと故障に見えるため、途中で文言を変える */
let _bootTimer=null;
function startBootMessageTimer(){
  _bootTimer=setTimeout(()=>{
    const el=document.getElementById('bootMsg');
    if(el)el.textContent='サーバーを起動しています…（初回は1分ほどかかることがあります）';
  },8000);
}
function hideBoot(){
  clearTimeout(_bootTimer);
  const el=document.getElementById('boot');
  if(el)el.remove();
}

/* Googleログインから戻ってきたトークンを受け取る。
   URLフラグメント（#以降）で渡されるためサーバーのアクセスログには残らない。
   受け取ったらすぐURLから消して、履歴やブックマークに残らないようにする */
function consumeTokenFromHash(){
  if(!location.hash.startsWith('#'))return null;
  const h=new URLSearchParams(location.hash.slice(1));
  const token=h.get('token');
  if(!token)return null;
  setToken(token,h.get('remember')==='1');
  const login=h.get('login');
  history.replaceState(null,'',location.pathname+location.search);
  return {login};
}

(async()=>{
  startBootMessageTimer();
  const params=new URLSearchParams(location.search);
  const isStaffPage=location.pathname==='/staff';
  const hashLogin=consumeTokenFromHash();
  // 「次回から自動ログイン」で保存されたトークンを、このタブに取り込む。
  // sessionStorage が空＝新しいタブ（＝ショートカットから開いた場合）なので、
  // チェックが入っていなければここで何も起きず、ログイン画面が出る
  if(!getToken()){
    const saved=localStorage.getItem(TOKEN_KEY);
    if(saved)sessionStorage.setItem(TOKEN_KEY,saved);
  }

  // スタッフ登録でつまずいたときの案内（?staff_error=xxx）
  const STAFF_ERR_MSG={
    disabled:'ただいまスタッフ登録を受け付けられません。管理者にお問い合わせください。',
    cancelled:'登録がキャンセルされました。',
    state:'有効期限が切れました。もう一度お試しください。',
    unverified:'このGoogleアカウントはメールアドレスが未確認のため利用できません。',
    domain:'ドットジェイピーから配布されたアカウントで登録してください。',
    already:'このアカウントは既に登録されています。ログイン画面からお進みください。',
    failed:'登録に失敗しました。時間をおいて再度お試しください。',
  };

  // Googleログインに失敗して戻ってきた場合の案内（?login_error=xxx）
  const LOGIN_ERR_MSG={
    disabled:'Googleログインはまだ設定されていません。管理者にお問い合わせください。',
    cancelled:'Googleログインがキャンセルされました。',
    state:'セッションの有効期限が切れました。もう一度お試しください。',
    unverified:'このGoogleアカウントはメールアドレスが未確認のため利用できません。',
    inactive:'このアカウントではログインできません。',
    failed:'Googleログインに失敗しました。時間をおいて再度お試しください。',
  };

  try{
    /* 設定・ログイン状態・DB・支部一覧を1回の通信でまとめて取得する。
       未ログインでも呼べるので、この1往復で画面を出すか決められる */
    let boot={config:{},user:null,branches:[]};
    try{
      const bRes=await api('/api/bootstrap');
      if(bRes.ok)boot=await bRes.json();
    }catch(e){/* 取得できないときは既定値のまま（Googleボタンは出さない） */}
    GOOGLE_LOGIN_AVAILABLE=!!boot.config.googleLogin;
    PASSWORD_RESET_AVAILABLE=!!boot.config.passwordReset;
    STAFF_EMAIL_DOMAIN=boot.config.staffEmailDomain||STAFF_EMAIL_DOMAIN;
    LOGIN_BRANCHES=boot.branches||(boot.db&&boot.db.branches)||[];

    /* スタッフの招待URL（/?staff=xxx）で開かれたときは、誰の紹介かを控えておく。
       ログイン画面の見た目はふつうのままで、会員登録に進んだときに担当スタッフへ反映する */
    if(params.get('staff'))await loadInviteStaff();

    // スタッフ登録ページ（/staff）は、ログイン状態に関わらず専用画面を出す
    if(isStaffPage){
      const verified=params.get('verified');
      const staffErr=params.get('staff_error');
      history.replaceState(null,'','/staff');
      if(verified){
        const claims=readVerifiedToken(verified);
        if(claims){
          STAFF_SIGNUP={token:verified,email:claims.email,name:claims.name||''};
          LOGIN_VIEW='staff-form';
        }else{
          LOGIN_VIEW='staff-start';
          toast('有効期限が切れました。もう一度お試しください');
        }
      }else{
        LOGIN_VIEW='staff-start';
      }
      renderLogin();
      if(staffErr)toast(STAFF_ERR_MSG[staffErr]||'登録に失敗しました');
      return;
    }

    // メールのリンクから来た場合は、ログイン状態を見る前に再設定画面を出す
    const resetToken=params.get('reset');
    if(resetToken){
      params.delete('reset');
      const q=params.toString();
      history.replaceState(null,'',location.pathname+(q?`?${q}`:''));
      await renderResetPassword(resetToken);
      return;
    }

    if(boot.user){
      await enterAppWith(boot.user,boot.db);
      startPolling();
    }else{
      // 期限切れのトークンが残っていたら消しておく（次の起動で無駄に問い合わせないため）
      clearToken();
      renderLogin();
    }
  }catch(e){
    console.warn('サーバーに接続できません',e);
    renderLogin();
  }finally{
    hideBoot();
  }

  // 成功時はフラグメント（consumeTokenFromHashが読む）、失敗時はクエリで戻ってくる
  const loginParam=hashLogin?hashLogin.login:null;
  const loginErr=params.get('login_error');
  if(loginParam||loginErr){
    params.delete('login');params.delete('login_error');
    const q=params.toString();
    history.replaceState(null,'',location.pathname+(q?`?${q}`:''));
    if(loginErr)toast(LOGIN_ERR_MSG[loginErr]||'ログインに失敗しました');
    else if(loginParam==='google')toast('Googleアカウントでログインしました');
  }

  const googleParam=params.get('google');
  if(googleParam){
    params.delete('google');
    const q=params.toString();
    history.replaceState(null,'',location.pathname+(q?`?${q}`:''));
    if(googleParam==='connected')toast('Googleカレンダーと連携しました');
    else if(googleParam==='error')toast('Googleカレンダー連携に失敗しました');
  }

  /* 全体予定表の取込用アカウントを連携して戻ってきたところ。
     続けて「どのカレンダーを表示するか」を選んでもらう */
  const sharedParam=params.get('shared_calendar');
  if(sharedParam){
    params.delete('shared_calendar');
    const q=params.toString();
    history.replaceState(null,'',location.pathname+(q?`?${q}`:''));
    if(sharedParam==='connected'){
      toast('取込用アカウントを連携しました');
      /* ログインの復元が終わるまで ME は入っていない。
         入るのを少し待ってから設定画面を開く（最大6秒であきらめる） */
      let tries=0;
      const timer=setInterval(()=>{
        if(ME&&ME.role==='admin'){clearInterval(timer);openSharedCalendarSettings();}
        else if(++tries>20)clearInterval(timer);
      },300);
    }
  }
})();
</script>
