services:
  - type: web
    name: ops-nittyou-app
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    # rootDir を指定すると、Renderは server/ の中が変わらないpushでは
    # ビルドをスキップしてしまう。画面まわりのファイルはリポジトリ直下に
    # あるため、それらもビルド対象として明示する必要がある。
    #
    # ※ このサービスはBlueprint管理ではないため、下の buildFilter は
    #   実際には効いていない（envVars が反映されないのと同じ理由）。
    #   実際に効いているのは、Renderダッシュボードの
    #   Settings → Build Filters → Included Paths に登録した同じ内容
    #   （2026-07-29に設定済み）。ここは設定内容の控えとして残している。
    buildFilter:
      paths:
        - server/**
        - index.html
        - style.css
        - privacy.html
        - terms.html
        # 2026-08-05に追加。アカウント無しの面談申請ページ。
        # これが抜けていたため、apply.html だけを直したpushがビルドされず、
        # 「pushしたのに本番が変わらない」状態になった
        - apply.html
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://ops-nittyou-app.onrender.com
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # ログイン用リダイレクトURI（/api/auth/google/login/callback）は
      # 2026-07-27 に Google Cloud Console へ登録済み。OAuth同意画面も公開済みのため有効化
      - key: GOOGLE_LOGIN_ENABLED
        value: "true"
      # メール送信の接続先。SMTP_USER と SMTP_PASS の両方がそろったときだけ
      # 再設定メール・面談メールが有効になる。
      #
      # ※ Renderの無料プランは2025年9月から、SMTPポート（25/465/587）への
      #   外向き通信を遮断している。Gmailの smtp.gmail.com:465 は無料プランでは
      #   接続タイムアウトになり、絶対に送れない。
      #   遮断されていないポート2525を提供している配信サービスを使うこと。
      #   例）Brevo（無料300通/日・カード登録不要）
      #     SMTP_HOST=smtp-relay.brevo.com / SMTP_PORT=2525
      #     SMTP_USER・SMTP_PASS はBrevoが発行するSMTPキー
      #     MAIL_FROM に、Brevoで認証済みの差出人アドレスを入れる
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
