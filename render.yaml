services:
  - type: web
    name: ops-nittyou-app
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://ops-nittyou-app.onrender.com
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: STAFF_SIGNUP_SECRET
        sync: false
      # Google Cloud Console にログイン用リダイレクトURI
      # （https://ops-nittyou-app.onrender.com/api/auth/google/login/callback）を
      # 登録し終えてから "true" に変更すると、ログイン画面にGoogleボタンが表示される
      - key: GOOGLE_LOGIN_ENABLED
        value: "false"
