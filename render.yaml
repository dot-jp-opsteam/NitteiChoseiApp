services:
  - type: web
    name: ops-nittyou-app
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://ops-nittyou-app.onrender.com
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: STAFF_SIGNUP_SECRET
        sync: false
      # ログイン用リダイレクトURI（/api/auth/google/login/callback）は
      # 2026-07-27 に Google Cloud Console へ登録済み。OAuth同意画面も公開済みのため有効化
      - key: GOOGLE_LOGIN_ENABLED
        value: "true"
      # パスワード再設定メールの送信元。SMTP_PASS はGoogleの「アプリパスワード」16文字
      # （ログインパスワードではない）。両方そろったときだけ再設定機能が有効になる
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
