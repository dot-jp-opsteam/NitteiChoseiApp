services:
  - type: web
    name: ops-nittyou-app
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    # rootDir を指定すると、Renderは server/ の中が変わらないpushでは
    # ビルドをスキップしてしまう。画面まわりのファイルはリポジトリ直下に
    # あるため、それらもビルド対象として明示する必要がある。
    #
    # ※ このサービスはBlueprint管理ではないため、下の buildFilter は
    #   実際には効いていない（envVars が反映されないのと同じ理由）。
    #   実際に効いているのは、Renderダッシュボードの
    #   Settings → Build Filters → Included Paths に登録した内容のほう。
    #   ここは設定内容の控えとして残している。
    #
    # ※ 2026-08-06に確認したところ、ダッシュボードのIncluded Pathsは
    #   **空だった**。2026-07-29に設定したつもりが保存されていなかったらしい。
    #   つまり実際に効いていたのは rootDir だけで、index.html・style.css・
    #   apply.html だけを直したpushは、どれもビルドされていなかった。
    #   同日、下の6件をダッシュボードへ登録し直して一致させた。
    #
    # ※ ここを直したときは、必ずダッシュボードも同じ内容に直すこと。
    #   このファイルだけ直しても本番には何も起きない。
    buildFilter:
      paths:
        - server/**
        - index.html
        - style.css
        - privacy.html
        - terms.html
        # アカウント無しの面談申請ページ
        - apply.html
        # アカウント無しの公開出欠回答ページ
        - attendance.html
        # 祝日の計算（index.html と apply.html の両方が読む）
        - holidays.js
        # プッシュ通知の受け取り役（Service Worker）
        - sw.js
        # アプリのアイコンと、ホーム画面に追加するための情報
        - icon.svg
        - icon-512.png
        - icon-192.png
        - icon-120.png
        - manifest.webmanifest
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://ops-nittyou-app.onrender.com
      # 初期管理者のメールアドレス。このアドレスでGoogleログインすると管理者になる
      # （パスワードは使わないので SEED_ADMIN_PASSWORD は不要）
      - key: SEED_ADMIN_EMAIL
        sync: false
      # ログイン用リダイレクトURI（/api/auth/google/login/callback）は
      # 2026-07-27 に Google Cloud Console へ登録済み。OAuth同意画面も公開済みのため有効化
      - key: GOOGLE_LOGIN_ENABLED
        value: "true"
      # メール送信の接続先。SMTP_USER と SMTP_PASS の両方がそろったときだけ
      # 再設定メール・面談メールが有効になる。
      #
      # ※ Renderの無料プランは2025年9月から、SMTPポート（25/465/587）への
      #   外向き通信を遮断している。Gmailの smtp.gmail.com:465 は無料プランでは
      #   接続タイムアウトになり、絶対に送れない。
      #   遮断されていないポート2525を提供している配信サービスを使うこと。
      #   例）Brevo（無料300通/日・カード登録不要）
      #     SMTP_HOST=smtp-relay.brevo.com / SMTP_PORT=2525
      #     SMTP_USER・SMTP_PASS はBrevoが発行するSMTPキー
      #     MAIL_FROM に、Brevoで認証済みの差出人アドレスを入れる
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # ブラウザのプッシュ通知（Web Push）。費用は0円で、外部サービスも要らない。
      # VAPIDという鍵を1組作って、公開鍵と秘密鍵をここに入れる。
      #   作り方（server/ で1回だけ）：
      #     node -e "const w=require('web-push');const k=w.generateVAPIDKeys();console.log(k)"
      # 秘密鍵はこのファイルにも、リポジトリのどこにも置かないこと（sync:false）。
      # 両方そろったときだけ通知が有効になり、片方でも欠けると静かに無効のまま動く。
      # 鍵を作り直すと、いま登録されている購読はすべて無効になり、
      # 全員に設定し直してもらうことになるので注意。
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # 通知の配信元として名乗る連絡先。mailto: か https: で始める
      - key: VAPID_SUBJECT
        value: mailto:ops@dot-jp.or.jp
