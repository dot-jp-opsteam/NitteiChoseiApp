<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>表で日程調整 | OPS日調アプリ</title><link rel="icon" href="/icon-120.png"><link rel="stylesheet" href="/style.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ops_theme_v1')==='dark'?'dark':'light';}catch(e){}</script>
<script src="/tally-model.js" defer></script><script src="/tally-ui.js" defer></script>
</head>
<body>
<main class="tly-page">
<header class="tly-header"><span class="tly-brand">OPS 日調アプリ / 表で日程調整</span><button class="btn ghost" id="theme" type="button">テーマ切替</button></header>
<section class="tly-card"><h1 id="title">読み込んでいます…</h1><p id="description" class="tly-pre"></p><div id="board-status" class="tly-status" role="status"></div><div class="tly-actions"><button class="btn pri" id="open-answer" type="button" hidden>自分の都合を回答する</button><button class="btn ghost" id="refresh" type="button">集計を更新</button></div><div id="own-links"></div></section>
<section class="tly-card" id="answer-card" hidden><h2 id="answer-heading">自分の都合を回答する</h2><p class="tly-muted">このURLを知っている人に名前・空き時間・コメントが表示されます。</p>
<form id="answer-form"><label class="tly-field" for="name">名前（必須）<input id="name" name="name" required maxlength="80" autocomplete="name"></label><label class="tly-field" for="note">コメント（任意）<textarea id="note" name="note" rows="2" maxlength="500"></textarea></label>
<p class="tly-muted">参加できるマスを○にしてください。タップ・クリック・キーボードで選択できます。押したままなぞるとまとめて選べます（スマホは少し長押し）。全マス未選択でも回答できます。</p><div id="editor"></div><p id="choice-status" class="tly-muted" aria-live="polite"></p><div id="form-status" class="tly-status" role="status" aria-live="polite"></div><div class="tly-actions"><button class="btn pri" id="submit" type="submit">回答を送る</button><button class="btn ghost" id="hide-answer" type="button">閉じる</button></div></form><div id="receipt"></div></section>
<section class="tly-card" id="summary-card" hidden><h2>みんなの都合</h2><div id="summary"></div><div id="inspect" class="tly-status" role="status"></div></section>
<p class="tly-muted">共有URLを受け取った方は、ログインせずに回答できます。</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),M=()=>window.TallyModel,U=()=>window.TallyUI;
const match=/^\/t\/(?:manage\/([a-f0-9]{48})|([a-f0-9]{32}))\/?$/.exec(location.pathname);
let editToken=match?.[1]||null,boardToken=match?.[2]||null,board=null,responses=[],ownResponse=null,formBoard=null,editor=null,selectedIds=null,pending=null,saved=false,busy=false,refreshing=false,ownLinks=[];
const draftKey=()=> 'ops_tally_draft_'+boardToken,myKey=()=> 'ops_tally_my_'+boardToken;
const read=key=>{try{return JSON.parse(localStorage.getItem(key));}catch{return null;}};
const store=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value));}catch{}};
function random(){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');}
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(data.error||'通信に失敗しました');e.status=r.status;e.code=data.code;throw e;}return data;}
function status(text,actions=[]){$('form-status').replaceChildren(document.createTextNode(text));for(const [label,action] of actions){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=label;b.onclick=action;$('form-status').append(document.createElement('br'),b);}}
function draft(){if(!formBoard)return;store(draftKey(),{name:$('name').value,note:$('note').value,selected:editor?.getSelected()||[],pending});}
function drawHeader(){document.title=board.config.title+' | 表で日程調整';$('title').textContent=board.config.title;$('description').textContent=board.config.description;$('board-status').textContent=board.active?'URLを共有して、みんなの空き時間を集めましょう。':'回答の受付は停止しています。集計は引き続き確認できます。';$('open-answer').hidden=!!editToken||!board.active;}
function drawSummary(){if(selectedIds!==null)selectedIds=selectedIds.filter(id=>responses.some(p=>p.id===id));U().renderSummary($('summary'),board.config,responses,{selectedIds:selectedIds===null?undefined:selectedIds,onFilter:ids=>selectedIds=ids,onInspect:inspect});$('summary-card').hidden=false;$('inspect').textContent='';}
function inspect(id){const c=M().tally(board.config,responses,selectedIds).cells[id];const names=ids=>ids.map(id=>{const p=responses.find(p=>p.id===id);return p.name+' #'+(responses.indexOf(p)+1);}).join('、')||'なし';$('inspect').textContent=U().cellLabel(board.config,id)+'\n○ 参加できる: '+names(c.yes)+'\n× 参加できない: '+names(c.no)+'\n未回答: '+names(c.unknown);}
function drawOwnLinks(){const holder=$('own-links');holder.replaceChildren();for(const item of ownLinks){if(!/^[a-f0-9]{48}$/.test(item.token))continue;const a=document.createElement('a');a.className='tly-link';a.href='/t/manage/'+item.token;a.textContent=(item.name||'自分')+'の回答を編集する';holder.append(a);}}
function installEditor(config,selected){editor?.destroy();editor=U().renderEditor($('editor'),config,{selected,onChange(){choice();draft();}});choice();}
function choice(){const n=editor.getSelected().length;$('choice-status').textContent=n?n+'マス選択中':'今回は参加できる時間がありません（このまま回答できます）';}
function openForm(){if(saved){$('answer-card').hidden=false;return;}$('answer-card').hidden=false;$('name').focus();}
function receipt(token,name,message='回答を保存しました。'){const holder=$('receipt');holder.replaceChildren();const h=document.createElement('h3');h.textContent=message;const p=document.createElement('p');p.className='tly-muted';p.textContent='本人専用の編集リンクです。必ず控えてください。このリンクを知っている人は、あなたの回答を変更できます。';const a=document.createElement('a');a.className='tly-link';a.href='/t/manage/'+token;a.textContent=location.origin+'/t/manage/'+token;const copy=document.createElement('button');copy.type='button';copy.className='btn';copy.textContent='編集リンクをコピー';copy.onclick=async()=>{try{await navigator.clipboard.writeText(a.href);status('編集リンクをコピーしました。');}catch{const range=document.createRange();range.selectNodeContents(a);getSelection().removeAllRanges();getSelection().addRange(range);status('表示したリンクを選択してコピーしてください。');}};holder.append(h,p,a,copy);if(!ownLinks.some(x=>x.token===token))ownLinks.push({token,name});store(myKey(),ownLinks);drawOwnLinks();}
async function refresh(){if(!boardToken||refreshing)return;refreshing=true;try{const data=await api('/api/tally/'+boardToken);board=data.board;responses=data.responses;drawHeader();drawSummary();}catch(e){$('board-status').textContent=e.message;}finally{refreshing=false;}}
async function reloadForm(staleResponse=false){try{
 let data;if(editToken){data=await api('/api/tally/manage/'+editToken);board=data.board;if(staleResponse)ownResponse=data.response;}else{data=await api('/api/tally/'+boardToken);board=data.board;responses=data.responses;}
 const old=editor.getSelected(),valid=new Set(M().activeCells(board.config));const kept=old.filter(id=>valid.has(id));
 formBoard=structuredClone(board);
 if(staleResponse){$('name').value=ownResponse.name;$('note').value=ownResponse.note;installEditor(board.config,ownResponse.selected);status('最新の回答を読み込みました。内容を確認してから編集してください。');}
 else {installEditor(board.config,kept);status('最新の表を読み込みました。選択は保持しました。非表示になった'+(old.length-kept.length)+'マスを外しました。');}
 pending=null;draft();drawHeader();await refresh();
 }catch(e){status(e.message);}}
async function submit(event){event.preventDefault();if(busy||saved)return;if(!pending&&!$('answer-form').reportValidity())return;busy=true;$('submit').disabled=true;
 const wasPending=!!pending;let payload;
 try{
  if(editToken)payload={name:$('name').value,note:$('note').value,selected:editor.getSelected(),boardRevision:formBoard.revision,responseRevision:ownResponse.revision};
  else {if(!pending){pending={payload:{name:$('name').value,note:$('note').value,selected:editor.getSelected(),boardRevision:formBoard.revision,submissionKey:random(),editToken:random()}};draft();}payload=pending.payload;}
  const ack=await api(editToken?'/api/tally/manage/'+editToken:'/api/tally/'+boardToken+'/responses',editToken?'PUT':'POST',payload);
  const token=editToken||payload.editToken,changed=payload.name!==$('name').value||payload.note!==$('note').value||JSON.stringify([...payload.selected].sort())!==JSON.stringify([...editor.getSelected()].sort());
  pending=null;saved=true;store(draftKey(),null);$('submit').textContent='保存済み';
  receipt(token,payload.name,wasPending?'前回の送信を確認しました。':'回答を保存しました。');
  status(changed?'前回送信した内容が保存されています。送信後に入力した変更は未保存です。上の編集リンクから変更してください。':'保存した回答は、本人専用リンクから変更できます。');
  $('answer-card').hidden=false;await refresh();
 }catch(e){
  // 未確認の送信の再試行では、HTTPエラーでも元のキーを失わない。
  // 最初の送信が4xxで拒否された場合だけ、未保存と確定して入力をやり直せる。
  if(e.status&&e.status<500&&!wasPending){pending=null;draft();}
  if(e.code==='stale_board')status(e.message,[['入力を保持して最新の表を読み込む',()=>reloadForm(false)]]);
  else if(e.code==='stale_response')status(e.message+' 現在の入力はまだ保存されていません。',[['現在の入力を破棄して最新の回答を確認する',()=>reloadForm(true)]]);
  else if(pending)status('送信結果を確認できませんでした。入力と送信キーは保持しています。前回と同じ内容で確認します。',[['前回の送信結果を確認する',()=>submit(new Event('submit'))]]);
  else status(e.message||'通信に失敗しました。入力は保持しています。');
 }finally{busy=false;$('submit').disabled=saved;$('submit').textContent=saved?'保存済み':pending?'前回の送信結果を確認する':editToken?'変更を保存':'回答を送る';}}
async function boot(){if(!match){$('title').textContent='リンクを確認してください';return;}try{
 const data=await api(editToken?'/api/tally/manage/'+editToken:'/api/tally/'+boardToken);board=data.board;boardToken=board.token;ownResponse=data.response||null;responses=data.responses||[];formBoard=structuredClone(board);
 const raw=read(myKey());ownLinks=Array.isArray(raw)?raw.filter(x=>x&&typeof x.token==='string'&&typeof x.name==='string'):[];drawOwnLinks();
 const savedDraft=editToken?null:read(draftKey());pending=savedDraft?.pending&&typeof savedDraft.pending.payload?.editToken==='string'?savedDraft.pending:null;
 $('name').value=ownResponse?.name||savedDraft?.name||'';$('note').value=ownResponse?.note||savedDraft?.note||'';
 installEditor(board.config,ownResponse?.selected||savedDraft?.selected||[]);drawHeader();drawSummary();
 if(editToken){$('answer-card').hidden=false;$('answer-heading').textContent='自分の回答を編集';$('submit').textContent='変更を保存';await refresh();}
 if(pending){$('answer-card').hidden=false;$('submit').textContent='前回の送信結果を確認する';status('前回の送信結果が未確認です。同じ送信キーで保存済みか確認します。');}
 }catch(e){$('title').textContent='表を開けませんでした';$('board-status').textContent=e.message;}}
$('answer-form').addEventListener('submit',submit);$('name').addEventListener('input',draft);$('note').addEventListener('input',draft);$('open-answer').onclick=openForm;$('hide-answer').onclick=()=>{$('answer-card').hidden=true;};$('refresh').onclick=refresh;
$('theme').onclick=()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('ops_theme_v1',theme);}catch{}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();});window.addEventListener('focus',()=>refresh());window.addEventListener('DOMContentLoaded',boot);
</script>
</body></html>
